      <div class="field"><label>Date</label><input type="date" name="date" value="${escapeHtml(a.date||todayIso())}" autofocus required></div>
      <div class="field"><label>Motif</label><input name="motif" value="${escapeHtml(a.motif||'')}" required></div>
      <div class="field"><label>Durée</label><input name="duree" value="${escapeHtml(a.duree||'')}" placeholder="ex. 1 jour, 2 demi-journées" required></div>
      ${a.byAdmin ? `
      <div class="field"><label>Statut</label>
        <select name="statut">
          <option value="validée" ${a.statut==='validée'?'selected':''}>Validée</option>
          <option value="en attente" ${a.statut==='en attente'?'selected':''}>En attente</option>
          <option value="refusée" ${a.statut==='refusée'?'selected':''}>Refusée</option>
        </select>
      </div>` : `<p class="field-hint">Votre demande sera transmise avec le statut « en attente ».</p>`}`;
  }
  else if(mo.type === 'edit-formation'){
    const f = mo.data;
    title = f.id ? 'Modifier la formation' : 'Ajouter une formation';
    body = `
      <div class="field"><label>Titre</label><input name="title" value="${escapeHtml(f.title||'')}" autofocus required></div>
      <div class="field"><label>Description</label><textarea name="description" rows="3">${escapeHtml(f.description||'')}</textarea></div>
      <div class="form-grid">
        <div class="field"><label>Date</label><input type="date" name="date" value="${escapeHtml(f.date||todayIso())}" required></div>
        <div class="field"><label>Lieu</label><input name="lieu" value="${escapeHtml(f.lieu||'')}" required></div>
      </div>
      <div class="field"><label>Date limite d'inscription</label><input type="date" name="dateLimite" value="${escapeHtml(f.dateLimite||'')}"></div>
      <div class="field"><label>Places</label><input type="number" min="1" name="places" value="${f.places||20}" required></div>`;
  }
  else if(mo.type === 'edit-exam'){
    const e = mo.data;
    title = e.id ? 'Modifier l\'examen' : 'Ajouter un examen';
    const classOptions = (data.classes||[]).map(c => `
      <option value="${escapeHtml(c)}" ${e.classes && e.classes.includes(c) ? 'selected' : ''}>${escapeHtml(c)}</option>
    `).join('');
    body = `
      <div class="field"><label>Titre</label><input name="title" value="${escapeHtml(e.title||'')}" autofocus required></div>
      <div class="field"><label>Date</label><input type="date" name="date" value="${escapeHtml(e.date||todayIso())}" required></div>
      <div class="field"><label>Classes concernées</label>
        <select name="classes" multiple size="4" style="height:auto;">
          ${classOptions}
        </select>
        <div class="field-hint">Ctrl (Cmd) pour sélectionner plusieurs.</div>
      </div>
      <div class="field">
        <label>Statut</label>
        <select name="published">
          <option value="true" ${e.published ? 'selected' : ''}>Publié</option>
          <option value="false" ${!e.published ? 'selected' : ''}>Brouillon</option>
        </select>
      </div>`;
  }
  else if(mo.type === 'manage-classes'){
    title = 'Gérer les classes';
    const classList = (data.classes||[]).map(c => `<div class="row-item">
      <div class="ri-main"><div class="ri-title">${escapeHtml(c)}</div></div>
      <div class="row-actions"><button class="btn btn-danger btn-icon btn-sm" data-action="delete-class" data-name="${escapeHtml(c)}">${icon('trash')}</button></div>
    </div>`).join('') || `<div class="empty-note">Aucune classe définie.</div>`;
    body = `
      <div class="row-list">${classList}</div>
      <div style="margin-top:12px;">
        <form data-form="add-class" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <input type="text" name="className" placeholder="Nom (ex: 6A)" required style="flex:1;padding:8px 12px;border:1px solid var(--line);border-radius:6px;font-size:14px;min-width:100px;">
          <button class="btn btn-primary btn-sm" type="submit">${icon('plus')} Ajouter</button>
        </form>
      </div>`;
    footer = `<button class="btn" data-action="close-modal">Fermer</button>`;
  }
  else if(mo.type === 'add-document'){
    title = 'Ajouter un document';
    body = `
      <div class="field"><label>Fichier</label><input type="file" name="file" required accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,.jpg,.png,.jpeg,.gif"></div>
      <div class="field"><label>Description (optionnel)</label><textarea name="description" rows="2"></textarea></div>
    `;
    footer = `
      <button class="btn" data-action="close-modal">Annuler</button>
      <button class="btn btn-primary" type="submit" form="modal-form">${icon('upload')} Télécharger</button>`;
  }
  else if(mo.type === 'add-transaction'){
    title = 'Nouvelle dépense';
    body = `
      <div class="field"><label>Libellé</label><input name="name" autofocus required></div>
      <div class="field"><label>Montant (€)</label><input type="number" name="amount" step="0.01" required></div>
    `;
    footer = `
      <button class="btn" data-action="close-modal">Annuler</button>
      <button class="btn btn-primary" type="submit" form="modal-form">${icon('check')} Ajouter</button>`;
  }
  else if(mo.type === 'add-notification'){
    title = 'Nouvelle notification';
    body = `
      <div class="field"><label>Titre</label><input name="title" autofocus required></div>
      <div class="field"><label>Message (optionnel)</label><textarea name="message" rows="3"></textarea></div>
      <div class="field"><label>Date d'expiration (optionnelle)</label><input type="date" name="expiry"></div>
    `;
    footer = `
      <button class="btn" data-action="close-modal">Annuler</button>
      <button class="btn btn-primary" type="submit" form="modal-form">${icon('check')} Créer</button>`;
  }

  // Pour toutes les modales, on retire l'attribut data-action sur l'overlay
  return `<div class="overlay">
    <div class="modal" data-stop>
      <div class="modal-head"><h3>${title}</h3><button class="btn btn-ghost btn-icon" data-action="close-modal">${icon('x')}</button></div>
      <form id="modal-form" data-form="modal">
        <div class="modal-body">${body}</div>
        <div class="modal-foot">${footer}</div>
      </form>
    </div></div>`;
}

/* ---------------------------- ACTIONS ---------------------------- */
function openModal(type, data_){ state.modal = { type, data: data_ || {} }; render(); }
function closeModal(){ state.modal = null; render(); }

function findModule(id){ return data.modules.find(m => m.id === id); }

document.addEventListener('click', function(e){
  if(state.notifOpen && !e.target.closest('.notif-wrap')){ state.notifOpen = false; render(); return; }
  // Ne plus fermer la modale en cliquant sur l'overlay
  // On supprime la vérification qui fermait la modale via overlay
  // const overlay = e.target.closest('[data-action="overlay-close"]');
  // if(overlay && e.target === overlay){ closeModal(); return; }

  const iconPick = e.target.closest('[data-action="pick-icon"]');
  if(iconPick){
    document.querySelectorAll('.icon-pick').forEach(el => el.classList.remove('selected'));
    iconPick.classList.add('selected');
    document.getElementById('icon-hidden').value = iconPick.dataset.icon;
    return;
  }

  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;
  if(action !== 'toggle-notif') state.notifOpen = false;

  switch(action){
    case 'toggle-notif': state.notifOpen = !state.notifOpen; render(); break;
    case 'go-dashboard': state.route='dashboard'; state.editMode=false; state.selectedProfId=null; state.expandedFormationId=null; render(); break;
    case 'go-settings': state.route='settings'; render(); break;
    case 'go-account': state.route='account'; state.accountMsg=''; render(); break;
    case 'toggle-theme': state.theme = state.theme==='dark' ? 'light' : 'dark'; saveTheme(state.theme); render(); break;
    case 'open-module': state.route='module:'+btn.dataset.id; state.editMode=false; state.selectedProfId=null; state.expandedFormationId=null; render(); break;
    case 'logout': session=null; saveSessionUserId(null); state.route='dashboard'; render(); break;
    case 'toggle-edit': state.editMode = !state.editMode; render(); break;
    case 'settings-tab': state.settingsTab = btn.dataset.tab; render(); break;
    case 'close-modal': closeModal(); break;
    case 'filter-exams': state.examFilter = btn.dataset.filter; render(); break;
    case 'toggle-banner': data.banner.enabled = !data.banner.enabled; saveData(); render(); break;
    case 'toggle-maintenance': {
      data.maintenance.enabled = !data.maintenance.enabled;
      saveData(); render();
      break;
    }

    case 'select-tab': state.activeTabId[btn.dataset.mid] = btn.dataset.tid; render(); break;
    case 'add-tab': openModal('add-tab', { mid: btn.dataset.mid, name:'' }); break;
    case 'rename-tab': {
      const m = findModule(btn.dataset.mid); const t = m.tabs.find(x=>x.id===btn.dataset.tid);
      openModal('rename-tab', { mid:m.id, tid:t.id, name:t.name });
      break; }
    case 'edit-tab-content': {
      const m = findModule(btn.dataset.mid); const t = m.tabs.find(x=>x.id===btn.dataset.tid);
      openModal('edit-tab-content', { mid:m.id, tid:t.id, name:t.name, content:t.content });
      break; }
    case 'delete-tab': {
      state.modal = { type:'confirm', title:'Supprimer cet onglet', message:'Cette action est définitive. Voulez-vous continuer ?',
        onConfirm: () => { const m=findModule(btn.dataset.mid); m.tabs = m.tabs.filter(t=>t.id!==btn.dataset.tid); saveData(); } };
      render(); break; }
    case 'move-tab': {
      const m = findModule(btn.dataset.mid); const idx = m.tabs.findIndex(t=>t.id===btn.dataset.tid);
      const dir = btn.dataset.dir==='up'?-1:1; const j = idx+dir;
      if(j>=0 && j<m.tabs.length){ [m.tabs[idx],m.tabs[j]]=[m.tabs[j],m.tabs[idx]]; saveData(); render(); }
      break; }

    case 'add-post': openModal('edit-post', { mid: btn.dataset.mid }); break;
    case 'edit-post': {
      const m = findModule(btn.dataset.mid); const p = m.posts.find(x=>x.id===btn.dataset.pid);
      openModal('edit-post', { mid:m.id, id:p.id, title:p.title, body:p.body });
      break; }
    case 'delete-post': {
      state.modal = { type:'confirm', title:'Supprimer cette annonce', message:'Cette action est définitive. Continuer ?',
        onConfirm: () => { const m=findModule(btn.dataset.mid); m.posts = m.posts.filter(p=>p.id!==btn.dataset.pid); saveData(); } };
      render(); break; }

    case 'add-stat': openModal('edit-stat', {}); break;
    case 'edit-stat': { const s = data.stats.find(x=>x.id===btn.dataset.id); openModal('edit-stat', {...s}); break; }
    case 'delete-stat': {
      state.modal = { type:'confirm', title:'Supprimer cette statistique', message:'Cette carte disparaîtra du tableau de bord. Continuer ?',
        onConfirm: () => { data.stats = data.stats.filter(s=>s.id!==btn.dataset.id); saveData(); } };
      render(); break; }

    case 'add-module': openModal('edit-module', { type:'tabs', icon:'folder' }); break;
    case 'edit-module': { const m = data.modules.find(x=>x.id===btn.dataset.id); openModal('edit-module', {...m}); break; }
    case 'delete-module': {
      state.modal = { type:'confirm', title:'Supprimer ce module', message:'Le module et tout son contenu seront supprimés. Continuer ?',
        onConfirm: () => { data.modules = data.modules.filter(m=>m.id!==btn.dataset.id); saveData(); if(state.route==='module:'+btn.dataset.id) state.route='dashboard'; } };
      render(); break; }
    case 'move-module': {
      const idx = data.modules.findIndex(m=>m.id===btn.dataset.id);
      const dir = btn.dataset.dir==='up'?-1:1; const j = idx+dir;
      if(j>=0 && j<data.modules.length){ [data.modules[idx],data.modules[j]]=[data.modules[j],data.modules[idx]]; saveData(); render(); }
      break; }

    case 'add-user': openModal('edit-user', { role:'user' }); break;
    case 'edit-user': { const u = data.users.find(x=>x.id===btn.dataset.id); openModal('edit-user', {...u}); break; }
    case 'delete-user': {
      if(btn.disabled) break;
      state.modal = { type:'confirm', title:"Supprimer cet utilisateur", message:'Ce compte ne pourra plus se connecter. Continuer ?',
        onConfirm: () => {
          const uid_ = btn.dataset.id;
          const prof = data.users.find(u=>u.id===uid_);
          data.users = data.users.filter(u=>u.id!==uid_);
          if(data.dossiers) delete data.dossiers[uid_];
          (data.formations||[]).forEach(f => { f.inscrits = f.inscrits.filter(id=>id!==uid_); });
          if(state.selectedProfId === uid_) state.selectedProfId = null;
          logActivity(`Compte supprimé : ${prof?prof.displayName:uid_}`);
          saveData();
        } };
      render(); break; }

    case 'select-prof': {
      // Naviguer vers le module personnel avec ce professeur sélectionné
      state.selectedProfId = btn.dataset.id;
      state.route = 'module:personnel';
      render();
      break; }
    case 'back-to-roster': state.selectedProfId = null; render(); break;
    case 'print-dossier': window.print(); break;

    case 'add-affectation': openModal('edit-affectation', { uid: btn.dataset.uid }); break;
    case 'edit-affectation': {
      const dos = ensureDossier(btn.dataset.uid); const a = dos.affectations.find(x=>x.id===btn.dataset.aid);
      openModal('edit-affectation', { uid: btn.dataset.uid, ...a });
      break; }
    case 'delete-affectation': {
      state.modal = { type:'confirm', title:'Supprimer cette affectation', message:'Cette action est définitive. Continuer ?',
        onConfirm: () => { const dos=ensureDossier(btn.dataset.uid); dos.affectations = dos.affectations.filter(a=>a.id!==btn.dataset.aid); saveData(); } };
      render(); break; }

    case 'add-absence': openModal('edit-absence', { uid: btn.dataset.uid, byAdmin: isAdmin() }); break;
    case 'validate-absence': {
      const dos = ensureDossier(btn.dataset.uid); const a = dos.absences.find(x=>x.id===btn.dataset.aid);
      if(a){ a.statut='validée'; const prof=data.users.find(u=>u.id===btn.dataset.uid); logActivity(`Absence validée pour ${prof?prof.displayName:'un professeur'} (${a.date})`); saveData(); render(); }
      break; }
    case 'refuse-absence': {
      const dos = ensureDossier(btn.dataset.uid); const a = dos.absences.find(x=>x.id===btn.dataset.aid);
      if(a){ a.statut='refusée'; const prof=data.users.find(u=>u.id===btn.dataset.uid); logActivity(`Absence refusée pour ${prof?prof.displayName:'un professeur'} (${a.date})`); saveData(); render(); }
      break; }
    case 'delete-absence': {
      state.modal = { type:'confirm', title:'Supprimer cette absence', message:'Cette action est définitive. Continuer ?',
        onConfirm: () => { const dos=ensureDossier(btn.dataset.uid); dos.absences = dos.absences.filter(a=>a.id!==btn.dataset.aid); saveData(); } };
      render(); break; }

    case 'add-formation': openModal('edit-formation', {}); break;
    case 'edit-formation': { const f = data.formations.find(x=>x.id===btn.dataset.id); openModal('edit-formation', {...f}); break; }
    case 'delete-formation': {
      state.modal = { type:'confirm', title:'Supprimer cette formation', message:'Les inscriptions seront perdues. Continuer ?',
        onConfirm: () => { data.formations = data.formations.filter(f=>f.id!==btn.dataset.id); saveData(); } };
      render(); break; }
    case 'toggle-formation-inscrits': state.expandedFormationId = (state.expandedFormationId===btn.dataset.id) ? null : btn.dataset.id; render(); break;
    case 'toggle-inscription': {
      const f = data.formations.find(x=>x.id===btn.dataset.id);
      if(!f) break;
      const already = f.inscrits.includes(session.id);
      if(already){ f.inscrits = f.inscrits.filter(id=>id!==session.id); }
      else if(f.inscrits.length < f.places){ f.inscrits.push(session.id); }
      saveData(); render(); break; }

    case 'add-exam': openModal('edit-exam', { classes: [], published: true }); break;
    case 'edit-exam': { const e = data.examens.find(x=>x.id===btn.dataset.id); openModal('edit-exam', {...e}); break; }
    case 'delete-exam': {
      state.modal = { type:'confirm', title:'Supprimer cet examen', message:'Cette action est définitive. Continuer ?',
        onConfirm: () => { data.examens = data.examens.filter(e=>e.id!==btn.dataset.id); saveData(); } };
      render(); break; }
    case 'toggle-exam-publish': {
      const e = data.examens.find(x=>x.id===btn.dataset.id);
      if(e){ e.published = !e.published; saveData(); render(); }
      break; }
    case 'manage-classes': openModal('manage-classes', {}); break;
    case 'delete-class': {
      const name = btn.dataset.name;
      data.classes = data.classes.filter(c => c !== name);
      data.examens.forEach(e => { e.classes = e.classes.filter(c => c !== name); });
      saveData(); render(); break; }

    case 'add-document': openModal('add-document', {}); break;
    case 'delete-document': {
      state.modal = { type:'confirm', title:'Supprimer ce document', message:'Cette action est définitive. Continuer ?',
        onConfirm: () => { data.documents = data.documents.filter(d=>d.id!==btn.dataset.id); saveData(); } };
      render(); break; }

    case 'add-transaction': openModal('add-transaction', {}); break;
    case 'delete-transaction': {
      const trans = data.budget.transactions || [];
      data.budget.transactions = trans.filter(t => t.id !== btn.dataset.id);
      // Recalculer depenses
      data.budget.depenses = data.budget.transactions.reduce((sum, t) => sum + t.amount, 0);
      saveData(); render(); break; }

    case 'add-notification': openModal('add-notification', {}); break;
    case 'delete-notification': {
      data.notifications = data.notifications.filter(n => n.id !== btn.dataset.id);
      saveData(); render(); break; }

    case 'import-csv': {
      const input = document.createElement('input');
      input.type = 'file'; input.accept = '.csv,.txt';
      input.onchange = () => {
        if(!input.files[0]) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const content = ev.target.result;
          const lines = content.split(/\r?\n/).filter(l => l.trim());
          let created = 0;
          lines.forEach(line => {
            const parts = line.split(';').map(s => s.trim());
            if(parts.length < 2) return;
            const [nom, prenom] = parts;
            const username = nom.toUpperCase();
            const password = prenom + '.2026';
            if(data.users.some(u => u.username === username)) return;
            const id = uid('u');
            data.users.push({ id, displayName: prenom + ' ' + nom, username, password, role: 'user' });
            data.dossiers[id] = { situation:'', affectations:[], salaire:{indiceMajore:400}, absences:[], soldeConges:25, matricule: nextMatricule() };
            created++;
          });
          if(created) { logActivity(`${created} compte(s) importé(s) depuis CSV`); saveData(); render(); }
          else alert('Aucun nouveau compte importé (format : NOM;Prénom)');
        };
        reader.readAsText(input.files[0]);
      };
      input.click();
      break; }

    case 'confirm-yes': { const cb = state.modal && state.modal.onConfirm; state.modal=null; if(cb) cb(); render(); break; }

    case 'export-data': {
      const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'portail-arena-donnees.json'; document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      break; }
    case 'export-personnel-csv': {
      const rows = [['Matricule','Nom','Identifiant','Établissement en cours','Indice majoré','Solde congés','Jours pris','Jours restants']];
      data.users.filter(u=>u.role==='user').forEach(u=>{
        const dos = ensureDossier(u.id);
        const enCours = dos.affectations.find(a=>!a.fin);
        const pris = dos.absences.filter(a=>a.statut==='validée').reduce((n,a)=>n+parseDureeJours(a.duree),0);
        rows.push([dos.matricule||'', u.displayName, u.username, enCours?enCours.etablissement:'', (dos.salaire&&dos.salaire.indiceMajore)||'', dos.soldeConges, pris, dos.soldeConges-pris]);
      });
      const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(';')).join('\r\n');
      const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'professeurs-'+todayIso()+'.csv'; document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      break; }
    case 'import-data': document.getElementById('import-file-input').click(); break;
  }
});

document.addEventListener('change', function(e){
  if(e.target.id === 'import-file-input' && e.target.files[0]){
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = function(ev){
      try{
        const parsed = JSON.parse(ev.target.result);
        if(!parsed.meta || !parsed.modules || !parsed.users) throw new Error('format invalide');
        data = parsed; saveData(); render();
      }catch(err){
        alert("Ce fichier n'est pas un export valide.");
      }
    };
    reader.readAsText(file);
  }
});

document.addEventListener('submit', function(e){
  e.preventDefault();
  const form = e.target;

  if(form.dataset.form === 'login'){
    const fd = new FormData(form);
    const username = (fd.get('username')||'').trim();
    const password = fd.get('password')||'';
    const user = data.users.find(u => u.username === username && u.password === password);
    if(user){ session = user; saveSessionUserId(user.id); state.loginError=''; state.route='dashboard'; render(); }
    else { state.loginError = 'Identifiant ou mot de passe incorrect.'; render(); }
    return;
  }

  if(form.dataset.form === 'maintenance-access'){
    const fd = new FormData(form);
    const pass = fd.get('password') || '';
    if(pass === (data.maintenance.password || '')){
      // Accès accordé, on le connecte en tant qu'admin ? On vérifie si un compte admin existe et on le connecte.
      const adminUser = data.users.find(u => u.role === 'admin');
      if(adminUser){
        session = adminUser;
        saveSessionUserId(adminUser.id);
        state.loginError = '';
        state.route = 'dashboard';
        render();
      } else {
        state.loginError = 'Aucun compte administrateur trouvé.';
        render();
      }
    } else {
      state.loginError = 'Mot de passe incorrect.';
      render();
    }
    return;
  }

  if(form.dataset.form === 'general'){
    const fd = new FormData(form);
    data.meta.collegeName = fd.get('collegeName').trim() || data.meta.collegeName;
    data.meta.tagline = fd.get('tagline').trim() || data.meta.tagline;
    saveData(); render(); return;
  }

  if(form.dataset.form === 'banner'){
    const fd = new FormData(form);
    data.banner.text = fd.get('text').trim();
    saveData(); render(); return;
  }

  if(form.dataset.form === 'dossier-situation'){
    const fd = new FormData(form);
    const dos = ensureDossier(form.dataset.uid);
    dos.situation = fd.get('situation');
    saveData(); render(); return;
  }

  if(form.dataset.form === 'dossier-salaire'){
    const fd = new FormData(form);
    const dos = ensureDossier(form.dataset.uid);
    const im = parseFloat(fd.get('indiceMajore'));
    dos.salaire = dos.salaire || {};
    dos.salaire.indiceMajore = isNaN(im) ? dos.salaire.indiceMajore : im;
    saveData(); render(); return;
  }

  if(form.dataset.form === 'dossier-conges'){
    const fd = new FormData(form);
    const dos = ensureDossier(form.dataset.uid);
    const solde = parseFloat(fd.get('soldeConges'));
    dos.soldeConges = isNaN(solde) ? dos.soldeConges : solde;
    saveData(); render(); return;
  }

  if(form.dataset.form === 'change-password'){
    const fd = new FormData(form);
    const current = fd.get('current'), next = fd.get('next'), confirm = fd.get('confirm');
    if(current !== session.password){ state.accountMsg = { ok:false, text:'Mot de passe actuel incorrect.' }; render(); return; }
    if(next !== confirm){ state.accountMsg = { ok:false, text:'Les deux mots de passe ne correspondent pas.' }; render(); return; }
    if(next.length < 4){ state.accountMsg = { ok:false, text:'Le mot de passe doit contenir au moins 4 caractères.' }; render(); return; }
    session.password = next;
    const u = data.users.find(x=>x.id===session.id); if(u) u.password = next;
    saveData();
    state.accountMsg = { ok:true, text:'Mot de passe mis à jour avec succès.' };
    render(); return;
  }

  if(form.dataset.form === 'add-class'){
    const fd = new FormData(form);
    const name = fd.get('className').trim();
    if(name && !data.classes.includes(name)){
      data.classes.push(name);
      saveData(); render();
    }
    return;
  }

  if(form.dataset.form === 'budget-total'){
    const fd = new FormData(form);
    if(!data.budget) data.budget = { total: 0, depenses: 0, transactions: [] };
    data.budget.total = parseFloat(fd.get('total')) || 0;
    data.budget.depenses = parseFloat(fd.get('depenses')) || 0;
    saveData(); render(); return;
  }

  if(form.dataset.form === 'maintenance'){
    const fd = new FormData(form);
    if(!data.maintenance) data.maintenance = { enabled: false, password: '', title: '', message: '' };
    data.maintenance.password = fd.get('password') || '';
    data.maintenance.title = fd.get('title') || 'Maintenance en cours';
    data.maintenance.message = fd.get('message') || 'Le portail est actuellement en maintenance. Veuillez réessayer ultérieurement.';
    saveData(); render(); return;
  }

  if(form.dataset.form === 'apparence'){
    const fd = new FormData(form);
    if(!data.customization) data.customization = { primaryColor: '#8a6a34', footerText: '' };
    data.customization.primaryColor = fd.get('primaryColor') || '#8a6a34';
    data.customization.footerText = fd.get('footerText') || 'Portail ARENA - Tous droits réservés.';
    saveData(); render(); return;
  }

  if(form.dataset.form === 'modal'){
    const mo = state.modal; const fd = new FormData(form);
    if(mo.type === 'edit-stat'){
      const value = fd.get('value').trim(), label = fd.get('label').trim();
      if(mo.data.id){ const s = data.stats.find(x=>x.id===mo.data.id); s.value=value; s.label=label; }
      else data.stats.push({ id: uid('st'), value, label });
      saveData();
    }
    else if(mo.type === 'edit-module'){
      const title = fd.get('title').trim(), description = fd.get('description').trim();
      const iconName = fd.get('icon') || 'folder'; const type = fd.get('type');
      if(mo.data.id){ const m = data.modules.find(x=>x.id===mo.data.id); m.title=title; m.description=description; m.icon=iconName; }
      else {
        const newModule = { id: uid('mod'), title, description, icon:iconName, type };
        if(type === 'tabs') newModule.tabs = [{ id: uid('tab'), name: 'Présentation', content: '## Bienvenue\n\nCe module a été créé automatiquement.' }, { id: uid('tab'), name: 'Documents', content: '## Documents\n\nAucun document pour le moment.' }];
        else if(type === 'feed') newModule.posts = [{ id: uid('post'), date: todayStr(), title: 'Bienvenue sur ce module', body: 'Bienvenue sur ce nouveau module. Le contenu sera bientôt disponible.' }];
        else if(type === 'personnel') newModule.personnel = true;
        else if(type === 'formations') newModule.formations = true;
        data.modules.push(newModule);
        logActivity(`Module créé : ${title}`);
      }
      saveData();
    }
    else if(mo.type === 'add-tab'){
      const name = fd.get('name').trim();
      const m = findModule(mo.data.mid);
      m.tabs.push({ id: uid('tab'), name, content: '' });
      saveData();
    }
    else if(mo.type === 'rename-tab'){
      const name = fd.get('name').trim();
      const m = findModule(mo.data.mid); const t = m.tabs.find(x=>x.id===mo.data.tid);
      t.name = name; saveData();
    }
    else if(mo.type === 'edit-tab-content'){
      const content = fd.get('content');
      const m = findModule(mo.data.mid); const t = m.tabs.find(x=>x.id===mo.data.tid);
      t.content = content; saveData();
    }
    else if(mo.type === 'edit-post'){
      const title = fd.get('title').trim(), body = fd.get('body');
      const m = findModule(mo.data.mid);
      if(mo.data.id){ const p = m.posts.find(x=>x.id===mo.data.id); p.title=title; p.body=body; }
      else { m.posts.push({ id: uid('post'), date: todayStr(), title, body }); logActivity(`Annonce créée : ${title}`); }
      saveData();
    }
    else if(mo.type === 'edit-user'){
      const displayName = fd.get('displayName').trim(), username = fd.get('username').trim(), password = fd.get('password'), role = fd.get('role');
      const dup = data.users.find(u => u.username === username && u.id !== mo.data.id);
      if(dup){ alert('Cet identifiant est déjà utilisé.'); return; }
      if(mo.data.id){
        const u = data.users.find(x=>x.id===mo.data.id);
        u.displayName=displayName; u.username=username; u.role=role;
        if(password) u.password = password;
        if(session && session.id === u.id) session = u;
        logActivity(`Compte modifié : ${displayName} (${username})`);
      } else {
        const id = uid('u');
        data.users.push({ id, displayName, username, password, role });
        data.dossiers[id] = { situation:'', affectations:[], salaire:{indiceMajore:400}, absences:[], soldeConges:25, matricule: nextMatricule() };
        logActivity(`Compte créé : ${displayName} (${username})`);
      }
      saveData();
    }
    else if(mo.type === 'edit-affectation'){
      const etablissement = fd.get('etablissement').trim(), debut = fd.get('debut').trim(), fin = fd.get('fin').trim();
      const dos = ensureDossier(mo.data.uid);
      const prof = data.users.find(u=>u.id===mo.data.uid);
      if(mo.data.id){
        const a = dos.affectations.find(x=>x.id===mo.data.id);
        a.etablissement=etablissement; a.debut=debut; a.fin=fin;
      } else {
        dos.affectations.push({ id: uid('aff'), etablissement, debut, fin });
      }
      logActivity(`Affectation mise à jour pour ${prof?prof.displayName:'un professeur'} : ${etablissement}`);
      saveData();
    }
    else if(mo.type === 'edit-absence'){
      const date = fd.get('date'), motif = fd.get('motif').trim(), duree = fd.get('duree').trim();
      const dos = ensureDossier(mo.data.uid);
      const prof = data.users.find(u=>u.id===mo.data.uid);
      if(mo.data.id){
        const a = dos.absences.find(x=>x.id===mo.data.id);
        a.date=date; a.motif=motif; a.duree=duree;
        if(mo.data.byAdmin) a.statut = fd.get('statut');
      } else {
        dos.absences.push({ id: uid('abs'), date, motif, duree, statut: mo.data.byAdmin ? fd.get('statut') : 'en attente' });
      }
      logActivity(`Absence enregistrée pour ${prof?prof.displayName:'un professeur'} (${date})`);
      saveData();
    }
    else if(mo.type === 'edit-formation'){
      const title = fd.get('title').trim(), description = fd.get('description').trim(), date = fd.get('date'), lieu = fd.get('lieu').trim();
      const dateLimite = fd.get('dateLimite'), places = Math.max(1, parseInt(fd.get('places'),10) || 1);
      if(mo.data.id){
        const f = data.formations.find(x=>x.id===mo.data.id);
        f.title=title; f.description=description; f.date=date; f.lieu=lieu; f.dateLimite=dateLimite; f.places=places;
        logActivity(`Formation modifiée : ${title}`);
      } else {
        data.formations.push({ id: uid('form'), title, description, date, lieu, dateLimite, places, inscrits: [] });
        logActivity(`Formation créée : ${title}`);
      }
      saveData();
    }
    else if(mo.type === 'edit-exam'){
      const title = fd.get('title').trim(), date = fd.get('date');
      const select = form.querySelector('select[name="classes"]');
      const classes = select ? Array.from(select.selectedOptions).map(opt => opt.value) : [];
      const published = fd.get('published') === 'true';
      if(mo.data.id){
        const e = data.examens.find(x=>x.id===mo.data.id);
        e.title=title; e.date=date; e.classes=classes; e.published=published;
        logActivity(`Examen modifié : ${title}`);
      } else {
        data.examens.push({ id: uid('exam'), title, date, classes, published });
        logActivity(`Examen créé : ${title}`);
      }
      saveData();
    }
    else if(mo.type === 'add-document'){
      const fileInput = form.querySelector('input[type="file"]');
      if(!fileInput || !fileInput.files[0]){
        alert('Veuillez sélectionner un fichier.');
        return;
      }
      const file = fileInput.files[0];
      const reader = new FileReader();
      reader.onload = function(ev){
        const dataUrl = ev.target.result;
        const name = file.name;
        const size = (file.size / 1024).toFixed(1) + ' Ko';
        data.documents.push({ id: uid('doc'), name, size, date: todayStr(), data: dataUrl });
        logActivity(`Document ajouté : ${name}`);
        saveData();
        state.modal = null;
        render();
      };
      reader.readAsDataURL(file);
      return; // ne pas fermer tout de suite
    }
    else if(mo.type === 'add-transaction'){
      const name = fd.get('name').trim(), amount = parseFloat(fd.get('amount'));
      if(!name || isNaN(amount) || amount <= 0){ alert('Veuillez remplir correctement les champs.'); return; }
      if(!data.budget) data.budget = { total: 0, depenses: 0, transactions: [] };
      data.budget.transactions.push({ id: uid('trans'), name, amount, date: todayStr() });
      data.budget.depenses += amount;
      logActivity(`Dépense ajoutée : ${name} - ${amount} €`);
      saveData();
    }
    else if(mo.type === 'add-notification'){
      const title = fd.get('title').trim(), message = fd.get('message').trim(), expiry = fd.get('expiry');
      if(!title){ alert('Le titre est requis.'); return; }
      data.notifications.push({ id: uid('notif'), title, message, date: todayStr(), expiry });
      logActivity(`Notification créée : ${title}`);
      saveData();
    }
    state.modal = null; render(); return;
  }
});

/* ---------------------------- INIT ---------------------------- */
render();
</script>
</body>
</html>
