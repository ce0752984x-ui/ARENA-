<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portail ARENA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f1ea;
    --surface:#ffffff;
    --ink:#182338;
    --ink-soft:#54607a;
    --ink-faint:#8993a8;
    --line:#e5e1d3;
    --red:#7c1d2e;
    --red-soft:#a4283d;
    --purple:#6a2856;
    --purple-deep:#54204a;
    --brass:#8a6a34;
    --brass-deep:#6b5127;
    --brass-soft:#cdb27a;
    --lavender:#8a6a34;
    --lavender-soft:#cdb27a;
    --dark-card:#182338;
    --dark-card-text:#a3aec4;
    --info-bg:#e8f0fd;
    --info-border:#3f7ce0;
    --info-icon:#14151a;
    --ok:#2f6f4e;
    --danger:#a13d3d;
    --radius:10px;
    --shadow:0 1px 2px rgba(20,25,40,.06),0 8px 24px -12px rgba(20,25,40,.12);
    --font: 'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-display: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  }
  [data-theme="dark"]{
    --bg:#11151f;
    --surface:#1a2030;
    --ink:#eceef2;
    --ink-soft:#aab2c5;
    --ink-faint:#7c8496;
    --line:#2c3345;
    --dark-card:#0d1119;
    --info-bg:#1c2940;
    --info-icon:#0d1119;
  }
  [data-theme="dark"] .login-wrap{ background: radial-gradient(circle at 15% 20%, #241a33 0%, transparent 45%), linear-gradient(160deg,#11151f 0%,#0a0d15 60%,#060810 100%); }
  [data-theme="dark"] .banner-text{ color:#dbe4ff; }
  h1,h2,h3,.brand-text .name,.module-header h2,.login-top h1{ font-family:var(--font-display); }
  .stat-value{ font-variant-numeric:tabular-nums; }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh;display:flex;flex-direction:column;}
  .letterhead-ribbon{height:4px;background:linear-gradient(90deg,var(--brass-deep),var(--brass) 45%,var(--brass-soft) 75%,var(--brass));}
  a{color:inherit;}
  button{font-family:inherit;}
  ul{margin:0;padding:0;}
  h1,h2,h3,p{margin:0;}
  .muted{color:var(--ink-faint);}
  :focus-visible{outline:3px solid #4f83e0;outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:9px 16px;border-radius:8px;border:1px solid transparent;
    font-size:14px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,color .15s;
    background:var(--surface);color:var(--ink);border-color:var(--line);
  }
  .btn:hover{background:#f7f8fa;}
  .btn-primary{background:var(--ink);color:#fff;border-color:var(--ink);}
  .btn-primary:hover{background:#101c33;}
  .btn-purple{background:var(--purple);color:#fff;border-color:var(--purple);}
  .btn-purple:hover{background:var(--purple-deep);}
  .btn-danger{background:#fff;color:var(--danger);border-color:#f0c9c9;}
  .btn-danger:hover{background:#fdf1f1;}
  .btn-ghost{background:transparent;border-color:transparent;}
  .btn-ghost:hover{background:#eef0f4;}
  .btn-sm{padding:6px 10px;font-size:12.5px;border-radius:7px;}
  .btn-icon{padding:8px;border-radius:8px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .icon{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
  .icon-lg{width:26px;height:26px;}

  /* ---------- Login ---------- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:
      radial-gradient(circle at 15% 20%, #2a1f3d 0%, transparent 45%),
      linear-gradient(160deg,#1b2a4a 0%,#101a30 60%,#0c1424 100%);
    padding:24px;}
  .login-card{width:100%;max-width:400px;background:var(--surface);border-radius:16px;box-shadow:0 20px 60px -20px rgba(0,0,0,.5);overflow:hidden;}
  .login-top{padding:30px 32px 20px;text-align:center;border-bottom:1px solid var(--line);}
  .login-badge{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 32% 28%, var(--brass-soft), var(--brass) 55%, var(--brass-deep) 100%);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);}
  .login-badge svg{width:26px;height:26px;stroke:#2a1f0d;}
  .login-top h1{font-size:19px;letter-spacing:.2px;}
  .login-top p{margin-top:4px;font-size:13px;color:var(--ink-faint);}
  .login-body{padding:26px 32px 32px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px;}
  .field input,.field select,.field textarea{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;color:var(--ink);background:#fff;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:#4f83e0;}
  .field textarea{resize:vertical;min-height:110px;line-height:1.5;}
  .field-hint{font-size:12px;color:var(--ink-faint);margin-top:5px;}
  .login-body .btn{width:100%;justify-content:center;padding:11px;font-size:14.5px;}
  .login-error{background:#fdf1f1;border:1px solid #f0c9c9;color:var(--danger);font-size:13px;padding:9px 12px;border-radius:8px;margin-bottom:14px;}
  .login-demo{margin-top:18px;background:#f7f8fa;border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--ink-soft);}
  .login-demo b{color:var(--ink);}

  /* ---------- Topbar ---------- */
  .topbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;}
  .topbar-inner{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:none;padding:0;}
  .brand-badge{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 32% 28%, var(--brass-soft), var(--brass) 55%, var(--brass-deep) 100%);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);}
  .brand-badge svg{width:17px;height:17px;stroke:#2a1f0d;}
  .brand-text{text-align:left;}
  .brand-text .name{font-size:14.5px;font-weight:700;color:var(--ink);line-height:1.2;}
  .brand-text .tag{font-size:11.5px;color:var(--ink-faint);}
  .topbar-right{display:flex;align-items:center;gap:8px;}
  .user-chip{display:flex;align-items:center;gap:9px;padding:6px 12px 6px 8px;border-radius:30px;background:#f2f4f7;}
  .user-avatar{width:26px;height:26px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;}
  .user-meta{line-height:1.15;}
  .user-meta .u-name{font-size:12.5px;font-weight:700;}
  .user-meta .u-role{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.3px;}

  main{flex:1;}
  .page{max-width:1180px;margin:0 auto;padding:28px 24px 60px;}
  .crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-faint);margin-bottom:16px;}
  .crumb button{background:none;border:none;color:var(--ink-soft);font-size:13px;cursor:pointer;padding:0;font-weight:600;}
  .crumb button:hover{color:var(--ink);text-decoration:underline;}
  .page-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px;}
  .eyebrow{font-size:13px;color:var(--ink-faint);font-weight:600;}

  /* ---------- Info banner ---------- */
  .banner{display:flex;border:1px solid var(--info-border);border-radius:8px;overflow:hidden;margin-bottom:22px;background:var(--info-bg);}
  .banner-icon{width:44px;background:var(--info-icon);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .banner-icon svg{width:18px;height:18px;stroke:#fff;}
  .banner-text{padding:14px 18px;font-size:14.5px;color:#1c2e52;display:flex;align-items:center;}

  /* ---------- Stats ---------- */
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:26px;}
  .stat-card{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--red);border-radius:6px;padding:22px 18px;text-align:center;position:relative;}
  .stat-value{font-size:32px;font-weight:800;color:var(--ink);}
  .stat-label{margin-top:6px;font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-soft);font-weight:700;}
  .stat-edit{position:absolute;top:6px;right:6px;display:flex;gap:2px;}

  /* ---------- Module cards ---------- */
  .modules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;}
  .module-card{background:var(--dark-card);border-radius:8px;padding:20px 20px 18px;border-bottom:3px solid var(--lavender);cursor:pointer;text-align:left;display:flex;flex-direction:column;min-height:190px;transition:transform .15s, box-shadow .15s;position:relative;}
  .module-badge{position:absolute;top:14px;right:14px;background:var(--red);color:#fff;font-size:11.5px;font-weight:800;min-width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;padding:0 6px;}
  .module-badge--ok{background:var(--ok);}
  .notif-wrap{position:relative;}
  .notif-dropdown{position:absolute;top:calc(100% + 8px);right:0;width:320px;max-width:82vw;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:60;overflow:hidden;}
  .notif-head{padding:12px 16px;font-weight:700;font-size:13px;border-bottom:1px solid var(--line);}
  .notif-item{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:11px 16px;font-size:13px;color:var(--ink);cursor:pointer;line-height:1.5;}
  .notif-item:last-child{border-bottom:none;}
  .notif-item:hover{background:var(--bg);}
  .notif-empty{padding:16px;font-size:13px;color:var(--ink-faint);}
  .module-card:hover{transform:translateY(-2px);box-shadow:0 14px 30px -16px rgba(0,0,0,.5);}
  .module-icon{width:34px;height:34px;border-radius:8px;background:rgba(141,126,243,.15);display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
  .module-icon svg{width:18px;height:18px;stroke:var(--lavender-soft);}
  .module-card h3{font-size:16px;color:var(--lavender-soft);font-weight:700;line-height:1.3;}
  .module-card p{margin-top:8px;font-size:13px;color:var(--dark-card-text);line-height:1.5;flex:1;}
  .module-arrow{align-self:flex-end;margin-top:10px;color:var(--lavender-soft);}
  .module-arrow svg{width:17px;height:17px;}
  .modules-empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:8px;padding:34px;text-align:center;color:var(--ink-faint);font-size:13.5px;}

  /* ---------- Module detail ---------- */
  .module-header{background:var(--ink);border-radius:8px 8px 0 0;padding:14px 20px;display:flex;align-items:center;gap:10px;color:#fff;border-left:4px solid var(--brass);}
  .module-header svg{width:19px;height:19px;stroke:var(--brass-soft);}
  .module-header h2{font-size:16.5px;font-weight:600;letter-spacing:.3px;}
  .tabs-bar{display:flex;flex-wrap:wrap;background:#f7f7f9;border:1px solid var(--line);border-top:none;padding:0 8px;}
  .tab-btn{padding:13px 16px;font-size:13.5px;font-weight:700;color:var(--ink-soft);background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;letter-spacing:.2px;}
  .tab-btn:hover{color:var(--ink);}
  .tab-btn.active{color:var(--brass-deep);border-bottom-color:var(--brass);}
  .tab-panel{background:var(--surface);border:1px solid var(--line);border-top:none;border-radius:0 0 8px 8px;padding:26px 28px;min-height:220px;}
  .tab-panel h3{font-size:16px;margin:18px 0 8px;color:var(--ink);}
  .tab-panel h3:first-child{margin-top:0;}
  .tab-panel p{font-size:14px;line-height:1.7;color:#33415c;margin-bottom:10px;}
  .tab-panel ul{margin:0 0 12px 20px;padding:0;}
  .tab-panel li{font-size:14px;line-height:1.7;color:#33415c;}
  .callout{background:var(--info-bg);border-left:3px solid var(--info-border);padding:10px 14px;border-radius:6px;font-size:13.5px;color:#1c2e52;margin:10px 0;line-height:1.6;}
  .dossier-print-bar{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .search-row{margin-bottom:14px;}
  .search-row input{max-width:320px;}
  @media print{
    .no-print, .topbar, .pagefoot, .editbar, .crumb, .row-actions, .form-actions, .search-row { display:none !important; }
    .page{ box-shadow:none !important; }
    body{ background:#fff !important; }
  }
  .content-table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;}
  .content-table th,.content-table td{border:1px solid var(--line);padding:8px 10px;text-align:left;}
  .content-table th{background:#f7f7f9;font-weight:700;color:var(--ink);}
  .content-table tbody tr:nth-child(even){background:#fbfbfc;}
  .calc-result{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:16px 0 6px;}
  .calc-result .stat-card{border-top-width:3px;}
  .editbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .tab-manage-row{display:flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;margin-bottom:6px;background:#fbfbfc;}
  .tab-manage-row span{flex:1;font-size:13.5px;font-weight:600;}
  .badge{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;padding:2px 8px;border-radius:20px;}
  .badge-admin{background:#f4e8f0;color:var(--purple);}
  .badge-user{background:#e8ecf4;color:var(--ink-soft);}
  .badge-ok{background:#e4f4ea;color:var(--ok);}
  .badge-pending{background:#fdf3e2;color:#a2680a;}
  .badge-danger{background:#fbe9e9;color:var(--danger);}

  /* ---------- Feed (Informations) ---------- */
  .feed{display:flex;flex-direction:column;gap:14px;}
  .post{border:1px solid var(--line);border-radius:8px;padding:18px 20px;background:#fff;}
  .post-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
  .post-title{font-size:15px;font-weight:700;color:var(--ink);}
  .post-date{font-size:11.5px;color:var(--ink-faint);white-space:nowrap;margin-top:2px;}
  .post-body p{font-size:13.5px;color:#33415c;line-height:1.7;margin-bottom:8px;}
  .post-actions{display:flex;gap:4px;}

  /* ---------- Settings ---------- */
  .settings-shell{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:start;}
  .settings-nav{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px;position:sticky;top:78px;}
  .settings-nav button{display:flex;align-items:center;gap:8px;text-align:left;padding:9px 10px;border-radius:6px;border:none;background:none;font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .settings-nav button.active{background:var(--ink);color:#fff;}
  .settings-nav button:hover:not(.active){background:#f0f1f4;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 24px;border-top:3px solid var(--purple);}
  .card + .card{margin-top:16px;}
  .card h3{font-size:15px;margin-bottom:4px;}
  .card .card-sub{font-size:12.5px;color:var(--ink-faint);margin-bottom:16px;}
  .row-list{display:flex;flex-direction:column;gap:8px;}
  .row-item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:7px;padding:10px 12px;}
  .row-item .ri-main{flex:1;min-width:0;}
  .row-item .ri-title{font-size:13.5px;font-weight:700;color:var(--ink);}
  .row-item .ri-sub{font-size:12px;color:var(--ink-faint);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row-actions{display:flex;gap:4px;flex-shrink:0;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;}
  .icon-pick-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:4px;}
  .icon-pick{border:1.5px solid var(--line);border-radius:8px;padding:10px 0;display:flex;align-items:center;justify-content:center;background:#fff;cursor:pointer;}
  .icon-pick.selected{border-color:var(--purple);background:#f4e8f0;}
  .icon-pick svg{width:18px;height:18px;stroke:var(--ink);}
  .switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0;}
  .switch{position:relative;width:40px;height:22px;border-radius:20px;background:var(--line);border:none;cursor:pointer;flex-shrink:0;}
  .switch.on{background:var(--ok);}
  .switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;}
  .switch.on::after{left:20px;}
  .data-actions{display:flex;gap:10px;flex-wrap:wrap;}
  .empty-note{color:var(--ink-faint);font-size:13px;padding:8px 0;}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(15,20,35,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;}
  .modal{background:#fff;border-radius:12px;width:100%;max-width:480px;max-height:88vh;overflow:auto;box-shadow:0 30px 70px -20px rgba(0,0,0,.4);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);}
  .modal-head h3{font-size:15.5px;}
  .modal-body{padding:20px 22px;}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line);}
  .confirm-text{font-size:14px;color:var(--ink-soft);line-height:1.6;}

  footer.pagefoot{text-align:center;font-size:11.5px;color:var(--ink-faint);padding:26px 20px 34px;}

  @media (max-width:760px){
    .settings-shell{grid-template-columns:1fr;}
    .settings-nav{position:static;flex-direction:row;overflow-x:auto;}
    .form-grid{grid-template-columns:1fr;}
    .topbar-inner{padding:12px 16px;}
    .page{padding:20px 16px 44px;}
    .user-meta{display:none;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   PORTAIL ARENA — application autonome (HTML + CSS + JS, sans dépendance)
   Couche de données : localStorage pour l'instant.
   -> Pour brancher une vraie base de données plus tard, il suffira de
      remplacer le contenu des fonctions de la section "COUCHE DE DONNEES"
      (loadData/saveData/loadSession/saveSession) par des appels fetch()
      vers une API, sans toucher au reste de l'application.
   ===================================================================== */

/* ---------------------------- ICONES (SVG) ---------------------------- */
const ICONS = {
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 21a2 2 0 0 0 4 0"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/>',
  people:   '<circle cx="9" cy="7" r="4"/><path d="M2 21v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2"/><path d="M17 3.6a4 4 0 0 1 0 7.8"/><path d="M22 21v-2a5 5 0 0 0-3.5-4.8"/>',

/* ---------------------------- OUTILS ---------------------------- */
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uid(prefix){ return (prefix||'id') + '_' + Math.random().toString(36).slice(2,9); }
function todayStr(){
  const d = new Date();
  return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'long', year:'numeric' });
}
function todayIso(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function initials(name){
  return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
}
/* Mini-syntaxe de mise en forme pour les contenus :
   ligne vide = paragraphe ; "## " = titre ; "- " = liste ; "> " = encadré info */
function parseContent(raw){
  if(!raw || !raw.trim()) return '<p class="muted">Aucun contenu pour le moment.</p>';
  const lines = raw.replace(/\r/g,'').split('\n');
  let html = '', buf = [], i = 0;
  const flush = () => { if(buf.length){ html += `<p>${buf.join('<br>')}</p>`; buf = []; } };
  while(i < lines.length){
    const t = lines[i].trim();
    if(t === ''){ flush(); i++; continue; }
    if(t.startsWith('## ')){ flush(); html += `<h3>${escapeHtml(t.slice(3))}</h3>`; i++; continue; }
    if(t.startsWith('> ')){
      flush(); let arr=[];
      while(i<lines.length && lines[i].trim().startsWith('> ')){ arr.push(escapeHtml(lines[i].trim().slice(2))); i++; }
      html += `<div class="callout">${arr.join('<br>')}</div>`; continue;
    }
    if(t.startsWith('- ')){
      flush(); let items=[];
      while(i<lines.length && lines[i].trim().startsWith('- ')){ items.push(`<li>${escapeHtml(lines[i].trim().slice(2))}</li>`); i++; }
      html += `<ul>${items.join('')}</ul>`; continue;
    }
    if(t.startsWith('|')){
      flush(); let rows=[];
      while(i<lines.length && lines[i].trim().startsWith('|')){ rows.push(lines[i].trim()); i++; }
      // ligne de séparation type |---|---| optionnelle en 2e position
      if(rows[1] && /^\|[\s:-]+\|/.test(rows[1])) rows.splice(1,1);
      const cells = rows.map(r => r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));
      const [head, ...body] = cells;
      html += `<table class="content-table"><thead><tr>${head.map(c=>`<th>${escapeHtml(c)}</th>`).join('')}</tr></thead><tbody>${body.map(r=>`<tr>${r.map(c=>`<td>${escapeHtml(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
      continue;
    }
    buf.push(escapeHtml(lines[i])); i++;
  }
  flush();
  return html;
}

function nextMatricule(){
  data._matriculeSeq = (data._matriculeSeq || 0) + 1;

}
function logActivity(text){
  if(!data.auditLog) data.auditLog = [];

  if(data.auditLog.length > 150) data.auditLog.length = 150;
}
function ensureDossier(userId){
  if(!data.dossiers) data.dossiers = {};
  if(!data.dossiers[userId]) data.dossiers[userId] = { situation:'', affectations:[], salaire:{indiceMajore:400}, absences:[], soldeConges:25, matricule: nextMatricule() };
  if(data.dossiers[userId].soldeConges === undefined) data.dossiers[userId].soldeConges = 25;
  if(!data.dossiers[userId].matricule) data.dossiers[userId].matricule = nextMatricule();
  return data.dossiers[userId];
}

/* ---------------------------- MIGRATIONS ----------------------------
   Chaque fois qu'une évolution du portail ajoute quelque chose (un onglet,
   un champ, une option), on ajoute une étape ici plutôt que de compter sur
   la réinitialisation manuelle des données. Les comptes déjà utilisés dans
   ce navigateur reçoivent la mise à jour automatiquement au prochain
   chargement, sans perdre le contenu déjà personnalisé. */
function migrateData(d){
  d._v = d._v || 1;
  let changed = false;

  if(d._v < 2){
    // v2 : ajout de l'onglet « Salaire » (simulateur) au module I-Prof — Carrière
    const iprof = d.modules && d.modules.find(m => m.id === 'iprof');
    if(iprof && Array.isArray(iprof.tabs) && !iprof.tabs.some(t => t.name === 'Salaire')){
      iprof.tabs.push({
        id: uid('tab'), name: 'Salaire',
        content: '%%SALAIRE%%\n## Grille indiciaire — Certifiés, 3e classe (extrait)\n\n| Échelon | Indice majoré | Brut mensuel |\n| --- | --- | --- |\n| 7 | 450 | 2 215 € |\n| 8 | 481 | 2 368 € |\n| 9 | 514 | 2 530 € |\n| 10 | 555 | 2 732 € |\n| 11 | 590 | 2 904 € |\n\n> Grille fournie à titre indicatif. Utilisez le simulateur ci-dessus avec votre indice majoré personnel pour un calcul exact.'
      });
      changed = true;
    }
    d._v = 2; changed = true;
  }

  if(d._v < 3){
    // v3 : dossiers du personnel (affectations, salaire, absences) + module Formations
    if(!d.dossiers) d.dossiers = {};
    (d.users||[]).forEach(u => {
      if(u.role === 'user' && !d.dossiers[u.id]){
        d.dossiers[u.id] = { situation:'', affectations:[], salaire:{indiceMajore:400}, absences:[] };
      }
    });
    if(!Array.isArray(d.formations)) d.formations = [];
    if(!d.modules.some(m => m.id === 'personnel')){
      d.modules.push({ id:'personnel', icon:'user', title:'Dossiers du personnel',
        description:"Gestion par l'administration des dossiers, affectations, salaires et absences de chaque professeur.", type:'personnel' });
    }
    if(!d.modules.some(m => m.id === 'formations')){
      d.modules.push({ id:'formations', icon:'cap', title:'Formations',
        description:"Catalogue de formations proposées par l'établissement et inscriptions du personnel.", type:'formations' });
    }
    d._v = 3; changed = true;
  }

  if(changed) localStorage.setItem(DATA_KEY, JSON.stringify(d));
  return d;
}

function loadData(){
  try{
    const raw = localStorage.getItem(DATA_KEY);
    if(!raw) { const d = defaultData(); localStorage.setItem(DATA_KEY, JSON.stringify(d)); return d; }
    return migrateData(JSON.parse(raw));
  }catch(e){ return defaultData(); }
}

function getNotifications(){
  const items = [];
  if(!session) return items;
  if(isAdmin()){
    data.users.filter(u=>u.role==='user').forEach(u=>{
      const dos = ensureDossier(u.id);
      dos.absences.filter(a=>a.statut==='en attente').forEach(a=>{
        items.push({ text: `${u.displayName} — demande d'absence en attente (${a.motif||'motif non précisé'})`, moduleId:'personnel' });
      });
    });
    const today = todayIso();
    (data.formations||[]).filter(f=>f.date>=today && f.inscrits.length>=f.places).forEach(f=>{
      items.push({ text: `Formation « ${f.title} » complète (${f.inscrits.length}/${f.places})`, moduleId:'formations' });
    });
  } else {
    const dos = ensureDossier(session.id);
    dos.absences.filter(a=>a.statut==='en attente').forEach(a=>{
      items.push({ text: `Votre demande d'absence du ${a.date} est en attente de validation`, moduleId:'personnel' });
    });
  }
  return items;
}

}

function render(){
  document.documentElement.setAttribute('data-theme', state.theme);
  const app = document.getElementById('app');
  let html = '';
  if(!session){
    html = viewLogin();
  } else if(state.route === 'settings' && isAdmin()){
    html = viewShell(viewSettings());
  } else if(state.route === 'account'){
    html = viewShell(viewAccount());
  } else if(state.route.startsWith('module:')){
    html = viewShell(viewModule(state.route.slice(7)));
  } else {
    html = viewShell(viewDashboard());
  }
  if(state.modal){ html += renderModal(); }
  app.innerHTML = html;
  const modalInput = document.querySelector('.modal [autofocus]');
  if(modalInput) modalInput.focus();
}

/* ---------------------------- OUTIL : SIMULATEUR DE SALAIRE ----------------------------
   Activé automatiquement dès qu'un onglet contient "%%SALAIRE%%" dans son contenu
   (via Mode édition → Modifier le contenu). Calcul réel : indice majoré x valeur du
   point d'indice de la fonction publique (4,92278 € brut mensuel/point, gelée depuis
   le 1er juillet 2023 — décret n°2023-519, inchangée en 2026). */
const POINT_INDICE = 4.92278;
function computeSalary(im){
  const brut = im * POINT_INDICE;
  const assiette = brut * 0.9825;                 // assiette de cotisation (98,25% du brut)
  const net = assiette - assiette*0.111 - assiette*0.092 - assiette*0.005; // pension 11,10% + CSG 9,2% + CRDS 0,5%
  return { brut, net, annuel: brut*12 };
}
function fmtEuro(n){ return Math.round(n).toLocaleString('fr-FR') + ' €'; }
/* Extrait un nombre de jours depuis un texte libre du type "3 jours", "1 jour",
   "2 demi-journées" (arrondi à 0,5 j) — sert au calcul du solde de congés. */
function parseDureeJours(txt){
  if(!txt) return 1;
  const t = txt.toLowerCase();
  const m = t.match(/(\d+([.,]\d+)?)/);
  let n = m ? parseFloat(m[1].replace(',','.')) : 1;
  if(t.includes('demi')) n = n * 0.5;
  return n;
}
function renderSalaryCalculator(extraNote){
  const r = computeSalary(450);
  return `
    <div class="callout">Simulateur basé sur la valeur réelle du point d'indice (fonction publique) : <b>${POINT_INDICE.toFixed(5)} €</b> brut par mois et par point d'indice majoré, gelée depuis le 1ᵉʳ juillet 2023. Résultat = traitement indiciaire, hors primes (ISOE, indemnité de résidence, supplément familial, etc.).</div>
    ${extraNote ? `<div class="tab-panel" style="border:none;padding:0 0 14px;min-height:0;">${parseContent(extraNote)}</div>` : ''}
    <div class="form-grid">
      <div class="field">
        <label for="sal-im">Indice majoré (IM)</label>
        <input type="number" id="sal-im" min="100" max="1100" step="1" value="450" oninput="updateSalaryCalc()">
        <div class="field-hint">Indiqué sur le bulletin de paie ou dans I-Prof, rubrique « Ma carrière ».</div>
      </div>
    </div>
    <div class="calc-result">
      <div class="stat-card" style="border-top-color:var(--purple);"><div class="stat-value" id="sal-brut">${fmtEuro(r.brut)}</div><div class="stat-label">Brut mensuel</div></div>
      <div class="stat-card" style="border-top-color:var(--ok);"><div class="stat-value" id="sal-net">≈ ${fmtEuro(r.net)}</div><div class="stat-label">Net estimé</div></div>
      <div class="stat-card" style="border-top-color:var(--red);"><div class="stat-value" id="sal-annuel">${fmtEuro(r.annuel)}</div><div class="stat-label">Brut annuel</div></div>
    </div>
    <p class="muted" style="font-size:12px;">Net estimé = brut × 98,25 % − 11,10 % (retenue pension) − 9,2 % (CSG) − 0,5 % (CRDS). N'inclut ni primes, ni indemnités, ni impôt sur le revenu.</p>`;
}
function filterProfRows(query){
  const q = query.trim().toLowerCase();
  document.querySelectorAll('#prof-roster [data-search]').forEach(el => {
    el.style.display = (!q || el.dataset.search.includes(q)) ? '' : 'none';
  });
}
function setProfSort(v){ state.profSort = v; render(); }
function updateSalaryCalc(){
  const el = document.getElementById('sal-im'); if(!el) return;
  const im = parseFloat(el.value) || 0;
  const r = computeSalary(im);
  document.getElementById('sal-brut').textContent = fmtEuro(r.brut);
  document.getElementById('sal-net').textContent = '≈ ' + fmtEuro(r.net);
  document.getElementById('sal-annuel').textContent = fmtEuro(r.annuel);
}
function renderTabPanel(content){
  if(content && content.trim().startsWith('%%SALAIRE%%')){
    const rest = content.trim().slice('%%SALAIRE%%'.length).trim();
    return renderSalaryCalculator(rest);
  }
  return parseContent(content);
}

function renderCongesBlock(userId, dos, editable){
  const pris = dos.absences.filter(a => a.statut === 'validée').reduce((n,a) => n + parseDureeJours(a.duree), 0);
  const solde = dos.soldeConges;
  const restant = solde - pris;
  const editForm = editable ? `
    <form data-form="dossier-conges" data-uid="${userId}" style="margin-bottom:14px;">
      <div class="form-grid">
        <div class="field"><label>Solde annuel (jours)</label><input type="number" name="soldeConges" min="0" step="0.5" value="${solde}"></div>
      </div>
      <div class="form-actions"><button class="btn btn-primary btn-sm" type="submit">${icon('check')} Enregistrer le solde</button></div>
    </form>` : '';
  return `
    ${editForm}
    <div class="calc-result">

function renderPersonnelModule(m){
  if(!isAdmin()){
    const u = session;
    const dos = ensureDossier(u.id);
    return renderDossierPanel(u, dos, false);
  }

  if(!state.selectedProfId){
    let profs = data.users.filter(u => u.role === 'user');
    const sortBy = state.profSort || 'name';
    profs = [...profs].sort((a,b) => {
      if(sortBy === 'pending'){
        const pa = ensureDossier(a.id).absences.filter(x=>x.statut==='en attente').length;
        const pb = ensureDossier(b.id).absences.filter(x=>x.statut==='en attente').length;
        if(pb !== pa) return pb - pa;
      }
      return a.displayName.localeCompare(b.displayName, 'fr');
    });
    const rows = profs.map(u => {
      const dos = ensureDossier(u.id);
      const enAttente = dos.absences.filter(a => a.statut === 'en attente').length;
      const enCours = dos.affectations.find(a => !a.fin);
      const searchBlob = (u.displayName + ' ' + u.username + ' ' + (enCours?enCours.etablissement:'') + ' ' + (dos.matricule||'')).toLowerCase();
      return `
      <div class="row-item" data-search="${escapeHtml(searchBlob)}">
        <span class="user-avatar">${escapeHtml(initials(u.displayName))}</span>
        <div class="ri-main">
          <div class="ri-title">${escapeHtml(u.displayName)}</div>
          <div class="ri-sub">Identifiant : ${escapeHtml(u.username)} · Matricule : ${escapeHtml(dos.matricule||'—')}${enCours?` · ${escapeHtml(enCours.etablissement)}`:''}${enAttente ? ` · <span style="color:var(--danger);font-weight:700;">${enAttente} demande(s) d'absence en attente</span>` : ''}</div>
        </div>
        <div class="row-actions">
          <button class="btn btn-sm" data-action="select-prof" data-id="${u.id}">Voir le dossier</button>
        </div>
      </div>`;
    }).join('') || `<div class="empty-note">Aucun professeur enregistré. Ajoutez des comptes dans Paramètres → Utilisateurs.</div>`;
    return `<div class="card"><h3>Professeurs</h3><p class="card-sub">Recherchez ou sélectionnez un professeur pour consulter et modifier son dossier.</p>
      <div class="search-row" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;">
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <input type="text" placeholder="Rechercher par nom, identifiant, établissement…" oninput="filterProfRows(this.value)">
          <select data-action="sort-profs" onchange="setProfSort(this.value)" style="max-width:220px;">
            <option value="name" ${sortBy==='name'?'selected':''}>Trier par nom</option>
            <option value="pending" ${sortBy==='pending'?'selected':''}>Trier par absences en attente</option>
          </select>
        </div>
        <button class="btn btn-primary btn-sm" data-action="add-user">${icon('plus')} Ajouter un professeur</button>
        <button class="btn btn-ghost btn-sm" data-action="export-personnel-csv">${icon('download')} Exporter en CSV</button>
      </div>
      <div class="row-list" id="prof-roster">${rows}</div></div>`;
  }

  const u = data.users.find(x => x.id === state.selectedProfId);
  if(!u){ state.selectedProfId = null; return `<div class="empty-note">Ce professeur n'existe plus.</div>`; }
  const dos = ensureDossier(u.id);
  return `<div class="crumb"><button data-action="back-to-roster">← Liste des professeurs</button></div>${renderDossierPanel(u, dos, true)}`;
}

}

function renderFormationsModule(m){
  const list = data.formations || [];
  if(isAdmin()){
    const rows = list.map(f => {
      const expanded = state.expandedFormationId === f.id;
      const inscritsNames = f.inscrits.map(uid_ => { const u = data.users.find(x => x.id === uid_); return u ? u.displayName : '(compte supprimé)'; });
      return `
      <div class="row-item" style="flex-wrap:wrap;">

        </div>
        ${expanded ? `<div style="flex-basis:100%;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);">
          ${inscritsNames.length ? `<ul>${inscritsNames.map(n => `<li>${escapeHtml(n)}</li>`).join('')}</ul>` : `<p class="muted" style="font-size:13px;">Aucune inscription pour le moment.</p>`}
        </div>` : ''}
      </div>`;
    }).join('') || `<div class="empty-note">Aucune formation créée.</div>`;
    return `<div class="card"><h3>Formations proposées</h3><p class="card-sub">Créez des formations ; les inscriptions des professeurs remontent automatiquement ici.</p>
      <div class="row-list">${rows}</div>
      <div style="margin-top:14px;"><button class="btn btn-sm" data-action="add-formation">${icon('plus')} Ajouter une formation</button></div>
    </div>`;
  }

  const rows = list.map(f => {
    const inscrit = f.inscrits.includes(session.id);
    const past = f.date < todayIso();
    const complet = !inscrit && (f.inscrits.length >= f.places || past);
    return `
    <div class="row-item">
      <div class="ri-main">
        <div class="ri-title">${escapeHtml(f.title)} ${formationStatusBadge(f)}</div>
        <div class="ri-sub">${escapeHtml(f.date)} · ${escapeHtml(f.lieu)} · ${f.places - f.inscrits.length} place(s) restante(s)</div>
        <p style="font-size:13px;color:#33415c;margin-top:6px;">${escapeHtml(f.description)}</p>
      </div>
      <div class="row-actions">
        <button class="btn ${inscrit ? 'btn-danger' : 'btn-primary'} btn-sm" data-action="toggle-inscription" data-id="${f.id}" ${complet ? 'disabled' : ''}>
          ${inscrit ? 'Se désinscrire' : (past ? 'Terminée' : (complet ? 'Complet' : "S'inscrire"))}
        </button>
      </div>
    </div>`;
  }).join('') || `<div class="empty-note">Aucune formation proposée pour le moment.</div>`;
  return `<div class="card"><h3>Formations disponibles</h3><p class="card-sub">Inscrivez-vous aux formations proposées par l'établissement.</p><div class="row-list">${rows}</div></div>`;
}

        <label>Contenu</label>
        <textarea name="content" rows="12" autofocus>${escapeHtml(mo.data.content||'')}</textarea>
        <div class="field-hint">Astuce de mise en forme : une ligne commençant par « ## » devient un titre, par « - » un élément de liste, par « &gt; » un encadré, une ligne vide sépare les paragraphes.</div>
      </div>`;
  }
  else if(mo.type === 'edit-post'){
    const p = mo.data;
    title = p.id ? "Modifier l'annonce" : 'Nouvelle annonce';
    body = `
      <div class="field"><label>Titre</label><input name="title" value="${escapeHtml(p.title||'')}" autofocus required></div>
      <div class="field"><label>Contenu</label><textarea name="body" rows="8">${escapeHtml(p.body||'')}</textarea>
        <div class="field-hint">Même mise en forme que les onglets : ##, -, &gt; et lignes vides.</div>
      </div>`;
  }
  else if(mo.type === 'edit-user'){
    const u = mo.data;
    title = u.id ? "Modifier l'utilisateur" : 'Ajouter un utilisateur';
    body = `
      <div class="field"><label>Nom affiché</label><input name="displayName" value="${escapeHtml(u.displayName||'')}" autofocus required></div>
      <div class="field"><label>Identifiant de connexion</label><input name="username" value="${escapeHtml(u.username||'')}" required></div>
      <div class="field"><label>Mot de passe ${u.id?'(laisser vide pour ne pas changer)':''}</label><input name="password" type="text" ${u.id?'':'required'}></div>
      <div class="field"><label>Rôle</label>
        <select name="role">
          <option value="user" ${u.role==='user'?'selected':''}>Personnel (lecture seule)</option>
          <option value="admin" ${u.role==='admin'?'selected':''}>Administrateur</option>
        </select>
      </div>`;
  }

  else if(mo.type === 'edit-affectation'){
    const a = mo.data;
    title = a.id ? "Modifier l'affectation" : 'Ajouter une affectation';
    body = `
      <div class="field"><label>Établissement</label><input name="etablissement" value="${escapeHtml(a.etablissement||'')}" autofocus required></div>
      <div class="field"><label>Début</label><input name="debut" value="${escapeHtml(a.debut||'')}" placeholder="ex. 2024" required></div>
      <div class="field"><label>Fin</label><input name="fin" value="${escapeHtml(a.fin||'')}" placeholder="laisser vide si en cours"></div>`;
  }
  else if(mo.type === 'edit-absence'){
    const a = mo.data;
    title = a.id ? "Modifier l'absence" : (a.byAdmin ? 'Ajouter une absence' : "Nouvelle demande d'absence");
    body = `
      <div class="field"><label>Date</label><input type="date" name="date" value="${escapeHtml(a.date||todayIso())}" autofocus required></div>
      <div class="field"><label>Motif</label><input name="motif" value="${escapeHtml(a.motif||'')}" required></div>
      <div class="field"><label>Durée</label><input name="duree" value="${escapeHtml(a.duree||'')}" placeholder="ex. 1 jour, 2 demi-journées…" required></div>
      ${a.byAdmin ? `
      <div class="field"><label>Statut</label>
        <select name="statut">
          <option value="validée" ${a.statut==='validée'?'selected':''}>Validée</option>
          <option value="en attente" ${a.statut==='en attente'?'selected':''}>En attente</option>
          <option value="refusée" ${a.statut==='refusée'?'selected':''}>Refusée</option>
        </select>
      </div>` : `<p class="field-hint">Votre demande sera transmise à l'administration avec le statut « en attente ».</p>`}`;
  }
  else if(mo.type === 'edit-formation'){
    const f = mo.data;
    title = f.id ? 'Modifier la formation' : 'Ajouter une formation';
    body = `
      <div class="field"><label>Titre</label><input name="title" value="${escapeHtml(f.title||'')}" autofocus required></div>
      <div class="field"><label>Description</label><textarea name="description" rows="3">${escapeHtml(f.description||'')}</textarea></div>
      <div class="form-grid">
        <div class="field"><label>Date</label><input type="date" name="date" value="${escapeHtml(f.date||todayIso())}" required></div>
        <div class="field"><label>Lieu</label><input name="lieu" value="${escapeHtml(f.lieu||'')}" required></div>
      </div>
      <div class="field"><label>Places disponibles</label><input type="number" min="1" name="places" value="${f.places||20}" required></div>`;
  }

  return `<div class="overlay" data-action="overlay-close">
    <div class="modal" data-stop>
      <div class="modal-head"><h3>${title}</h3><button class="btn btn-ghost btn-icon" data-action="close-modal">${icon('x')}</button></div>
      <form id="modal-form" data-form="modal">
        <div class="modal-body">${body}</div>
        <div class="modal-foot">${footer}</div>
      </form>
    </div></div>`;
}

/* ---------------------------- ACTIONS ---------------------------- */
function openModal(type, data_){ state.modal = { type, data: data_ || {} }; render(); }
function closeModal(){ state.modal = null; render(); }

function findModule(id){ return data.modules.find(m => m.id === id); }

document.addEventListener('click', function(e){
  if(state.notifOpen && !e.target.closest('.notif-wrap')){ state.notifOpen = false; render(); return; }
  const overlay = e.target.closest('[data-action="overlay-close"]');
  if(overlay && e.target === overlay){ closeModal(); return; }
  if(e.target.closest('[data-stop]') && e.target.closest('.overlay') && !e.target.closest('button[data-action]') ) {
    // clicks inside modal that aren't actions shouldn't bubble to overlay-close; handled by target check above
  }

  const iconPick = e.target.closest('[data-action="pick-icon"]');
  if(iconPick){
    document.querySelectorAll('.icon-pick').forEach(el => el.classList.remove('selected'));
    iconPick.classList.add('selected');
    document.getElementById('icon-hidden').value = iconPick.dataset.icon;
    return;
  }

  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;
  if(action !== 'toggle-notif') state.notifOpen = false;

  switch(action){
    case 'toggle-notif': state.notifOpen = !state.notifOpen; render(); break;
    case 'go-dashboard': state.route='dashboard'; state.editMode=false; state.selectedProfId=null; state.expandedFormationId=null; render(); break;
    case 'go-settings': state.route='settings'; render(); break;
    case 'go-account': state.route='account'; state.accountMsg=''; render(); break;
    case 'toggle-theme': state.theme = state.theme==='dark' ? 'light' : 'dark'; saveTheme(state.theme); render(); break;
    case 'open-module': state.route='module:'+btn.dataset.id; state.editMode=false; state.selectedProfId=null; state.expandedFormationId=null; render(); break;
    case 'logout': session=null; saveSessionUserId(null); state.route='dashboard'; render(); break;
    case 'toggle-edit': state.editMode = !state.editMode; render(); break;
    case 'settings-tab': state.settingsTab = btn.dataset.tab; render(); break;
    case 'close-modal': closeModal(); break;

    case 'toggle-banner': data.banner.enabled = !data.banner.enabled; saveData(); render(); break;

    case 'select-tab': state.activeTabId[btn.dataset.mid] = btn.dataset.tid; render(); break;
    case 'add-tab': openModal('add-tab', { mid: btn.dataset.mid, name:'' }); break;
    case 'rename-tab': {
      const m = findModule(btn.dataset.mid); const t = m.tabs.find(x=>x.id===btn.dataset.tid);
      openModal('rename-tab', { mid:m.id, tid:t.id, name:t.name });
      break; }
    case 'edit-tab-content': {
      const m = findModule(btn.dataset.mid); const t = m.tabs.find(x=>x.id===btn.dataset.tid);
      openModal('edit-tab-content', { mid:m.id, tid:t.id, name:t.name, content:t.content });
      break; }
    case 'delete-tab': {
      state.modal = { type:'confirm', title:'Supprimer cet onglet', message:'Cette action est définitive. Voulez-vous continuer ?',
        onConfirm: () => { const m=findModule(btn.dataset.mid); m.tabs = m.tabs.filter(t=>t.id!==btn.dataset.tid); saveData(); } };
      render(); break; }
    case 'move-tab': {
      const m = findModule(btn.dataset.mid); const idx = m.tabs.findIndex(t=>t.id===btn.dataset.tid);
      const dir = btn.dataset.dir==='up'?-1:1; const j = idx+dir;
      if(j>=0 && j<m.tabs.length){ [m.tabs[idx],m.tabs[j]]=[m.tabs[j],m.tabs[idx]]; saveData(); render(); }
      break; }

    case 'add-post': openModal('edit-post', { mid: btn.dataset.mid }); break;
    case 'edit-post': {
      const m = findModule(btn.dataset.mid); const p = m.posts.find(x=>x.id===btn.dataset.pid);
      openModal('edit-post', { mid:m.id, id:p.id, title:p.title, body:p.body });
      break; }
    case 'delete-post': {
      state.modal = { type:'confirm', title:'Supprimer cette annonce', message:'Cette action est définitive. Voulez-vous continuer ?',
        onConfirm: () => { const m=findModule(btn.dataset.mid); m.posts = m.posts.filter(p=>p.id!==btn.dataset.pid); saveData(); } };
      render(); break; }

    case 'add-stat': openModal('edit-stat', {}); break;
    case 'edit-stat': { const s = data.stats.find(x=>x.id===btn.dataset.id); openModal('edit-stat', {...s}); break; }
    case 'delete-stat': {
      state.modal = { type:'confirm', title:'Supprimer cette statistique', message:'Cette carte disparaîtra du tableau de bord. Continuer ?',
        onConfirm: () => { data.stats = data.stats.filter(s=>s.id!==btn.dataset.id); saveData(); } };
      render(); break; }

    case 'add-module': openModal('edit-module', { type:'tabs', icon:'folder' }); break;
    case 'edit-module': { const m = data.modules.find(x=>x.id===btn.dataset.id); openModal('edit-module', {...m}); break; }
    case 'delete-module': {
      state.modal = { type:'confirm', title:'Supprimer ce module', message:'Le module et tout son contenu seront supprimés définitivement. Continuer ?',
        onConfirm: () => { data.modules = data.modules.filter(m=>m.id!==btn.dataset.id); saveData(); if(state.route==='module:'+btn.dataset.id) state.route='dashboard'; } };
      render(); break; }
    case 'move-module': {
      const idx = data.modules.findIndex(m=>m.id===btn.dataset.id);
      const dir = btn.dataset.dir==='up'?-1:1; const j = idx+dir;
      if(j>=0 && j<data.modules.length){ [data.modules[idx],data.modules[j]]=[data.modules[j],data.modules[idx]]; saveData(); render(); }
      break; }

    case 'add-user': openModal('edit-user', { role:'user' }); break;
    case 'edit-user': { const u = data.users.find(x=>x.id===btn.dataset.id); openModal('edit-user', {...u}); break; }
    case 'delete-user': {
      if(btn.disabled) break;
      state.modal = { type:'confirm', title:"Supprimer cet utilisateur", message:'Ce compte ne pourra plus se connecter. Continuer ?',
        onConfirm: () => {
          const uid_ = btn.dataset.id;
          const prof = data.users.find(u=>u.id===uid_);
          data.users = data.users.filter(u=>u.id!==uid_);
          if(data.dossiers) delete data.dossiers[uid_];
          (data.formations||[]).forEach(f => { f.inscrits = f.inscrits.filter(id=>id!==uid_); });
          if(state.selectedProfId === uid_) state.selectedProfId = null;
          logActivity(`Compte supprimé : ${prof?prof.displayName:uid_}`);
          saveData();
        } };
      render(); break; }

    case 'select-prof': state.selectedProfId = btn.dataset.id; render(); break;
    case 'back-to-roster': state.selectedProfId = null; render(); break;
    case 'print-dossier': window.print(); break;

    case 'add-affectation': openModal('edit-affectation', { uid: btn.dataset.uid }); break;
    case 'edit-affectation': {
      const dos = ensureDossier(btn.dataset.uid); const a = dos.affectations.find(x=>x.id===btn.dataset.aid);
      openModal('edit-affectation', { uid: btn.dataset.uid, ...a });
      break; }
    case 'delete-affectation': {
      state.modal = { type:'confirm', title:'Supprimer cette affectation', message:'Cette action est définitive. Continuer ?',
        onConfirm: () => { const dos=ensureDossier(btn.dataset.uid); dos.affectations = dos.affectations.filter(a=>a.id!==btn.dataset.aid); saveData(); } };
      render(); break; }

    case 'add-absence': openModal('edit-absence', { uid: btn.dataset.uid, byAdmin: isAdmin() }); break;
    case 'validate-absence': {
      const dos = ensureDossier(btn.dataset.uid); const a = dos.absences.find(x=>x.id===btn.dataset.aid);
      if(a){ a.statut='validée'; const prof=data.users.find(u=>u.id===btn.dataset.uid); logActivity(`Absence validée pour ${prof?prof.displayName:'un professeur'} (${a.date})`); saveData(); render(); }
      break; }
    case 'refuse-absence': {
      const dos = ensureDossier(btn.dataset.uid); const a = dos.absences.find(x=>x.id===btn.dataset.aid);
      if(a){ a.statut='refusée'; const prof=data.users.find(u=>u.id===btn.dataset.uid); logActivity(`Absence refusée pour ${prof?prof.displayName:'un professeur'} (${a.date})`); saveData(); render(); }
      break; }
    case 'delete-absence': {
      state.modal = { type:'confirm', title:'Supprimer cette absence', message:'Cette action est définitive. Continuer ?',
        onConfirm: () => { const dos=ensureDossier(btn.dataset.uid); dos.absences = dos.absences.filter(a=>a.id!==btn.dataset.aid); saveData(); } };
      render(); break; }

    case 'add-formation': openModal('edit-formation', {}); break;
    case 'edit-formation': { const f = data.formations.find(x=>x.id===btn.dataset.id); openModal('edit-formation', {...f}); break; }
    case 'delete-formation': {
      state.modal = { type:'confirm', title:'Supprimer cette formation', message:'Les inscriptions associées seront perdues. Continuer ?',
        onConfirm: () => { data.formations = data.formations.filter(f=>f.id!==btn.dataset.id); saveData(); } };
      render(); break; }
    case 'toggle-formation-inscrits': state.expandedFormationId = (state.expandedFormationId===btn.dataset.id) ? null : btn.dataset.id; render(); break;
    case 'toggle-inscription': {
      const f = data.formations.find(x=>x.id===btn.dataset.id);
      if(!f) break;
      const already = f.inscrits.includes(session.id);
      if(already){ f.inscrits = f.inscrits.filter(id=>id!==session.id); }
      else if(f.inscrits.length < f.places){ f.inscrits.push(session.id); }
      saveData(); render(); break; }

    case 'confirm-yes': { const cb = state.modal && state.modal.onConfirm; state.modal=null; if(cb) cb(); render(); break; }

    case 'export-data': {
      const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'portail-arena-donnees.json'; document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      break; }
    case 'export-personnel-csv': {
      const rows = [['Matricule','Nom','Identifiant','Établissement en cours','Indice majoré','Solde congés','Jours pris','Jours restants']];
      data.users.filter(u=>u.role==='user').forEach(u=>{
        const dos = ensureDossier(u.id);
        const enCours = dos.affectations.find(a=>!a.fin);
        const pris = dos.absences.filter(a=>a.statut==='validée').reduce((n,a)=>n+parseDureeJours(a.duree),0);
        rows.push([dos.matricule||'', u.displayName, u.username, enCours?enCours.etablissement:'', (dos.salaire&&dos.salaire.indiceMajore)||'', dos.soldeConges, pris, dos.soldeConges-pris]);
      });
      const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(';')).join('\r\n');
      const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'professeurs-'+todayIso()+'.csv'; document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      break; }
    case 'import-data': document.getElementById('import-file-input').click(); break;
    case 'reset-data': {
      state.modal = { type:'confirm', title:'Réinitialiser les données', message:'Toutes les données actuelles seront remplacées par les valeurs de démonstration. Continuer ?',
        onConfirm: () => { data = defaultData(); saveData(); state.route='dashboard'; } };
      render(); break; }
  }
});

document.addEventListener('change', function(e){
  if(e.target.id === 'import-file-input' && e.target.files[0]){
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = function(ev){
      try{
        const parsed = JSON.parse(ev.target.result);
        if(!parsed.meta || !parsed.modules || !parsed.users) throw new Error('format invalide');
        data = parsed; saveData(); render();
      }catch(err){
        alert("Ce fichier n'est pas un export valide du portail ARENA.");
      }
    };
    reader.readAsText(file);
  }
});

document.addEventListener('submit', function(e){
  e.preventDefault();
  const form = e.target;

  if(form.dataset.form === 'login'){
    const fd = new FormData(form);
    const username = (fd.get('username')||'').trim();
    const password = fd.get('password')||'';
    const user = data.users.find(u => u.username === username && u.password === password);
    if(user){ session = user; saveSessionUserId(user.id); state.loginError=''; state.route='dashboard'; render(); }
    else { state.loginError = 'Identifiant ou mot de passe incorrect.'; render(); }
    return;
  }

  if(form.dataset.form === 'general'){
    const fd = new FormData(form);
    data.meta.collegeName = fd.get('collegeName').trim() || data.meta.collegeName;
    data.meta.tagline = fd.get('tagline').trim() || data.meta.tagline;
    saveData(); render(); return;
  }

  if(form.dataset.form === 'banner'){
    const fd = new FormData(form);
    data.banner.text = fd.get('text').trim();
    saveData(); render(); return;
  }

  if(form.dataset.form === 'dossier-situation'){
    const fd = new FormData(form);
    const dos = ensureDossier(form.dataset.uid);
    dos.situation = fd.get('situation');
    saveData(); render(); return;
  }

  if(form.dataset.form === 'dossier-salaire'){
    const fd = new FormData(form);
    const dos = ensureDossier(form.dataset.uid);
    const im = parseFloat(fd.get('indiceMajore'));
    dos.salaire = dos.salaire || {};
    dos.salaire.indiceMajore = isNaN(im) ? dos.salaire.indiceMajore : im;
    saveData(); render(); return;
  }

  if(form.dataset.form === 'dossier-conges'){
    const fd = new FormData(form);
    const dos = ensureDossier(form.dataset.uid);
    const solde = parseFloat(fd.get('soldeConges'));
    dos.soldeConges = isNaN(solde) ? dos.soldeConges : solde;
    saveData(); render(); return;
  }

  if(form.dataset.form === 'change-password'){
    const fd = new FormData(form);
    const current = fd.get('current'), next = fd.get('next'), confirm = fd.get('confirm');
    if(current !== session.password){ state.accountMsg = { ok:false, text:'Mot de passe actuel incorrect.' }; render(); return; }
    if(next !== confirm){ state.accountMsg = { ok:false, text:'Les deux nouveaux mots de passe ne correspondent pas.' }; render(); return; }
    if(next.length < 4){ state.accountMsg = { ok:false, text:'Le nouveau mot de passe doit contenir au moins 4 caractères.' }; render(); return; }
    session.password = next;
    const u = data.users.find(x=>x.id===session.id); if(u) u.password = next;
    saveData();
    state.accountMsg = { ok:true, text:'Mot de passe mis à jour avec succès.' };
    render(); return;
  }

  if(form.dataset.form === 'modal'){
    const mo = state.modal; const fd = new FormData(form);
    if(mo.type === 'edit-stat'){
      const value = fd.get('value').trim(), label = fd.get('label').trim();
      if(mo.data.id){ const s = data.stats.find(x=>x.id===mo.data.id); s.value=value; s.label=label; }
      else data.stats.push({ id: uid('st'), value, label });
      saveData();
    }
    else if(mo.type === 'edit-module'){
      const title = fd.get('title').trim(), description = fd.get('description').trim();
      const iconName = fd.get('icon') || 'folder'; const type = fd.get('type');
      if(mo.data.id){ const m = data.modules.find(x=>x.id===mo.data.id); m.title=title; m.description=description; m.icon=iconName; }
      else { data.modules.push({ id: uid('mod'), title, description, icon:iconName, type, tabs: type==='tabs'?[]:undefined, posts: type==='feed'?[]:undefined }); }
      saveData();
    }
    else if(mo.type === 'add-tab'){
      const name = fd.get('name').trim();
      const m = findModule(mo.data.mid);
      m.tabs.push({ id: uid('tab'), name, content: '' });
      saveData();
    }
    else if(mo.type === 'rename-tab'){
      const name = fd.get('name').trim();
      const m = findModule(mo.data.mid); const t = m.tabs.find(x=>x.id===mo.data.tid);
      t.name = name; saveData();
    }
    else if(mo.type === 'edit-tab-content'){
      const content = fd.get('content');
      const m = findModule(mo.data.mid); const t = m.tabs.find(x=>x.id===mo.data.tid);
      t.content = content; saveData();
    }
    else if(mo.type === 'edit-post'){
      const title = fd.get('title').trim(), body = fd.get('body');
      const m = findModule(mo.data.mid);
      if(mo.data.id){ const p = m.posts.find(x=>x.id===mo.data.id); p.title=title; p.body=body; }
      else m.posts.push({ id: uid('post'), date: todayStr(), title, body });
      saveData();
    }
    else if(mo.type === 'edit-user'){
      const displayName = fd.get('displayName').trim(), username = fd.get('username').trim(), password = fd.get('password'), role = fd.get('role');
      const dup = data.users.find(u => u.username === username && u.id !== mo.data.id);
      if(dup){ alert('Cet identifiant est déjà utilisé par un autre compte.'); return; }
      if(mo.data.id){
        const u = data.users.find(x=>x.id===mo.data.id);
        u.displayName=displayName; u.username=username; u.role=role;
        if(password) u.password = password;
        if(session && session.id === u.id) session = u;
        logActivity(`Compte modifié : ${displayName} (${username})`);
      } else {
        data.users.push({ id: uid('u'), displayName, username, password, role });
        logActivity(`Compte créé : ${displayName} (${username})`);
      }
      saveData();
    }
    else if(mo.type === 'edit-affectation'){
      const etablissement = fd.get('etablissement').trim(), debut = fd.get('debut').trim(), fin = fd.get('fin').trim();
      const dos = ensureDossier(mo.data.uid);
      const prof = data.users.find(u=>u.id===mo.data.uid);
      if(mo.data.id){
        const a = dos.affectations.find(x=>x.id===mo.data.id);
        a.etablissement=etablissement; a.debut=debut; a.fin=fin;
      } else {
        dos.affectations.push({ id: uid('aff'), etablissement, debut, fin });
      }
      logActivity(`Affectation mise à jour pour ${prof?prof.displayName:'un professeur'} : ${etablissement}`);
      saveData();
    }
    else if(mo.type === 'edit-absence'){
      const date = fd.get('date'), motif = fd.get('motif').trim(), duree = fd.get('duree').trim();
      const dos = ensureDossier(mo.data.uid);
      const prof = data.users.find(u=>u.id===mo.data.uid);
      if(mo.data.id){
        const a = dos.absences.find(x=>x.id===mo.data.id);
        a.date=date; a.motif=motif; a.duree=duree;
        if(mo.data.byAdmin) a.statut = fd.get('statut');
      } else {
        dos.absences.push({ id: uid('abs'), date, motif, duree, statut: mo.data.byAdmin ? fd.get('statut') : 'en attente' });
      }
      logActivity(`Absence enregistrée pour ${prof?prof.displayName:'un professeur'} (${date})`);
      saveData();
    }
    else if(mo.type === 'edit-formation'){
      const title = fd.get('title').trim(), description = fd.get('description').trim(), date = fd.get('date'), lieu = fd.get('lieu').trim();
      const places = Math.max(1, parseInt(fd.get('places'),10) || 1);
      if(mo.data.id){
        const f = data.formations.find(x=>x.id===mo.data.id);
        f.title=title; f.description=description; f.date=date; f.lieu=lieu; f.places=places;
        logActivity(`Formation modifiée : ${title}`);
      } else {
        data.formations.push({ id: uid('form'), title, description, date, lieu, places, inscrits: [] });
        logActivity(`Formation créée : ${title}`);
      }
      saveData();
    }
    state.modal = null; render(); return;
  }
});

/* ---------------------------- INIT ---------------------------- */
render();
</script>
</body>
</html>
