      const userOptions = data.users.filter(u => u.id !== session.id).map(u => `<option value="${u.id}" ${(f.users||[]).includes(u.id) ? 'selected' : ''}>${escapeHtml(u.displayName)}</option>`).join('');
      body = `
        <div class="field"><label>Nom du dossier</label><input name="name" value="${escapeHtml(f.name||'')}" autofocus required></div>
        <div class="field"><label>Dossier parent</label><select name="parentId">${parentOptions}</select></div>
        <div class="field"><label>Utilisateurs (sélectionnez plusieurs)</label><select name="users" multiple size="4" style="height:auto;">${userOptions}</select><div class="field-hint">Maintenez Ctrl (Cmd) pour sélectionner plusieurs.</div></div>
      `;
      break;
    }
    case 'edit-ressource':
      title = d.id ? 'Modifier une ressource' : 'Ajouter une ressource';
      body = `
        <div class="field"><label>Nom</label><input name="name" value="${escapeHtml(d.name||'')}" autofocus required></div>
        <div class="field"><label>Type</label><select name="type"><option value="salle" ${d.type==='salle'?'selected':''}>Salle</option><option value="matériel" ${d.type==='matériel'?'selected':''}>Matériel</option></select></div>
        <div class="field"><label>Description</label><textarea name="description" rows="2">${escapeHtml(d.description||'')}</textarea></div>
      `;
      break;
    case 'block-ressource':
      title = `Bloquer ${escapeHtml(d.name)}`;
      body = `
        <div class="field"><label>Message (sera affiché en rouge avec !)</label><input name="blockMessage" value="${escapeHtml(d.blockMessage||'')}" placeholder="ex: Maintenance le 15/06" required></div>
        <div class="field"><label>Durée (optionnel)</label><select name="duration"><option value="">Indéfiniment</option><option value="1h">1 heure</option><option value="2h">2 heures</option><option value="1j">1 jour</option><option value="1sem">1 semaine</option></select></div>
        <div class="field-hint">Le blocage prend effet immédiatement. Pour lever le blocage, utilisez le bouton débloquer.</div>
      `;
      break;
    case 'add-tab':
    case 'rename-tab':
      title = type === 'add-tab' ? 'Ajouter un onglet' : "Renommer l'onglet";
      body = `<div class="field"><label>Nom</label><input name="name" value="${escapeHtml(d.name||'')}" autofocus required></div>`;
      break;
    case 'edit-tab-content':
      title = 'Modifier le contenu — ' + escapeHtml(d.name);
      body = `<div class="field"><label>Contenu</label><textarea name="content" rows="10" autofocus>${escapeHtml(d.content||'')}</textarea><div class="field-hint">## titre, - liste, > encadré, lignes vides = paragraphes.</div></div>`;
      break;
    case 'edit-post':
      title = d.id ? "Modifier l'annonce" : 'Nouvelle annonce';
      body = `<div class="field"><label>Titre</label><input name="title" value="${escapeHtml(d.title||'')}" autofocus required></div><div class="field"><label>Contenu</label><textarea name="body" rows="6">${escapeHtml(d.body||'')}</textarea><div class="field-hint">Même mise en forme que les onglets.</div></div>`;
      break;
    case 'add-document':
      title = 'Ajouter un document';
      body = `<div class="field"><label>Fichier</label><input type="file" name="file" required accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,.jpg,.png,.jpeg,.gif"></div><div class="field"><label>Description (optionnel)</label><textarea name="description" rows="2"></textarea></div>`;
      footer = `<button class="btn" data-action="close-modal">Annuler</button><button class="btn btn-primary" type="submit" form="modal-form">${icon('upload')} Télécharger</button>`;
      break;
    case 'add-transaction':
      title = 'Nouvelle dépense';
      body = `<div class="field"><label>Libellé</label><input name="name" autofocus required></div><div class="field"><label>Montant (€)</label><input type="number" name="amount" step="0.01" required></div>`;
      break;
    case 'add-notification':
      title = 'Nouvelle notification';
      body = `<div class="field"><label>Titre</label><input name="title" autofocus required></div><div class="field"><label>Message (optionnel)</label><textarea name="message" rows="3"></textarea></div><div class="field"><label>Date d'expiration (optionnelle)</label><input type="date" name="expiry"></div>`;
      break;
    case 'add-role':
    case 'edit-role': {
      const r = d;
      title = type === 'add-role' ? 'Ajouter un rôle' : 'Modifier un rôle';
      const permOptions = ['manage_resources','approve_reservations','view_dashboard','book_resources','view_personnel','manage_users','manage_absences','manage_formations'];
      const selectedPerms = r.permissions || [];
      body = `
        <div class="field"><label>Nom du rôle</label><input name="name" value="${escapeHtml(r.name||'')}" autofocus required></div>
        <div class="field"><label>Permissions</label><select name="permissions" multiple size="6" style="height:auto;">${permOptions.map(p => `<option value="${p}" ${selectedPerms.includes(p) ? 'selected' : ''}>${p}</option>`).join('')}</select><div class="field-hint">Maintenez Ctrl (Cmd) pour sélectionner plusieurs.</div>
      `;
      break;
    }
    case 'edit-college-event':
    case 'edit-personal-event': {
      const isCollege = type === 'edit-college-event';
      title = isCollege ? 'Événement du collège' : 'Événement personnel';
      body = `
        <div class="field"><label>Titre</label><input name="title" value="${escapeHtml(d.title||'')}" autofocus required></div>
        <div class="field"><label>Date</label><input type="date" name="date" value="${escapeHtml(d.date||todayIso())}" required></div>
        <div class="field"><label>Description</label><textarea name="description" rows="3">${escapeHtml(d.description||'')}</textarea></div>
      `;
      break;
    }
    default:
      return '';
  }
  return `<div class="overlay"><div class="modal" data-stop><div class="modal-head"><h3>${title}</h3><button class="btn btn-ghost btn-icon" data-action="close-modal">${icon('x')}</button></div><form id="modal-form" data-form="modal"><div class="modal-body">${body}</div><div class="modal-foot">${footer}</div></form></div></div>`;
}

function flattenFolders(folders, parentId=''){
  let result = [];
  folders.forEach(f => {
    result.push({ id: f.id, name: f.name, parentId });
    if(f.children) result = result.concat(flattenFolders(f.children, f.id));
  });
  return result;
}

/* ======================= GESTIONNAIRES D'ÉVÉNEMENTS (complets) ======================= */
document.addEventListener('click', function(e){
  // Gestion des switchs "toggle-setting"
  const toggleBtn = e.target.closest('[data-action="toggle-setting"]');
  if(toggleBtn){
    const setting = toggleBtn.dataset.setting;
    const key = toggleBtn.dataset.key;
    if(setting && key && data[setting] && typeof data[setting][key] === 'boolean'){
      data[setting][key] = !data[setting][key];
      saveData();
      render();
    }
    return;
  }

  // Gestion des onglets de paramètres
  const tabBtn = e.target.closest('[data-action="settings-tab"]');
  if(tabBtn){
    state.settingsTab = tabBtn.dataset.tab;
    render();
    return;
  }

  // Gestion des boutons de navigation
  const action = e.target.closest('[data-action]')?.dataset.action;
  if(!action) return;

  // Actions simples
  if(action === 'go-dashboard'){ state.route='dashboard'; render(); return; }
  if(action === 'go-settings'){ state.route='settings'; render(); return; }
  if(action === 'go-account'){ state.route='account'; render(); return; }
  if(action === 'toggle-theme'){ state.theme = state.theme === 'dark' ? 'light' : 'dark'; saveTheme(state.theme); render(); return; }
  if(action === 'open-module'){ state.route='module:'+e.target.closest('[data-action]').dataset.id; render(); return; }
  if(action === 'logout'){ session=null; saveSessionUserId(null); state.route='dashboard'; render(); return; }
  if(action === 'toggle-edit'){ state.editMode = !state.editMode; render(); return; }
  if(action === 'close-modal'){ state.modal=null; render(); return; }
  if(action === 'toggle-notif'){ state.notifOpen = !state.notifOpen; render(); return; }
  if(action === 'toggle-banner'){ data.banner.enabled = !data.banner.enabled; saveData(); render(); return; }
  if(action === 'toggle-maintenance'){ data.maintenance.enabled = !data.maintenance.enabled; saveData(); render(); return; }
  if(action === 'filter-exams'){ state.examFilter = e.target.closest('[data-action]').dataset.filter; render(); return; }
  if(action === 'show-notification'){ const text=e.target.closest('[data-action]').dataset.text; showToast(text, 'info', 3000); return; }
  if(action === 'print-dossier'){ window.print(); return; }
  if(action === 'back-to-roster'){ state.selectedProfId = null; render(); return; }
  if(action === 'select-prof'){ state.selectedProfId = e.target.closest('[data-action]').dataset.id; state.route='module:personnel'; render(); return; }
  if(action === 'compose-message'){ state.msgCompose=true; state.msgReplyTo=e.target.closest('[data-action]').dataset.reply||null; render(); return; }
  if(action === 'back-to-messages'){ state.msgSelected=null; state.msgCompose=false; render(); return; }
  if(action === 'msg-folder'){ state.msgFolder=e.target.closest('[data-action]').dataset.folder; state.msgSelected=null; render(); return; }
  if(action === 'select-message'){ state.msgSelected=e.target.closest('[data-action]').dataset.id; render(); return; }
  if(action === 'delete-message'){ const id=e.target.closest('[data-action]').dataset.id; state.modal={type:'confirm',title:'Supprimer ce message',message:'Cette action est définitive. Continuer ?',onConfirm:()=>{ data.messages=data.messages.filter(m=>m.id!==id); state.msgSelected=null; saveData(); render(); }}; render(); return; }

  // Gestion des modales (ouvrir)
  const modalActions = ['add-stat','edit-stat','add-module','edit-module','add-user','edit-user','add-affectation','edit-affectation','add-absence','edit-absence','add-formation','edit-formation','add-exam','edit-exam','manage-classes','add-document','add-transaction','add-notification','add-folder','edit-folder','delete-folder','add-ressource','edit-ressource','add-tab','rename-tab','edit-tab-content','add-post','edit-post','add-role','edit-role','add-college-event','edit-college-event','add-personal-event','edit-personal-event','delete-college-event','delete-personal-event','toggle-exam-publish','toggle-formation-inscrits','toggle-inscription','validate-absence','refuse-absence','delete-absence','delete-affectation','delete-user','delete-module','delete-stat','delete-post','delete-tab','move-tab','move-module','delete-ressource','toggle-block-ressource','approve-reservation','reject-reservation','book-slot','delete-transaction','delete-notification','delete-document','delete-class','delete-role','import-csv','export-data','import-data','export-personnel-csv','test-smtp','sort-profs'];
  if(modalActions.includes(action)){
    handleModalAction(action, e);
    return;
  }

  // Actions spécifiques
  if(action === 'add-recipient'){
    const id = e.target.closest('[data-action]').dataset.id;
    if(id && !state.selectedRecipients.includes(id)){
      state.selectedRecipients.push(id);
      const hidden = document.getElementById('recipients-hidden');
      const container = document.getElementById('selected-recipients');
      if(hidden) hidden.value = state.selectedRecipients.join(',');
      if(container){
        container.innerHTML = state.selectedRecipients.map(uid => {
          const u = data.users.find(x => x.id === uid);
          return u ? `<span class="user-chip-mini">${escapeHtml(u.displayName)} <button class="remove-btn" data-action="remove-recipient" data-id="${uid}">✕</button></span>` : '';
        }).join('');
      }
    }
    return;
  }
  if(action === 'remove-recipient'){
    const id = e.target.closest('[data-action]').dataset.id;
    state.selectedRecipients = state.selectedRecipients.filter(uid => uid !== id);
    const hidden = document.getElementById('recipients-hidden');
    const container = document.getElementById('selected-recipients');
    if(hidden) hidden.value = state.selectedRecipients.join(',');
    if(container){
      container.innerHTML = state.selectedRecipients.map(uid => {
        const u = data.users.find(x => x.id === uid);
        return u ? `<span class="user-chip-mini">${escapeHtml(u.displayName)} <button class="remove-btn" data-action="remove-recipient" data-id="${uid}">✕</button></span>` : '';
      }).join('');
    }
    return;
  }
  if(action === 'confirm-yes' && state.modal && state.modal.onConfirm){
    const cb = state.modal.onConfirm;
    state.modal = null;
    cb();
    render();
    return;
  }
});

function handleModalAction(action, e){
  const target = e.target.closest('[data-action]');
  const id = target.dataset.id;
  const mid = target.dataset.mid;
  const uid_ = target.dataset.uid;
  switch(action){
    case 'add-stat': openModal('edit-stat',{}); break;
    case 'edit-stat': { const s=data.stats.find(x=>x.id===id); if(s) openModal('edit-stat',{...s}); break; }
    case 'add-module': openModal('edit-module',{type:'tabs',icon:'folder'}); break;
    case 'edit-module': { const m=data.modules.find(x=>x.id===id); if(m) openModal('edit-module',{...m}); break; }
    case 'add-user': openModal('edit-user',{role:'user'}); break;
    case 'edit-user': { const u=data.users.find(x=>x.id===id); if(u) openModal('edit-user',{...u}); break; }
    case 'add-affectation': openModal('edit-affectation',{uid:uid_}); break;
    case 'edit-affectation': { const dos=ensureDossier(uid_); const a=dos.affectations.find(x=>x.id===id); if(a) openModal('edit-affectation',{uid:uid_,...a}); break; }
    case 'add-absence': openModal('edit-absence',{uid:uid_,byAdmin:isAdmin()}); break;
    case 'edit-absence': { const dos=ensureDossier(uid_); const a=dos.absences.find(x=>x.id===id); if(a) openModal('edit-absence',{uid:uid_,...a,byAdmin:isAdmin()}); break; }
    case 'add-formation': openModal('edit-formation',{}); break;
    case 'edit-formation': { const f=data.formations.find(x=>x.id===id); if(f) openModal('edit-formation',{...f}); break; }
    case 'add-exam': openModal('edit-exam',{classes:[],published:true}); break;
    case 'edit-exam': { const e=data.examens.find(x=>x.id===id); if(e) openModal('edit-exam',{...e}); break; }
    case 'manage-classes': openModal('manage-classes',{}); break;
    case 'add-document': openModal('add-document',{}); break;
    case 'add-transaction': openModal('add-transaction',{}); break;
    case 'add-notification': openModal('add-notification',{}); break;
    case 'add-folder': openModal('add-folder',{}); break;
    case 'edit-folder': { const findFolder=(folders,id)=>{ for(let f of folders){ if(f.id===id) return f; if(f.children){ const res=findFolder(f.children,id); if(res) return res; } } return null; }; const f=findFolder(data.recipientFolders,id); if(f) openModal('edit-folder',{...f,parentId:findParentId(data.recipientFolders,id)}); break; }
    case 'add-ressource': openModal('edit-ressource',{type:'salle'}); break;
    case 'edit-ressource': { const r=data.ressources.find(x=>x.id===id); if(r) openModal('edit-ressource',{...r}); break; }
    case 'add-tab': openModal('add-tab',{mid:mid,name:''}); break;
    case 'rename-tab': { const m=data.modules.find(x=>x.id===mid); const t=m.tabs.find(x=>x.id===id); if(t) openModal('rename-tab',{mid:mid,tid:id,name:t.name}); break; }
    case 'edit-tab-content': { const m=data.modules.find(x=>x.id===mid); const t=m.tabs.find(x=>x.id===id); if(t) openModal('edit-tab-content',{mid:mid,tid:id,name:t.name,content:t.content}); break; }
    case 'add-post': openModal('edit-post',{mid:mid}); break;
    case 'edit-post': { const m=data.modules.find(x=>x.id===mid); const p=m.posts.find(x=>x.id===id); if(p) openModal('edit-post',{mid:mid,id:p.id,title:p.title,body:p.body}); break; }
    case 'add-role': openModal('add-role',{permissions:[]}); break;
    case 'edit-role': { const r=data.roles.find(x=>x.id===id); if(r) openModal('edit-role',{...r}); break; }
    case 'add-college-event': openModal('edit-college-event',{}); break;
    case 'edit-college-event': { const evt=data.collegeEvents.find(e=>e.id===id); if(evt) openModal('edit-college-event',{...evt}); break; }
    case 'add-personal-event': openModal('edit-personal-event',{}); break;
    case 'edit-personal-event': { const dos=ensureDossier(session.id); const evt=dos.personalEvents.find(e=>e.id===id); if(evt) openModal('edit-personal-event',{...evt}); break; }
    case 'delete-college-event': { const id2=id; state.modal={type:'confirm',title:'Supprimer cet événement',message:'Cette action est définitive. Continuer ?',onConfirm:()=>{ data.collegeEvents=data.collegeEvents.filter(e=>e.id!==id2); saveData(); render(); }}; render(); break; }
    case 'delete-personal-event': { const id2=id; state.modal={type:'confirm',title:'Supprimer cet événement',message:'Cette action est définitive. Continuer ?',onConfirm:()=>{ const dos=ensureDossier(session.id); dos.personalEvents=dos.personalEvents.filter(e=>e.id!==id2); saveData(); render(); }}; render(); break; }
    case 'toggle-exam-publish': { const e=data.examens.find(x=>x.id===id); if(e){ e.published=!e.published; saveData(); render(); } break; }
    case 'toggle-formation-inscrits': state.expandedFormationId = (state.expandedFormationId===id)?null:id; render(); break;
    case 'toggle-inscription': { const f=data.formations.find(x=>x.id===id); if(f){ const already=f.inscrits.includes(session.id); if(already){ f.inscrits=f.inscrits.filter(uid=>uid!==session.id); } else if(f.inscrits.length<f.places){ f.inscrits.push(session.id); } saveData(); render(); } break; }
    case 'validate-absence': { const dos=ensureDossier(uid_); const a=dos.absences.find(x=>x.id===id); if(a){ a.statut='validée'; saveData(); render(); } break; }
    case 'refuse-absence': { const dos=ensureDossier(uid_); const a=dos.absences.find(x=>x.id===id); if(a){ a.statut='refusée'; saveData(); render(); } break; }
    case 'delete-absence': { state.modal={type:'confirm',title:'Supprimer cette absence',message:'Cette action est définitive. Continuer ?',onConfirm:()=>{ const dos=ensureDossier(uid_); dos.absences=dos.absences.filter(a=>a.id!==id); saveData(); render(); }}; render(); break; }
    case 'delete-affectation': { state.modal={type:'confirm',title:'Supprimer cette affectation',message:'Cette action est définitive. Continuer ?',onConfirm:()=>{ const dos=ensureDossier(uid_); dos.affectations=dos.affectations.filter(a=>a.id!==id); saveData(); render(); }}; render(); break; }
    case 'delete-user': { state.modal={type:'confirm',title:"Supprimer cet utilisateur",message:'Ce compte ne pourra plus se connecter. Continuer ?',onConfirm:()=>{ const uid=id; const prof=data.users.find(u=>u.id===uid); data.users=data.users.filter(u=>u.id!==uid); if(data.dossiers) delete data.dossiers[uid]; (data.formations||[]).forEach(f=>{ f.inscrits=f.inscrits.filter(uid2=>uid2!==uid); }); if(state.selectedProfId===uid) state.selectedProfId=null; const removeFromFolders=(folders,id)=>{ folders.forEach(f=>{ if(f.users) f.users=f.users.filter(uid=>uid!==id); if(f.children) removeFromFolders(f.children,id); }); }; removeFromFolders(data.recipientFolders,uid); logActivity(`Compte supprimé : ${prof?prof.displayName:uid}`); saveData(); }}; render(); break; }
    case 'delete-module': { state.modal={type:'confirm',title:'Supprimer ce module',message:'Le module et tout son contenu seront supprimés. Continuer ?',onConfirm:()=>{ data.modules=data.modules.filter(m=>m.id!==id); saveData(); if(state.route==='module:'+id) state.route='dashboard'; render(); }}; render(); break; }
    case 'delete-stat': { state.modal={type:'confirm',title:'Supprimer cette statistique',message:'Cette carte disparaîtra du tableau de bord. Continuer ?',onConfirm:()=>{ data.stats=data.stats.filter(s=>s.id!==id); saveData(); }}; render(); break; }
    case 'delete-post': { state.modal={type:'confirm',title:'Supprimer cette annonce',message:'Cette action est définitive. Continuer ?',onConfirm:()=>{ const m=data.modules.find(x=>x.id===mid); m.posts=m.posts.filter(p=>p.id!==id); saveData(); }}; render(); break; }
    case 'delete-tab': { state.modal={type:'confirm',title:'Supprimer cet onglet',message:'Cette action est définitive. Voulez-vous continuer ?',onConfirm:()=>{ const m=data.modules.find(x=>x.id===mid); m.tabs=m.tabs.filter(t=>t.id!==id); saveData(); }}; render(); break; }
    case 'move-tab': { const m=data.modules.find(x=>x.id===mid); const idx=m.tabs.findIndex(t=>t.id===id); const dir=target.dataset.dir==='up'?-1:1; const j=idx+dir; if(j>=0&&j<m.tabs.length){ [m.tabs[idx],m.tabs[j]]=[m.tabs[j],m.tabs[idx]]; saveData(); render(); } break; }
    case 'move-module': { const idx=data.modules.findIndex(m=>m.id===id); const dir=target.dataset.dir==='up'?-1:1; const j=idx+dir; if(j>=0&&j<data.modules.length){ [data.modules[idx],data.modules[j]]=[data.modules[j],data.modules[idx]]; saveData(); render(); } break; }
    case 'delete-ressource': { state.modal={type:'confirm',title:'Supprimer cette ressource',message:'Toutes les réservations associées seront également supprimées. Continuer ?',onConfirm:()=>{ data.ressources=data.ressources.filter(r=>r.id!==id); data.reservations=data.reservations.filter(r=>r.ressourceId!==id); saveData(); }}; render(); break; }
    case 'toggle-block-ressource': { const r=data.ressources.find(x=>x.id===id); if(r){ if(r.blocked){ r.blocked=false; r.blockMessage=''; r.blockUntil=null; } else { openModal('block-ressource',{id:r.id,name:r.name,blockMessage:r.blockMessage||''}); return; } saveData(); render(); } break; }
    case 'approve-reservation': { const res=data.reservations.find(r=>r.id===id); if(res){ res.status='approved'; logActivity(`Réservation approuvée : ${res.ressourceId} par ${res.userId}`); saveData(); render(); } break; }
    case 'reject-reservation': { const res=data.reservations.find(r=>r.id===id); if(res){ res.status='rejected'; logActivity(`Réservation refusée : ${res.ressourceId} par ${res.userId}`); saveData(); render(); } break; }
    case 'book-slot': {
      const ressourceId=target.dataset.res, date=target.dataset.date, startTime=target.dataset.start, endTime=target.dataset.end;
      const existing=data.reservations.find(r=>r.ressourceId===ressourceId && r.date===date && r.startTime===startTime && r.status==='approved');
      if(existing){ showToast('Ce créneau est déjà réservé.','error'); return; }
      const own=data.reservations.find(r=>r.ressourceId===ressourceId && r.date===date && r.startTime===startTime && r.userId===session.id);
      if(own){ showToast('Vous avez déjà réservé ce créneau.','error'); return; }
      const res=data.ressources.find(r=>r.id===ressourceId);
      if(res && res.blocked){ showToast('Cette ressource est actuellement bloquée.','error'); return; }
      const settings=data.reservationSettings||{maxReservationsPerWeek:3};
      const weekStart=new Date(state.ressourceWeekStart); const weekEnd=new Date(state.ressourceWeekStart); weekEnd.setDate(weekEnd.getDate()+6);
      const userReservationsThisWeek=(data.reservations||[]).filter(r=>{ const rDate=new Date(r.date); return r.userId===session.id && r.status==='approved' && rDate>=weekStart && rDate<=weekEnd; });
      if(settings.maxReservationsPerWeek && userReservationsThisWeek.length>=settings.maxReservationsPerWeek){ showToast('Vous avez atteint votre quota de réservations pour cette semaine.','error'); return; }
      const dayNames=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim']; const d=new Date(date); const dayOfWeek=dayNames[d.getDay()===0?6:d.getDay()-1];
      data.reservations.push({ id:uid('resv'), ressourceId, userId:session.id, date, startTime, endTime, dayOfWeek, status:'pending', createdAt:new Date().toISOString() });
      logActivity(`Demande de réservation : ${res?res.name:'ressource'} le ${date} ${startTime}-${endTime}`);
      saveData(); render();
      break;
    }
    case 'delete-transaction': { data.budget.transactions=data.budget.transactions.filter(t=>t.id!==id); data.budget.depenses=data.budget.transactions.reduce((sum,t)=>sum+t.amount,0); saveData(); render(); break; }
    case 'delete-notification': { data.notifications=data.notifications.filter(n=>n.id!==id); saveData(); render(); break; }
    case 'delete-document': { state.modal={type:'confirm',title:'Supprimer ce document',message:'Cette action est définitive. Continuer ?',onConfirm:()=>{ data.documents=data.documents.filter(d=>d.id!==id); saveData(); }}; render(); break; }
    case 'delete-class': { const name=target.dataset.name; data.classes=data.classes.filter(c=>c!==name); data.examens.forEach(e=>{ e.classes=e.classes.filter(c=>c!==name); }); saveData(); render(); break; }
    case 'delete-role': { state.modal={type:'confirm',title:'Supprimer ce rôle',message:'Cette action est définitive. Continuer ?',onConfirm:()=>{ data.roles=data.roles.filter(r=>r.id!==id); saveData(); }}; render(); break; }
    case 'import-csv': {
      const input=document.createElement('input'); input.type='file'; input.accept='.csv,.txt';
      input.onchange=()=>{ if(!input.files[0]) return; const reader=new FileReader(); reader.onload=(ev)=>{ const content=ev.target.result; const lines=content.split(/\r?\n/).filter(l=>l.trim()); let created=0; lines.forEach(line=>{ const parts=line.split(';').map(s=>s.trim()); if(parts.length<2) return; const [nom,prenom]=parts; const username=nom.toUpperCase(); const password=prenom+'.2026'; if(data.users.some(u=>u.username===username)) return; const id2=uid('u'); data.users.push({id:id2, displayName:prenom+' '+nom, username, password, role:'user'}); data.dossiers[id2]={ situation:'', affectations:[], salaire:{indiceMajore:400}, absences:[], soldeConges:25, matricule:nextMatricule() }; created++; }); if(created){ logActivity(`${created} compte(s) importé(s) depuis CSV`); saveData(); render(); } else alert('Aucun nouveau compte importé (format : NOM;Prénom)'); }; reader.readAsText(input.files[0]); }; input.click(); break;
    }
    case 'export-data': {
      const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='portail-arena-donnees.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); break;
    }
    case 'export-personnel-csv': {
      const rows=[['Matricule','Nom','Identifiant','Établissement en cours','Indice majoré','Solde congés','Jours pris','Jours restants']];
      data.users.filter(u=>u.role==='user').forEach(u=>{ const dos=ensureDossier(u.id); const enCours=dos.affectations.find(a=>!a.fin); const pris=dos.absences.filter(a=>a.statut==='validée').reduce((n,a)=>n+parseDureeJours(a.duree),0); rows.push([dos.matricule||'', u.displayName, u.username, enCours?enCours.etablissement:'', (dos.salaire&&dos.salaire.indiceMajore)||'', dos.soldeConges, pris, dos.soldeConges-pris]); });
      const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\r\n');
      const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='professeurs-'+todayIso()+'.csv'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); break;
    }
    case 'import-data': document.getElementById('import-file-input').click(); break;
    case 'test-smtp': showToast('Test SMTP : aucune configuration réelle.', 'warning'); break;
    case 'sort-profs': state.profSort=target.value; render(); break;
    default: break;
  }
}

function findParentId(folders, id, parent=''){
  for(let f of folders){
    if(f.id===id) return parent;
    if(f.children){ const res=findParentId(f.children,id,f.id); if(res!==undefined) return res; }
  }
  return undefined;
}

// Gestion des soumissions de formulaires
document.addEventListener('submit', function(e){
  const form = e.target;
  // Connexion
  if(form.dataset.form === 'login'){
    e.preventDefault();
    const fd = new FormData(form);
    const username = fd.get('username').trim();
    const password = fd.get('password') || '';
    const user = data.users.find(u => u.username === username && u.password === password);
    if(user){
      session = user;
      saveSessionUserId(user.id);
      state.loginError = '';
      state.route = 'dashboard';
      render();
    } else {
      state.loginError = 'Identifiant ou mot de passe incorrect.';
      render();
    }
    return;
  }
  if(form.dataset.form === 'maintenance-access'){
    e.preventDefault();
    const fd = new FormData(form);
    const pass = fd.get('password') || '';
    if(pass === (data.maintenance.password || '')){
      const adminUser = data.users.find(u => u.role === 'admin');
      if(adminUser){ session=adminUser; saveSessionUserId(adminUser.id); state.loginError=''; state.route='dashboard'; render(); }
      else { state.loginError='Aucun compte administrateur trouvé.'; render(); }
    } else {
      state.loginError='Mot de passe incorrect.';
      render();
    }
    return;
  }
  // Envoi de message
  if(form.dataset.form === 'send-message'){
    e.preventDefault();
    const fd = new FormData(form);
    const subject = fd.get('subject').trim();
    const draft = fd.get('draft') !== null;
    let body = document.getElementById('msg-body-hidden')?.value || '';
    let recipients = [];
    const msgSettings = data.messagingSettings || { blacklist: [] };
    if(msgSettings.blacklist.includes(session.id)){ showToast('Vous êtes sur la liste noire.','error'); return; }
    if(!draft && msgSettings.signature) body += `<br><br>--<br>${msgSettings.signature}`;
    if(isAdmin()){
      const folderId = fd.get('folder');
      if(folderId){
        const usersStr = getFolderUsers(folderId);
        recipients = usersStr ? usersStr.split(',').map(s => s.trim()).filter(s => s) : [];
      } else {
        const recips = fd.get('recipients') || '';
        recipients = recips.split(',').map(s => s.trim()).filter(s => s);
      }
    } else {
      const select = form.querySelector('select[name="recipients"]');
      if(select) recipients = Array.from(select.selectedOptions).map(opt => opt.value);
    }
    if(!subject || !body){ showToast('Veuillez remplir l\'objet et le message.','error'); return; }
    if(!recipients.length){ showToast('Veuillez sélectionner au moins un destinataire.','error'); return; }
    const msg = { id:uid('msg'), from:session.id, to:recipients, subject, body, date:new Date().toISOString(), dateStr:nowStr(), readBy:draft?[]:[session.id], draft:!!draft };
    data.messages.push(msg);
    if(!draft) logActivity(`Message envoyé à ${recipients.length} destinataire(s) : ${subject}`);
    saveData();
    state.msgCompose = false;
    state.msgReplyTo = null;
    state.msgFolder = 'sent';
    render();
    return;
  }
  // Autres formulaires
  const formActions = ['general','banner','dossier-situation','dossier-salaire','dossier-conges','change-password','add-class','budget-total','maintenance','apparence','reservations','notifications-advanced','messaging','security','advanced_appearance','smtp','compliance','add-todo'];
  if(formActions.includes(form.dataset.form)){
    e.preventDefault();
    const fd = new FormData(form);
    switch(form.dataset.form){
      case 'general': data.meta.collegeName=fd.get('collegeName').trim()||data.meta.collegeName; data.meta.tagline=fd.get('tagline').trim()||data.meta.tagline; break;
      case 'banner': data.banner.text=fd.get('text').trim(); break;
      case 'dossier-situation': { const dos=ensureDossier(form.dataset.uid); dos.situation=fd.get('situation'); break; }
      case 'dossier-salaire': { const dos=ensureDossier(form.dataset.uid); const im=parseFloat(fd.get('indiceMajore')); dos.salaire=dos.salaire||{}; dos.salaire.indiceMajore=isNaN(im)?dos.salaire.indiceMajore:im; break; }
      case 'dossier-conges': { const dos=ensureDossier(form.dataset.uid); const solde=parseFloat(fd.get('soldeConges')); dos.soldeConges=isNaN(solde)?dos.soldeConges:solde; break; }
      case 'change-password': {
        const current=fd.get('current'), next=fd.get('next'), confirm=fd.get('confirm');
        if(current!==session.password){ state.accountMsg={ok:false,text:'Mot de passe actuel incorrect.'}; render(); return; }
        if(next!==confirm){ state.accountMsg={ok:false,text:'Les deux mots de passe ne correspondent pas.'}; render(); return; }
        if(next.length<4){ state.accountMsg={ok:false,text:'Le mot de passe doit contenir au moins 4 caractères.'}; render(); return; }
        session.password=next; const u=data.users.find(x=>x.id===session.id); if(u) u.password=next;
        state.accountMsg={ok:true,text:'Mot de passe mis à jour avec succès.'};
        break;
      }
      case 'add-class': { const name=fd.get('className').trim(); if(name && !data.classes.includes(name)) data.classes.push(name); break; }
      case 'budget-total': { if(!data.budget) data.budget={total:0,depenses:0,transactions:[]}; data.budget.total=parseFloat(fd.get('total'))||0; data.budget.depenses=parseFloat(fd.get('depenses'))||0; break; }
      case 'maintenance': { if(!data.maintenance) data.maintenance={enabled:false,password:'',title:'',message:''}; data.maintenance.password=fd.get('password')||''; data.maintenance.title=fd.get('title')||'Maintenance en cours'; data.maintenance.message=fd.get('message')||'Le portail est actuellement en maintenance. Veuillez réessayer ultérieurement.'; break; }
      case 'apparence': {
        if(!data.customization) data.customization={primaryColor:'#8a6a34',footerText:'',logo:null};
        data.customization.primaryColor=fd.get('primaryColor')||'#8a6a34';
        data.customization.footerText=fd.get('footerText')||'Portail ARENA - Tous droits réservés.';
        const logoFile=form.querySelector('input[name="logo"]');
        if(logoFile && logoFile.files[0]){
          const reader=new FileReader();
          reader.onload=function(ev){ data.customization.logo=ev.target.result; saveData(); render(); };
          reader.readAsDataURL(logoFile.files[0]);
          return;
        }
        break;
      }
      case 'reservations': {
        const settings=data.reservationSettings||{};
        settings.startHour=parseInt(fd.get('startHour'))||8;
        settings.endHour=parseInt(fd.get('endHour'))||18;
        const workingDaysSelect=form.querySelector('select[name="workingDays"]');
        settings.workingDays=workingDaysSelect?Array.from(workingDaysSelect.selectedOptions).map(opt=>parseInt(opt.value)):[1,2,3,4,5];
        settings.maxDuration=parseInt(fd.get('maxDuration'))||2;
        settings.maxReservationsPerWeek=parseInt(fd.get('maxReservationsPerWeek'))||3;
        data.reservationSettings=settings;
        break;
      }
      case 'notifications-advanced': break; // switches déjà gérés
      case 'messaging': {
        const settings=data.messagingSettings||{};
        settings.signature=fd.get('signature')||'';
        const blacklistSelect=form.querySelector('select[name="blacklist"]');
        settings.blacklist=blacklistSelect?Array.from(blacklistSelect.selectedOptions).map(opt=>opt.value):[];
        data.messagingSettings=settings;
        break;
      }
      case 'security': {
        const s=data.securitySettings||{};
        s.minPasswordLength=parseInt(fd.get('minPasswordLength'))||6;
        s.sessionTimeout=parseInt(fd.get('sessionTimeout'))||30;
        s.maxLoginAttempts=parseInt(fd.get('maxLoginAttempts'))||5;
        s.lockoutDuration=parseInt(fd.get('lockoutDuration'))||15;
        data.securitySettings=s;
        break;
      }
      case 'advanced_appearance': {
        const a=data.advancedAppearance||{};
        a.fontFamily=fd.get('fontFamily')||'Inter';
        a.themeMode=fd.get('themeMode')||'light';
        a.customCSS=fd.get('customCSS')||'';
        data.advancedAppearance=a;
        break;
      }
      case 'smtp': {
        const s=data.smtpSettings||{};
        s.host=fd.get('host')||'';
        s.port=parseInt(fd.get('port'))||587;
        s.username=fd.get('username')||'';
        s.password=fd.get('password')||'';
        s.fromEmail=fd.get('fromEmail')||'';
        s.fromName=fd.get('fromName')||'Portail ARENA';
        data.smtpSettings=s;
        break;
      }
      case 'compliance': {
        const c=data.complianceSettings||{};
        c.cookieBannerText=fd.get('cookieBannerText')||'';
        c.legalMentions=fd.get('legalMentions')||'';
        c.dataRetentionDays=parseInt(fd.get('dataRetentionDays'))||365;
        data.complianceSettings=c;
        break;
      }
      case 'add-todo': {
        e.preventDefault();
        const input=form.querySelector('input[name="todoText"]');
        if(input && input.value.trim()){
          const dos=ensureDossier(session.id);
          dos.todoList.push({ id:uid('todo'), text:input.value.trim(), done:false, createdAt:new Date().toISOString() });
        }
        break;
      }
    }
    saveData();
    render();
    return;
  }
  // Formulaire modal
  if(form.dataset.form === 'modal'){
    e.preventDefault();
    const mo = state.modal;
    if(!mo) return;
    const fd = new FormData(form);
    // Traitement selon le type de modal
    const type = mo.type;
    switch(type){
      case 'edit-stat': {
        const value=fd.get('value').trim(), label=fd.get('label').trim();
        if(mo.data.id){ const s=data.stats.find(x=>x.id===mo.data.id); s.value=value; s.label=label; }
        else data.stats.push({id:uid('st'),value,label});
        break;
      }
      case 'edit-module': {
        const title=fd.get('title').trim(), description=fd.get('description').trim(), iconName=fd.get('icon')||'folder', type2=fd.get('type');
        if(mo.data.id){ const m=data.modules.find(x=>x.id===mo.data.id); m.title=title; m.description=description; m.icon=iconName; }
        else {
          const newModule={id:uid('mod'),title,description,icon:iconName,type:type2};
          if(type2==='tabs') newModule.tabs=[{id:uid('tab'),name:'Présentation',content:'## Bienvenue\n\nCe module a été créé automatiquement.'},{id:uid('tab'),name:'Documents',content:'## Documents\n\nAucun document pour le moment.'}];
          else if(type2==='feed') newModule.posts=[{id:uid('post'),date:todayStr(),title:'Bienvenue sur ce module',body:'Bienvenue sur ce nouveau module. Le contenu sera bientôt disponible.'}];
          else if(type2==='personnel') newModule.personnel=true;
          else if(type2==='formations') newModule.formations=true;
          else if(type2==='messagerie') newModule.messagerie=true;
          else if(type2==='ressources') newModule.ressources=true;

        else { m.posts.push({id:uid('post'),date:todayStr(),title,body}); logActivity(`Annonce créée : ${title}`); }

        const dup=data.users.find(u=>u.username===username && u.id!==mo.data.id);
        if(dup){ alert('Cet identifiant est déjà utilisé.'); return; }
        if(mo.data.id){ const u=data.users.find(x=>x.id===mo.data.id); u.displayName=displayName; u.username=username; u.role=role; if(password) u.password=password; if(session && session.id===u.id) session=u; logActivity(`Compte modifié : ${displayName} (${username})`); }
        else { const id=uid('u'); data.users.push({id,displayName,username,password,role}); data.dossiers[id]={situation:'',affectations:[],salaire:{indiceMajore:400},absences:[],soldeConges:25,matricule:nextMatricule()}; logActivity(`Compte créé : ${displayName} (${username})`); }
        break;
      }
      case 'edit-affectation': {
        const etablissement=fd.get('etablissement').trim(), debut=fd.get('debut').trim(), fin=fd.get('fin').trim();

        else { dos.affectations.push({id:uid('aff'),etablissement,debut,fin}); }

        else { dos.absences.push({id:uid('abs'),date,motif,duree,statut:mo.data.byAdmin?fd.get('statut'):'en attente'}); }

      }
      case 'edit-formation': {

        const dateLimite=fd.get('dateLimite'), places=Math.max(1,parseInt(fd.get('places'),10)||1);
        if(mo.data.id){ const f=data.formations.find(x=>x.id===mo.data.id); f.title=title; f.description=description; f.date=date; f.lieu=lieu; f.dateLimite=dateLimite; f.places=places; logActivity(`Formation modifiée : ${title}`); }
        else { data.formations.push({id:uid('form'),title,description,date,lieu,dateLimite,places,inscrits:[]}); logActivity(`Formation créée : ${title}`); }

      }
      case 'edit-exam': {
        const title=fd.get('title').trim(), date=fd.get('date');
        const select=form.querySelector('select[name="classes"]');
        const classes=select?Array.from(select.selectedOptions).map(opt=>opt.value):[];
        const published=fd.get('published')==='true';
        if(mo.data.id){ const e=data.examens.find(x=>x.id===mo.data.id); e.title=title; e.date=date; e.classes=classes; e.published=published; logActivity(`Examen modifié : ${title}`); }
        else { data.examens.push({id:uid('exam'),title,date,classes,published}); logActivity(`Examen créé : ${title}`); }

        reader.onload=function(ev){ const dataUrl=ev.target.result; const name=file.name; const size=(file.size/1024).toFixed(1)+' Ko'; data.documents.push({id:uid('doc'),name,size,date:todayStr(),data:dataUrl}); logActivity(`Document ajouté : ${name}`); saveData(); state.modal=null; render(); };

      case 'add-transaction': {

      case 'add-folder':
      case 'edit-folder': {

        const users=Array.from(form.querySelector('select[name="users"]')?.selectedOptions||[]).map(opt=>opt.value);
        if(!name){ alert('Le nom est requis.'); return; }
        const findParent=(folders,id)=>{ for(let f of folders){ if(f.id===id) return f; if(f.children){ const res=findParent(f.children,id); if(res) return res; } } return null; };
        if(mo.type==='edit-folder'){
          const removeFolder=(folders,id)=>{ for(let i=0;i<folders.length;i++){ if(folders[i].id===id){ folders.splice(i,1); return true; } if(folders[i].children){ if(removeFolder(folders[i].children,id)) return true; } } return false; };
          removeFolder(data.recipientFolders,mo.data.id);
          const parent=findParent(data.recipientFolders,parentId);
          const newFolder={id:mo.data.id,name,users};
          if(parent){ if(!parent.children) parent.children=[]; parent.children.push(newFolder); } else { data.recipientFolders.push(newFolder); }
        } else {
          const parent=findParent(data.recipientFolders,parentId);
          const newFolder={id:uid('rf'),name,users};
          if(parent){ if(!parent.children) parent.children=[]; parent.children.push(newFolder); } else { data.recipientFolders.push(newFolder); }
          logActivity(`Dossier destinataire créé : ${name}`);
        }
        break;
      }
      case 'edit-ressource': {
        const name=fd.get('name').trim(), type2=fd.get('type'), description=fd.get('description').trim();
        if(!name){ alert('Le nom est requis.'); return; }
        if(mo.data.id){ const r=data.ressources.find(x=>x.id===mo.data.id); r.name=name; r.type=type2; r.description=description; logActivity(`Ressource modifiée : ${name}`); }
        else { data.ressources.push({id:uid('res'),name,type:type2,description,blocked:false,blockMessage:''}); logActivity(`Ressource créée : ${name}`); }
        break;
      }
      case 'block-ressource': {
        const r=data.ressources.find(x=>x.id===mo.data.id);
        if(r){ r.blocked=true; r.blockMessage=fd.get('blockMessage').trim()||'Réservation bloquée'; const duration=fd.get('duration'); if(duration){ const now=new Date(); let until=new Date(now); if(duration==='1h') until.setHours(now.getHours()+1); else if(duration==='2h') until.setHours(now.getHours()+2); else if(duration==='1j') until.setDate(now.getDate()+1); else if(duration==='1sem') until.setDate(now.getDate()+7); else until=null; r.blockUntil=until?until.toISOString():null; } else { r.blockUntil=null; } logActivity(`Ressource bloquée : ${r.name} (${r.blockMessage})`); }
        break;
      }
      case 'add-role':
      case 'edit-role': {
        const name=fd.get('name').trim();
        const perms=Array.from(form.querySelector('select[name="permissions"]')?.selectedOptions||[]).map(opt=>opt.value);
        if(!name){ alert('Le nom est requis.'); return; }
        if(mo.type==='edit-role'){ const r=data.roles.find(x=>x.id===mo.data.id); if(r){ r.name=name; r.permissions=perms; } }
        else { data.roles.push({id:uid('role'),name,permissions:perms}); logActivity(`Rôle créé : ${name}`); }
        break;
      }
      case 'edit-college-event': {
        const title=fd.get('title').trim(), date=fd.get('date'), description=fd.get('description')||'';
        if(!title||!date){ alert('Le titre et la date sont requis.'); return; }
        const evtData={id:mo.data.id||uid('evt'),title,date,description};
        if(mo.data.id){ const idx=data.collegeEvents.findIndex(e=>e.id===mo.data.id); if(idx!==-1) data.collegeEvents[idx]=evtData; }
        else { data.collegeEvents.push(evtData); logActivity(`Événement collège ajouté : ${title}`); }
        break;
      }
      case 'edit-personal-event': {
        const title=fd.get('title').trim(), date=fd.get('date'), description=fd.get('description')||'';
        if(!title||!date){ alert('Le titre et la date sont requis.'); return; }
        const dos=ensureDossier(session.id);
        const evtData={id:mo.data.id||uid('evt'),title,date,description};
        if(mo.data.id){ const idx=dos.personalEvents.findIndex(e=>e.id===mo.data.id); if(idx!==-1) dos.personalEvents[idx]=evtData; }
        else { dos.personalEvents.push(evtData); logActivity(`Événement personnel ajouté : ${title}`); }
        break;
      }
      default: break;
    }
    state.modal = null;
    saveData();
    render();
    return;
  }
});

// Recherche d'utilisateurs dans la messagerie (input)
document.addEventListener('input', function(e){
  const input = e.target.closest('#recipient-search');
  if(input){
    window.searchUsers(input.value);
  }
});

// ============================ INIT ============================
render();
</script>
