        const showBtn = document.getElementById('showCreateAnnonce');
        const formDiv = document.getElementById('createAnnonceForm');
        const cancelBtn = document.getElementById('cancelCreateAnnonce');
        if (showBtn) {
            showBtn.addEventListener('click', () => { formDiv.style.display = formDiv.style.display==='none' ? 'block' : 'none'; });
        }
        if (cancelBtn) {
            cancelBtn.addEventListener('click', () => { formDiv.style.display = 'none'; });
        }
        const createForm = document.getElementById('annonceCreateForm');
        if (createForm) {
            createForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const titre = document.getElementById('aTitre').value.trim();
                const contenu = document.getElementById('aContenu').value.trim();
                if (!titre || !contenu) {
                    document.getElementById('createAnnonceMsg').textContent = 'Tous les champs sont requis.';
                    document.getElementById('createAnnonceMsg').className = 'error-msg';
                    return;
                }
                if (!Array.isArray(db.announcements)) db.announcements = [];
                if (!db.nextId) db.nextId = { formation:1, ticket:1, announcement:1, faq:1, log:1 };
                if (typeof db.nextId.announcement !== 'number' || isNaN(db.nextId.announcement)) db.nextId.announcement = 1;
                db.announcements.push({
                    id: db.nextId.announcement++,
                    titre, contenu,
                    timestamp: new Date().toISOString()
                });
                saveDB(db);
                document.getElementById('createAnnonceMsg').textContent = 'Annonce publiée !';
                document.getElementById('createAnnonceMsg').className = 'success-msg';
                createForm.reset();
                setTimeout(() => { formDiv.style.display = 'none'; renderApp(); }, 500);
            });
        }
        document.querySelectorAll('[data-action="deleteAnnonce"]').forEach(btn => {
            btn.addEventListener('click', () => {
                const aid = parseInt(btn.dataset.aid);
                if (confirm('Supprimer cette annonce ?')) {
                    if (Array.isArray(db.announcements)) db.announcements = db.announcements.filter(a => a.id !== aid);
                    saveDB(db);
                    renderApp();
                }
            });
        });
    }

    // ---- ADMIN FAQ ----
    function renderAdminFAQ() {
        let html = `<div style="margin-bottom:1rem;"><button class="btn-primary" id="showCreateFaq" style="width:auto;padding:0.5rem 1.6rem;">+ Nouvelle FAQ</button></div>
        <div id="createFaqForm" style="display:none;background:#f8faff;padding:1.5rem;border-radius:16px;border:1px solid #e9eef4;margin-bottom:2rem;">
            <h4>Ajouter une question/réponse</h4>
            <form id="faqCreateForm">
                <div class="form-group"><label>Question</label><input type="text" id="faqQuestion" required /></div>
                <div class="form-group"><label>Réponse</label><textarea id="faqReponse" rows="3" required></textarea></div>
                <button type="submit" class="btn-primary" style="width:auto;padding:0.5rem 2rem;">Ajouter</button>
                <button type="button" class="btn-secondary" id="cancelCreateFaq" style="width:auto;padding:0.5rem 1.6rem;">Annuler</button>
                <div id="createFaqMsg"></div>
            </form>
        </div>
        <div class="table-wrap"><table><thead><tr><th>Question</th><th>Réponse</th><th>Actions</th></tr></thead><tbody>`;
        const faqs = Array.isArray(db.faqs) ? db.faqs : [];
        if (faqs.length === 0) {
            html += `<tr><td colspan="3" style="text-align:center;color:#a0aec0;">Aucune FAQ.</td></tr>`;
        } else {
            faqs.forEach(f => {
                html += `<tr><td><strong>${f.question}</strong></td><td>${f.reponse}</td>
                    <td><button class="btn-danger" data-action="deleteFaq" data-fid="${f.id}" style="padding:0.2rem 0.8rem;font-size:0.8rem;">Supprimer</button></td></tr>`;
            });
        }
        html += `</tbody></table></div>`;
        return html;
    }

    function initAdminFAQ() {
        const showBtn = document.getElementById('showCreateFaq');
        const formDiv = document.getElementById('createFaqForm');
        const cancelBtn = document.getElementById('cancelCreateFaq');
        if (showBtn) {
            showBtn.addEventListener('click', () => { formDiv.style.display = formDiv.style.display==='none' ? 'block' : 'none'; });
        }
        if (cancelBtn) {
            cancelBtn.addEventListener('click', () => { formDiv.style.display = 'none'; });
        }
        const createForm = document.getElementById('faqCreateForm');
        if (createForm) {
            createForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const question = document.getElementById('faqQuestion').value.trim();
                const reponse = document.getElementById('faqReponse').value.trim();
                if (!question || !reponse) {
                    document.getElementById('createFaqMsg').textContent = 'Tous les champs sont requis.';
                    document.getElementById('createFaqMsg').className = 'error-msg';
                    return;
                }
                if (!Array.isArray(db.faqs)) db.faqs = [];
                db.faqs.push({ id: Date.now()+Math.random(), question, reponse });
                saveDB(db);
                document.getElementById('createFaqMsg').textContent = 'FAQ ajoutée !';
                document.getElementById('createFaqMsg').className = 'success-msg';
                createForm.reset();
                setTimeout(() => { formDiv.style.display = 'none'; renderApp(); }, 500);
            });
        }
        document.querySelectorAll('[data-action="deleteFaq"]').forEach(btn => {
            btn.addEventListener('click', () => {
                const fid = parseInt(btn.dataset.fid);
                if (confirm('Supprimer cette FAQ ?')) {
                    if (Array.isArray(db.faqs)) db.faqs = db.faqs.filter(f => f.id !== fid);
                    saveDB(db);
                    renderApp();
                }
            });
        });
    }

    // ---- ADMIN TICKETS ----
    function renderAdminTickets() {
        let html = `<div class="table-wrap"><table><thead><tr><th>#</th><th>Utilisateur</th><th>Sujet</th><th>Message</th><th>Statut</th><th>Réponse</th><th>Actions</th></tr></thead><tbody>`;
        const tickets = Array.isArray(db.tickets) ? db.tickets : [];
        if (tickets.length === 0) {
            html += `<tr><td colspan="7" style="text-align:center;color:#a0aec0;">Aucun ticket.</td></tr>`;
        } else {
            tickets.forEach(t => {
                html += `<tr><td>${t.id}</td><td>${getUserName(db, t.userId)}</td><td><strong>${t.sujet}</strong></td>
                    <td>${t.message}</td><td><span class="ticket-status ${t.status}">${t.status}</span></td>
                    <td>${t.reponse || '—'}</td>
                    <td><div class="actions-cell">
                        ${t.status !== 'fermé' ? `<button class="btn-secondary" data-action="repondreTicket" data-tid="${t.id}" style="padding:0.2rem 0.8rem;font-size:0.8rem;">Répondre</button>` : ''}
                        <button class="btn-secondary" data-action="changerStatutTicket" data-tid="${t.id}" style="padding:0.2rem 0.8rem;font-size:0.8rem;">Statut</button>
                    </div></td></tr>`;
            });
        }
        html += `</tbody></table></div>`;
        return html;
    }

    function initAdminTickets() {
        document.querySelectorAll('[data-action="repondreTicket"]').forEach(btn => {
            btn.addEventListener('click', () => {
                const tid = parseInt(btn.dataset.tid);
                const ticket = findTicket(db, tid);
                if (!ticket) return;
                const reponse = prompt('Votre réponse :');
                if (reponse === null) return;
                if (!reponse.trim()) { alert('Réponse vide.'); return; }
                ticket.reponse = reponse.trim();
                ticket.status = 'résolu';
                saveDB(db);
                addNotification(db, ticket.userId, `Réponse à votre ticket "${ticket.sujet}" : ${reponse.trim()}`);
                addLog(db, currentUser.id, 'ticket_repondu', `Ticket #${tid}`);
                renderApp();
            });
        });
        document.querySelectorAll('[data-action="changerStatutTicket"]').forEach(btn => {
            btn.addEventListener('click', () => {
                const tid = parseInt(btn.dataset.tid);
                const ticket = findTicket(db, tid);
                if (!ticket) return;
                const newStatus = prompt('Nouveau statut (ouvert, en cours, résolu, fermé) :', ticket.status);
                if (!newStatus) return;
                const valid = ['ouvert','en cours','résolu','fermé'];
                if (!valid.includes(newStatus.toLowerCase())) { alert('Statut invalide.'); return; }
                ticket.status = newStatus.toLowerCase();
                saveDB(db);
                renderApp();
            });
        });
    }

    // ---- ADMIN BANDEAU ----
    function renderAdminBandeau() {
        const b = db.banner || { text: '', color: '#f9e9b0', active: false };
        return `<div style="background:#f8faff;padding:1.5rem;border-radius:16px;border:1px solid #e9eef4;">
            <h4 style="margin-bottom:1rem;">Configurer le bandeau d'informations</h4>
            <form id="bannerForm">
                <div class="form-group"><label>Texte du bandeau</label><input type="text" id="bannerTextInput" value="${b.text||''}" placeholder="Message d'information..." /></div>
                <div class="form-group"><label>Couleur de fond</label><input type="color" id="bannerColorInput" value="${b.color||'#f9e9b0'}" style="width:60px;height:40px;padding:2px;border:2px solid #dce3ed;border-radius:8px;" /></div>
                <div class="form-group" style="display:flex;align-items:center;gap:1rem;">
                    <label style="margin-bottom:0;">Activer le bandeau</label>
                    <input type="checkbox" id="bannerActiveInput" ${b.active ? 'checked' : ''} style="width:20px;height:20px;" />
                </div>
                <button type="submit" class="btn-primary" style="width:auto;padding:0.5rem 2rem;">Enregistrer</button>
                <div id="bannerFormMsg" class="success-msg"></div>
            </form>
            <div style="margin-top:1.5rem;padding:1rem;background:${b.active ? (b.color||'#f9e9b0') : '#f0f0f0'};border-radius:12px;border:2px dashed ${b.active ? (b.color||'#f9e9b0') : '#dce3ed'};">
                <strong>Aperçu :</strong> ${b.active ? (b.text||'—') : '⛔ Bandeau désactivé'}
            </div>
        </div>`;
    }

    function initAdminBandeau() {
        const form = document.getElementById('bannerForm');
        if (!form) return;
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = document.getElementById('bannerTextInput').value.trim();
            const color = document.getElementById('bannerColorInput').value;
            const active = document.getElementById('bannerActiveInput').checked;
            db.banner = { text: text || 'Message d\'information', color, active };
            saveDB(db);
            document.getElementById('bannerFormMsg').textContent = 'Bandeau mis à jour !';
            setTimeout(() => { document.getElementById('bannerFormMsg').textContent = ''; }, 3000);
            renderBanner();
            renderApp();
        });
    }

    // ---- ADMIN PARAMÈTRES ----
    function renderAdminParametres() {
        const s = db.settings || {};
        return `<div style="background:#f8faff;padding:1.5rem;border-radius:16px;border:1px solid #e9eef4;">
            <h4 style="margin-bottom:1rem;">Paramètres généraux</h4>
            <form id="settingsForm">
                <div class="form-group"><label>Thème par défaut</label><select id="settingTheme">
                    <option value="light" ${s.theme==='light'?'selected':''}>Clair</option>
                    <option value="dark" ${s.theme==='dark'?'selected':''}>Sombre</option>
                </select></div>
                <div class="form-group"><label>Langue</label><select id="settingLang">
                    <option value="fr" ${s.language==='fr'?'selected':''}>Français</option>
                    <option value="en" ${s.language==='en'?'selected':''}>Anglais</option>
                </select></div>
                <div class="form-group"><label>Tentatives de connexion max avant verrouillage</label><input type="number" id="settingMaxAttempts" value="${s.maxLoginAttempts||3}" min="1" max="10" /></div>
                <div class="form-group"><label>Durée du verrouillage (minutes)</label><input type="number" id="settingLockDuration" value="${s.lockDuration||5}" min="1" max="60" /></div>
                <button type="submit" class="btn-primary" style="width:auto;padding:0.5rem 2rem;">Enregistrer</button>
                <div id="settingsMsg" class="success-msg"></div>
            </form>
            <hr style="margin:2rem 0;border-color:#e9eef4;" />
            <h4>Journaux de connexion</h4>
            <button class="btn-secondary" id="viewLogsBtn">📋 Voir les logs</button>
            <button class="btn-secondary" id="clearLogsBtn" style="margin-left:0.5rem;">🗑️ Effacer les logs</button>
            <div id="logsContainer" style="margin-top:1rem;max-height:300px;overflow-y:auto;background:#fff;border:1px solid #e9eef4;border-radius:8px;padding:0.5rem;display:none;">
                ${(Array.isArray(db.logs) ? db.logs : []).slice().reverse().map(l => `<div style="font-size:0.8rem;padding:0.2rem 0;border-bottom:1px solid #f0f4fe;"><strong>${l.userId}</strong> ${l.action} — ${l.details} (${new Date(l.timestamp).toLocaleString()}) IP: ${l.ip}</div>`).join('')}
            </div>
            <div style="margin-top:2rem;">
                <h4>Import / Export complet (JSON)</h4>
                <button class="btn-secondary" id="exportFullBtn">📤 Exporter toutes les données</button>
                <button class="btn-secondary" id="importFullBtn" style="margin-left:0.5rem;">📥 Importer JSON</button>
                <input type="file" id="jsonImportInput" accept=".json" style="display:none;" />
            </div>
            <hr style="margin:2rem 0;border-color:#e9eef4;" />
            <div style="border:2px solid #c72a3a;padding:1rem;border-radius:10px;background:#fff5f5;">
                <h4 style="color:#c72a3a;">⚠️ Zone de réinitialisation</h4>
                <p style="font-size:0.9rem;">Supprime toutes les données et recrée une base vierge (seul le compte admin sera conservé). Cette action est irréversible.</p>
                <button class="btn-danger" id="resetDBBtn" style="margin-top:0.5rem;">🔄 Réinitialiser la base</button>
                <div id="resetMsg" class="error-msg"></div>
            </div>
        </div>`;
    }

    function initAdminParametres() {
        const form = document.getElementById('settingsForm');
        if (form) {
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const theme = document.getElementById('settingTheme').value;
                const language = document.getElementById('settingLang').value;
                const maxAttempts = parseInt(document.getElementById('settingMaxAttempts').value) || 3;
                const lockDuration = parseInt(document.getElementById('settingLockDuration').value) || 5;
                db.settings.theme = theme;
                db.settings.language = language;
                db.settings.maxLoginAttempts = maxAttempts;
                db.settings.lockDuration = lockDuration;
                saveDB(db);
                document.getElementById('settingsMsg').textContent = 'Paramètres enregistrés !';
                applyTheme();
                setTimeout(() => { document.getElementById('settingsMsg').textContent = ''; }, 3000);
            });
        }
        document.getElementById('viewLogsBtn')?.addEventListener('click', () => {
            const container = document.getElementById('logsContainer');
            container.style.display = container.style.display === 'none' ? 'block' : 'none';
        });
        document.getElementById('clearLogsBtn')?.addEventListener('click', () => {
            if (confirm('Effacer tous les logs ?')) {
                db.logs = [];
                saveDB(db);
                renderApp();
                alert('Logs effacés.');
            }
        });
        document.getElementById('exportFullBtn')?.addEventListener('click', () => {
            const data = JSON.stringify(db, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'arena_backup.json';
            link.click();
            URL.revokeObjectURL(link.href);
        });
        document.getElementById('importFullBtn')?.addEventListener('click', () => {
            document.getElementById('jsonImportInput').click();
        });
        document.getElementById('jsonImportInput')?.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const imported = JSON.parse(ev.target.result);
                    if (confirm('Remplacer toutes les données actuelles ?')) {
                        const admin = imported.users.find(u => u.id === 'admin');
                        if (!admin) { alert('Le fichier importé ne contient pas de compte admin.'); return; }
                        db = imported;
                        db = sanitizeDB(db);
                        saveDB(db);
                        refreshCurrentUser();
                        renderApp();
                        alert('Données importées avec succès !');
                    }
                } catch(err) { alert('Fichier JSON invalide.'); }
            };
            reader.readAsText(file);
        });

        document.getElementById('resetDBBtn')?.addEventListener('click', () => {
            if (confirm('⚠️ Êtes-vous sûr de vouloir réinitialiser toute la base de données ? Cette action est irréversible.')) {
                db = createDefaultDB();
                db = sanitizeDB(db);
                saveDB(db);
                refreshCurrentUser();
                renderApp();
                document.getElementById('resetMsg').textContent = '✅ Base réinitialisée avec succès !';
                document.getElementById('resetMsg').className = 'success-msg';
                setTimeout(() => { document.getElementById('resetMsg').textContent = ''; }, 3000);
            }
        });
    }

    // ============================================================
    //  STARTUP & LOGIN
    // ============================================================
    function checkAdminAndStart() {
        if (!dbLoaded) return;
        const admin = db.users.find(u => u.id === 'admin');
        if (admin && admin.firstLogin) {
            admin.password = 'admin';
            saveDB(db);
        }
        if (!admin) {
            db.users.push({
                id: 'admin',
                nom: 'Admin',
                prenom: 'Système',
                password: 'admin',
                role: 'admin',
                firstLogin: true,
                preferences: { theme: 'light' },
                loginAttempts: 0,
                lockedUntil: null
            });
            saveDB(db);
        }
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('firstLoginScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'none';
        console.log('🏫 ARENA Portail chargé avec Firebase.');
        console.log('👤 Admin par défaut : admin / admin (première connexion)');
    }

    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        if (!dbLoaded || !db) {
            document.getElementById('loginError').textContent = 'Chargement des données en cours, veuillez patienter...';
            return;
        }
        const id = document.getElementById('loginId').value.trim();
        const pwd = document.getElementById('loginPassword').value;
        const errEl = document.getElementById('loginError');
        errEl.textContent = '';
        if (!id || !pwd) { errEl.textContent = 'Veuillez remplir tous les champs.'; return; }
        document.getElementById('loginSpinner').style.display = 'inline-block';
        document.getElementById('loginBtn').disabled = true;
        setTimeout(() => {
            const result = login(id, pwd);
            document.getElementById('loginSpinner').style.display = 'none';
            document.getElementById('loginBtn').disabled = false;
            if (!result.ok) {
                errEl.textContent = result.msg;
                return;
            }
            if (currentUser.firstLogin) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('firstLoginScreen').style.display = 'flex';
                document.getElementById('firstLoginError').textContent = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmPassword').value = '';
            } else {
                enterApp();
            }
        }, 300);
    });

    document.getElementById('firstLoginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const p1 = document.getElementById('newPassword').value;
        const p2 = document.getElementById('confirmPassword').value;
        const errEl = document.getElementById('firstLoginError');
        errEl.textContent = '';
        if (p1.length < 4) { errEl.textContent = 'Minimum 4 caractères.'; return; }
        if (p1 !== p2) { errEl.textContent = 'Les mots de passe ne correspondent pas.'; return; }
        if (changePassword(currentUser.id, p1, false)) {
            currentUser = findUser(db, currentUser.id);
            document.getElementById('firstLoginScreen').style.display = 'none';
            enterApp();
        } else {
            errEl.textContent = 'Erreur lors de l\'enregistrement.';
        }
    });

    function enterApp() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('firstLoginScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'flex';
        renderApp();
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
        logout();
    });

    document.getElementById('bannerClose').addEventListener('click', () => {
        if (db.banner) {
            db.banner.active = false;
            saveDB(db);
            renderBanner();
        }
    });
</script>
</body>
</html>
