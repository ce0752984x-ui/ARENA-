<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Portail ARENA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== STYLES COMPLETS (inchangés, identiques à la version précédente) ===== */
  :root{
    --bg:#f3f1ea;
    --surface:#ffffff;
    --ink:#182338;
    --ink-soft:#54607a;
    --ink-faint:#8993a8;
    --line:#e5e1d3;
    --red:#7c1d2e;
    --red-soft:#a4283d;
    --purple:#6a2856;
    --purple-deep:#54204a;
    --brass:#8a6a34;
    --brass-deep:#6b5127;
    --brass-soft:#cdb27a;
    --lavender:#8a6a34;
    --lavender-soft:#cdb27a;
    --dark-card:#182338;
    --dark-card-text:#a3aec4;
    --info-bg:#e8f0fd;
    --info-border:#3f7ce0;
    --info-icon:#14151a;
    --ok:#2f6f4e;
    --danger:#a13d3d;
    --radius:10px;
    --shadow:0 1px 2px rgba(20,25,40,.06),0 8px 24px -12px rgba(20,25,40,.12);
    --font: 'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-display: 'Source Serif 4', Georgia, 'Times New Roman', serif;
    --header-height:60px;
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --main-color: var(--brass);
    --main-bg: var(--bg);
  }
  [data-theme="dark"]{
    --bg:#11151f;
    --surface:#1a2030;
    --ink:#eceef2;
    --ink-soft:#aab2c5;
    --ink-faint:#7c8496;
    --line:#2c3345;
    --dark-card:#0d1119;
    --info-bg:#1c2940;
    --info-icon:#0d1119;
  }
  [data-theme="dark"] .login-wrap{ background: radial-gradient(circle at 15% 20%, #241a33 0%, transparent 45%), linear-gradient(160deg,#11151f 0%,#0a0d15 60%,#060810 100%); }
  [data-theme="dark"] .banner-text{ color:#dbe4ff; }
  h1,h2,h3,.brand-text .name,.module-header h2,.login-top h1{ font-family:var(--font-display); }
  .stat-value{ font-variant-numeric:tabular-nums; }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--font);
    background:var(--main-bg);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  #app{min-height:100vh;display:flex;flex-direction:column;}
  .letterhead-ribbon{height:4px;background:linear-gradient(90deg,var(--main-color),var(--main-color) 45%,var(--main-color) 75%,var(--main-color));flex-shrink:0;}
  a{color:inherit;}
  button{font-family:inherit;touch-action:manipulation;}
  ul{margin:0;padding:0;}
  h1,h2,h3,p{margin:0;}
  .muted{color:var(--ink-faint);}
  :focus-visible{outline:3px solid #4f83e0;outline-offset:2px;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:9px 16px;border-radius:8px;border:1px solid transparent;
    font-size:14px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,color .15s;
    background:var(--surface);color:var(--ink);border-color:var(--line);
    min-height:40px;touch-action:manipulation;user-select:none;
  }
  .btn:active{transform:scale(0.97);}
  .btn:hover{background:#f7f8fa;}
  .btn-primary{background:var(--ink);color:#fff;border-color:var(--ink);}
  .btn-primary:hover{background:#101c33;}
  .btn-purple{background:var(--purple);color:#fff;border-color:var(--purple);}
  .btn-purple:hover{background:var(--purple-deep);}
  .btn-danger{background:#fff;color:var(--danger);border-color:#f0c9c9;}
  .btn-danger:hover{background:#fdf1f1;}
  .btn-ghost{background:transparent;border-color:transparent;}
  .btn-ghost:hover{background:#eef0f4;}
  .btn-sm{padding:5px 10px;font-size:12px;min-height:32px;}
  .btn-icon{padding:8px;border-radius:8px;min-height:40px;min-width:40px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
  .icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
  .icon-lg{width:24px;height:24px;}

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:
      radial-gradient(circle at 15% 20%, #2a1f3d 0%, transparent 45%),
      linear-gradient(160deg,#1b2a4a 0%,#101a30 60%,#0c1424 100%);
    padding:16px;}
  .login-card{width:100%;max-width:400px;background:var(--surface);border-radius:16px;box-shadow:0 20px 60px -20px rgba(0,0,0,.5);overflow:hidden;}
  .login-top{padding:24px 20px 16px;text-align:center;border-bottom:1px solid var(--line);}
  .login-badge{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 32% 28%, var(--main-color), var(--main-color) 55%, var(--main-color) 100%);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);}
  .login-badge svg{width:24px;height:24px;stroke:#2a1f0d;}
  .login-top h1{font-size:18px;letter-spacing:.2px;}
  .login-top p{margin-top:4px;font-size:13px;color:var(--ink-faint);}
  .login-body{padding:20px 20px 24px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
  .field input,.field select,.field textarea{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-family:inherit;color:var(--ink);background:#fff;
    -webkit-appearance:none;appearance:none;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:#4f83e0;outline:none;}
  .field textarea{resize:vertical;min-height:100px;line-height:1.5;}
  .field-hint{font-size:12px;color:var(--ink-faint);margin-top:4px;}
  .login-body .btn{width:100%;justify-content:center;padding:12px;font-size:15px;}
  .login-error{background:#fdf1f1;border:1px solid #f0c9c9;color:var(--danger);font-size:13px;padding:9px 12px;border-radius:8px;margin-bottom:14px;}

  .maintenance-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--main-bg);padding:16px;}
  .maintenance-card{max-width:500px;width:100%;background:var(--surface);border-radius:16px;padding:30px 24px;box-shadow:0 20px 60px -20px rgba(0,0,0,.3);text-align:center;}
  .maintenance-card h1{font-size:22px;margin-bottom:8px;}
  .maintenance-card p{font-size:14px;color:var(--ink-soft);line-height:1.6;margin-bottom:16px;}
  .maintenance-card .field{margin-bottom:12px;}

  .topbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
  .topbar-inner{max-width:1180px;margin:0 auto;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:var(--header-height);}
  .brand{display:flex;align-items:center;gap:8px;cursor:pointer;background:none;border:none;padding:0;flex-shrink:0;}
  .brand-badge{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 32% 28%, var(--main-color), var(--main-color) 55%, var(--main-color) 100%);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);flex-shrink:0;overflow:hidden;}
  .brand-badge img{width:100%;height:100%;object-fit:contain;display:block;}
  .brand-badge svg{width:16px;height:16px;stroke:#2a1f0d;}
  .brand-text .name{font-size:14px;font-weight:700;color:var(--ink);line-height:1.2;}
  .brand-text .tag{font-size:10px;color:var(--ink-faint);display:none;}
  .topbar-right{display:flex;align-items:center;gap:4px;flex-shrink:0;}
  .topbar-right .btn-icon{min-height:38px;min-width:38px;padding:6px;}
  .user-chip{display:flex;align-items:center;gap:6px;padding:4px 8px 4px 4px;border-radius:30px;background:#f2f4f7;border:none;cursor:pointer;flex-shrink:0;}
  .user-avatar{width:28px;height:28px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
  .user-meta{line-height:1.1;display:none;}
  .user-meta .u-name{font-size:12px;font-weight:700;}
  .user-meta .u-role{font-size:9px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.3px;}

  main{flex:1;padding-bottom:env(safe-area-inset-bottom,0px);}
  .page{max-width:1180px;margin:0 auto;padding:16px 12px 80px;}
  .crumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-faint);margin-bottom:12px;flex-wrap:wrap;}
  .crumb button{background:none;border:none;color:var(--ink-soft);font-size:12px;cursor:pointer;padding:4px 0;font-weight:600;}
  .crumb button:hover{color:var(--ink);text-decoration:underline;}
  .page-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
  .eyebrow{font-size:12px;color:var(--ink-faint);font-weight:600;}

  .banner{display:flex;border:1px solid var(--info-border);border-radius:8px;overflow:hidden;margin-bottom:16px;background:var(--info-bg);}
  .banner-icon{width:36px;background:var(--info-icon);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .banner-icon svg{width:16px;height:16px;stroke:#fff;}
  .banner-text{padding:12px 14px;font-size:13px;color:#1c2e52;display:flex;align-items:center;line-height:1.4;}

  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
  .stat-card{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--main-color);border-radius:6px;padding:16px 12px;text-align:center;position:relative;}
  .stat-value{font-size:28px;font-weight:800;color:var(--ink);}
  .stat-label{margin-top:4px;font-size:11px;letter-spacing:.3px;text-transform:uppercase;color:var(--ink-soft);font-weight:700;}

  .modules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;}
  .module-card{background:var(--dark-card);border-radius:8px;padding:16px 16px 14px;border-bottom:3px solid var(--main-color);cursor:pointer;text-align:left;display:flex;flex-direction:column;min-height:160px;transition:transform .15s, box-shadow .15s;position:relative;touch-action:manipulation;}
  .module-card:active{transform:scale(0.97);}
  .module-badge{position:absolute;top:10px;right:10px;background:var(--red);color:#fff;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px;}
  .module-badge--ok{background:var(--ok);}
  .notif-wrap{position:relative;}
  .notif-dropdown{position:absolute;top:calc(100% + 6px);right:0;width:300px;max-width:85vw;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:60;overflow:hidden;}
  .notif-head{padding:10px 14px;font-weight:700;font-size:13px;border-bottom:1px solid var(--line);}
  .notif-item{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:10px 14px;font-size:13px;color:var(--ink);cursor:pointer;line-height:1.4;}
  .notif-item:last-child{border-bottom:none;}
  .notif-item:hover{background:var(--bg);}
  .notif-empty{padding:14px;font-size:13px;color:var(--ink-faint);}
  .module-card:hover{transform:translateY(-2px);box-shadow:0 14px 30px -16px rgba(0,0,0,.5);}
  .module-icon{width:30px;height:30px;border-radius:8px;background:rgba(141,126,243,.15);display:flex;align-items:center;justify-content:center;margin-bottom:10px;flex-shrink:0;}
  .module-icon svg{width:16px;height:16px;stroke:var(--main-color);}
  .module-card h3{font-size:15px;color:var(--main-color);font-weight:700;line-height:1.3;}
  .module-card p{margin-top:6px;font-size:12px;color:var(--dark-card-text);line-height:1.4;flex:1;}
  .module-arrow{align-self:flex-end;margin-top:8px;color:var(--main-color);}
  .module-arrow svg{width:16px;height:16px;}
  .modules-empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:8px;padding:28px;text-align:center;color:var(--ink-faint);font-size:13px;}

  .module-header{background:var(--ink);border-radius:8px 8px 0 0;padding:12px 16px;display:flex;align-items:center;gap:8px;color:#fff;border-left:4px solid var(--main-color);}
  .module-header svg{width:18px;height:18px;stroke:var(--main-color);}
  .module-header h2{font-size:15px;font-weight:600;letter-spacing:.2px;}
  .tabs-bar{display:flex;flex-wrap:nowrap;overflow-x:auto;background:#f7f7f9;border:1px solid var(--line);border-top:none;padding:0 4px;gap:2px;scrollbar-width:thin;-webkit-overflow-scrolling:touch;}
  .tabs-bar::-webkit-scrollbar{height:3px;}
  .tabs-bar::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
  .tab-btn{padding:10px 14px;font-size:12px;font-weight:700;color:var(--ink-soft);background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;letter-spacing:.1px;white-space:nowrap;flex-shrink:0;}
  .tab-btn:active{opacity:.6;}
  .tab-btn.active{color:var(--main-color);border-bottom-color:var(--main-color);}
  .tab-panel{background:var(--surface);border:1px solid var(--line);border-top:none;border-radius:0 0 8px 8px;padding:16px 14px;min-height:180px;}
  .tab-panel h3{font-size:15px;margin:14px 0 6px;color:var(--ink);}
  .tab-panel h3:first-child{margin-top:0;}
  .tab-panel p{font-size:13px;line-height:1.6;color:#33415c;margin-bottom:8px;}
  .tab-panel ul{margin:0 0 10px 16px;padding:0;}
  .tab-panel li{font-size:13px;line-height:1.6;color:#33415c;}
  .callout{background:var(--info-bg);border-left:3px solid var(--main-color);padding:8px 12px;border-radius:6px;font-size:13px;color:#1c2e52;margin:8px 0;line-height:1.5;}
  .dossier-print-bar{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .search-row{margin-bottom:12px;}
  .search-row input{max-width:100%;}
  .editbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .tab-manage-row{display:flex;align-items:center;gap:4px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;margin-bottom:4px;background:#fbfbfc;flex-wrap:wrap;}
  .tab-manage-row span{flex:1;font-size:12px;font-weight:600;min-width:60px;}
  .badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.2px;padding:2px 8px;border-radius:20px;}
  .badge-admin{background:#f4e8f0;color:var(--purple);}
  .badge-user{background:#e8ecf4;color:var(--ink-soft);}
  .badge-ok{background:#e4f4ea;color:var(--ok);}
  .badge-pending{background:#fdf3e2;color:#a2680a;}
  .badge-danger{background:#fbe9e9;color:var(--danger);}
  .badge-unread{background:#e8ecf4;color:var(--purple);}

  .feed{display:flex;flex-direction:column;gap:12px;}
  .post{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:#fff;}
  .post-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;}
  .post-title{font-size:14px;font-weight:700;color:var(--ink);}
  .post-date{font-size:11px;color:var(--ink-faint);white-space:nowrap;margin-top:2px;}
  .post-body p{font-size:13px;color:#33415c;line-height:1.6;margin-bottom:6px;}
  .post-actions{display:flex;gap:4px;margin-top:8px;}

  .msg-folder-list{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .msg-folder-btn{padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:12px;}
  .msg-folder-btn.active{background:var(--main-color);color:#fff;border-color:var(--main-color);}
  .msg-item{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px;align-items:center;}
  .msg-item.unread{background:#f0f4fc;}
  .msg-item:hover{background:var(--bg);}
  .msg-avatar{width:32px;height:32px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
  .msg-info{flex:1;min-width:0;}
  .msg-sender{font-weight:700;font-size:13px;}
  .msg-subject{font-size:13px;color:var(--ink);}
  .msg-preview{font-size:12px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .msg-date{font-size:11px;color:var(--ink-faint);white-space:nowrap;}
  .msg-detail{padding:14px 16px;background:var(--bg);border-radius:8px;margin:8px 0;}
  .msg-detail .msg-header{display:flex;flex-wrap:wrap;gap:4px 12px;margin-bottom:8px;font-size:13px;}
  .msg-detail .msg-header strong{margin-right:4px;}
  .msg-detail .msg-body{font-size:14px;line-height:1.6;word-wrap:break-word;}
  .msg-detail .msg-body p{margin:0 0 6px;}
  .msg-detail .msg-body ul, .msg-detail .msg-body ol{margin:6px 0 6px 20px;}
  .msg-detail .msg-body blockquote{border-left:3px solid var(--main-color);margin:6px 0;padding-left:12px;color:var(--ink-soft);}
  .msg-detail .msg-body a{color:var(--info-border);text-decoration:underline;}

  .rich-editor-toolbar{
    display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px;background:var(--bg);border:1px solid var(--line);border-radius:8px 8px 0 0;border-bottom:none;
    align-items:center;
  }
  .rich-editor-toolbar button{
    background:transparent;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink);transition:background .1s;
  }
  .rich-editor-toolbar button:hover{background:var(--line);}
  .rich-editor-toolbar button.active{background:var(--main-color);color:#fff;}
  .rich-editor-toolbar select{
    background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:2px 4px;font-size:12px;color:var(--ink);
    min-height:28px;
  }
  .rich-editor-content{
    min-height:150px;padding:10px 12px;border:1px solid var(--line);border-radius:0 0 8px 8px;background:#fff;font-size:14px;line-height:1.6;outline:none;overflow-y:auto;
  }
  .rich-editor-content:focus{border-color:#4f83e0;}
  .rich-editor-content p{margin:0 0 6px;}
  .rich-editor-content ul, .rich-editor-content ol{margin:6px 0 6px 20px;}
  .rich-editor-content blockquote{border-left:3px solid var(--main-color);margin:6px 0;padding-left:12px;color:var(--ink-soft);}
  .rich-editor-content a{color:var(--info-border);text-decoration:underline;}

  .settings-shell{display:grid;grid-template-columns:1fr;gap:16px;align-items:start;}
  .settings-nav{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px;position:sticky;top:var(--header-height);z-index:10;scrollbar-width:thin;-webkit-overflow-scrolling:touch;}
  .settings-nav::-webkit-scrollbar{height:3px;}
  .settings-nav::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
  .settings-nav button{display:flex;align-items:center;gap:4px;text-align:left;padding:6px 10px;border-radius:6px;border:none;background:none;font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer;white-space:nowrap;flex-shrink:0;}
  .settings-nav button.active{background:var(--ink);color:#fff;}
  .settings-nav button:hover:not(.active){background:#f0f1f4;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 14px;border-top:3px solid var(--main-color);}
  .card + .card{margin-top:12px;}
  .card h3{font-size:14px;margin-bottom:3px;}
  .card .card-sub{font-size:12px;color:var(--ink-faint);margin-bottom:12px;}
  .row-list{display:flex;flex-direction:column;gap:6px;}
  .row-item{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;flex-wrap:wrap;}
  .row-item .ri-main{flex:1;min-width:80px;}
  .row-item .ri-title{font-size:13px;font-weight:700;color:var(--ink);}
  .row-item .ri-sub{font-size:11px;color:var(--ink-faint);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row-actions{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;}
  .form-grid{display:grid;grid-template-columns:1fr;gap:12px;}
  .form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;flex-wrap:wrap;}
  .icon-pick-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:4px;}
  .icon-pick{border:1.5px solid var(--line);border-radius:6px;padding:8px 0;display:flex;align-items:center;justify-content:center;background:#fff;cursor:pointer;touch-action:manipulation;}
  .icon-pick.selected{border-color:var(--main-color);background:#f4e8f0;}
  .icon-pick svg{width:16px;height:16px;stroke:var(--ink);}
  .switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0;}
  .switch{position:relative;width:38px;height:20px;border-radius:20px;background:var(--line);border:none;cursor:pointer;flex-shrink:0;touch-action:manipulation;}
  .switch.on{background:var(--ok);}
  .switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;}
  .switch.on::after{left:18px;}
  .data-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .empty-note{color:var(--ink-faint);font-size:12px;padding:6px 0;}

  .overlay{position:fixed;inset:0;background:rgba(15,20,35,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;animation:fadeIn .2s;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modal{background:#fff;border-radius:12px;width:100%;max-width:460px;max-height:90vh;overflow:auto;box-shadow:0 30px 70px -20px rgba(0,0,0,.4);animation:slideUp .25s;}
  @keyframes slideUp{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:1;}
  .modal-head h3{font-size:15px;}
  .modal-body{padding:16px;}
  .modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap;}
  .confirm-text{font-size:13px;color:var(--ink-soft);line-height:1.5;}

  footer.pagefoot{text-align:center;font-size:10px;color:var(--ink-faint);padding:16px 16px calc(16px + var(--safe-bottom));border-top:1px solid var(--line);}

  .dashboard-widgets{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px;}
  .widget{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;border-top:3px solid var(--main-color);}
  .widget h4{font-size:13px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px;}
  .widget .widget-body{font-size:12px;color:var(--ink-soft);line-height:1.5;}

  .doc-item{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .doc-item:last-child{border-bottom:none;}
  .doc-preview{width:50px;height:50px;object-fit:cover;border-radius:4px;background:#f0f0f0;flex-shrink:0;}
  .doc-info{flex:1;min-width:100px;}
  .doc-name{font-weight:600;font-size:13px;word-break:break-word;}
  .doc-size{font-size:11px;color:var(--ink-faint);margin-right:4px;}
  .doc-date{font-size:11px;color:var(--ink-faint);}
  .doc-actions{display:flex;gap:4px;}

  .budget-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:10px 0;}
  .budget-item{padding:10px;background:var(--bg);border-radius:6px;text-align:center;}
  .budget-item .amount{font-size:20px;font-weight:800;color:var(--ink);}
  .budget-item .label{font-size:10px;color:var(--ink-faint);text-transform:uppercase;}
  .transaction-item{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line);}
  .transaction-item:last-child{border-bottom:none;}
  .transaction-name{flex:1;font-size:12px;font-weight:500;}
  .transaction-amount{font-size:12px;font-weight:700;color:var(--red);}
  .transaction-date{font-size:10px;color:var(--ink-faint);}

  .calc-result{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0 4px;}
  .calc-result .stat-card{border-top-width:3px;padding:12px 8px;}
  .calc-result .stat-value{font-size:22px;}

  .ressource-blocked{
    background:#fbe9e9;
    border-left:4px solid var(--danger);
    padding:10px 14px;
    border-radius:6px;
    margin:8px 0;
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--danger);
    font-weight:600;
  }
  .ressource-blocked svg{stroke:var(--danger);flex-shrink:0;}
  .week-nav{
    display:flex;
    align-items:center;
    gap:12px;
    margin:12px 0;
    flex-wrap:wrap;
  }
  .week-nav button{padding:4px 12px;}
  .edt-table{
    width:100%;
    border-collapse:collapse;
    font-size:12px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
  }
  .edt-table th{
    background:var(--ink);
    color:#fff;
    padding:6px 4px;
    text-align:center;
    font-weight:600;
  }
  .edt-table td{
    border:1px solid var(--line);
    padding:4px;
    text-align:center;
    vertical-align:middle;
    min-width:60px;
    height:36px;
  }
  .edt-table .slot-free{
    background:#e8f5e9;
    cursor:pointer;
    transition:background .1s;
  }
  .edt-table .slot-free:hover{background:#c8e6c9;}
  .edt-table .slot-booked{
    background:#fce4ec;
    color:var(--danger);
  }
  .edt-table .slot-own{
    background:#e3f2fd;
    color:var(--ink);
  }
  .edt-table .slot-blocked{
    background:#eceff1;
    color:var(--ink-faint);
    cursor:not-allowed;
  }
  .edt-table .slot-pending{
    background:#fff3e0;
    color:#e65100;
  }
  .slot-btn{
    border:none;
    background:transparent;
    width:100%;
    height:100%;
    cursor:pointer;
    font-size:11px;
    font-weight:600;
    color:var(--ink);
  }
  .slot-btn:hover{text-decoration:underline;}
  .reservation-status{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .reservation-status .badge{font-size:10px;}

  .agenda-grid {
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
    margin-top:12px;
  }
  .agenda-day {
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:6px;
    padding:6px;
    min-height:80px;
    cursor:pointer;
    transition:background .15s;
  }
  .agenda-day:hover{background:var(--bg);}
  .agenda-day .day-number {
    font-weight:700;
    font-size:14px;
    text-align:right;
    color:var(--ink-soft);
  }
  .agenda-day .day-events {
    font-size:10px;
    margin-top:4px;
  }
  .agenda-day .day-events .evt {
    padding:2px 4px;
    border-radius:4px;
    margin-bottom:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    background:var(--info-bg);
    color:var(--ink);
  }

  .agenda-day .day-events .evt.absence{background:#fff3e0;color:#e65100;}
  .agenda-day.today{border-color:var(--main-color);border-width:2px;}
  .agenda-day.other-month .day-number{color:var(--ink-faint);opacity:0.5;}

  .toast-container {
    position:fixed;
    bottom:20px;
    right:20px;
    z-index:200;
    display:flex;
    flex-direction:column;
    gap:8px;
    max-width:350px;
    width:100%;
  }
  .toast {
    background:var(--surface);
    border-left:4px solid var(--main-color);
    border-radius:8px;
    box-shadow:var(--shadow);
    padding:12px 16px;
    animation:slideIn .3s;
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13px;
    color:var(--ink);
    border:1px solid var(--line);

  .toast.error{border-left-color:var(--danger);}
  .toast.warning{border-left-color:#e65100;}
  .toast .close-toast{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:16px;margin-left:auto;padding:0 4px;}
  @keyframes slideIn{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}

  .todo-item {
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 8px;
    border-bottom:1px solid var(--line);
  }
  .todo-item .todo-text {
    flex:1;
    font-size:13px;
  }
  .todo-item .todo-text.done {
    text-decoration:line-through;
    color:var(--ink-faint);
  }
  .todo-item .todo-actions {
    display:flex;
    gap:4px;
  }

  .event-item {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:4px 8px;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .event-item .event-info {
    display:flex;
    gap:8px;
    align-items:center;
  }
  .event-item .event-info .evt-date {
    font-weight:600;
    color:var(--ink-soft);
  }

  .user-search-container { position:relative; }
  .user-search-results {
    position:absolute; top:100%; left:0; right:0;
    background:#fff; border:1px solid var(--line); border-top:none;
    border-radius:0 0 8px 8px; max-height:150px; overflow-y:auto; z-index:10;
    box-shadow:var(--shadow);
  }
  .user-search-results .search-item{padding:6px 10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .user-search-results .search-item:hover{background:var(--bg);}
  .user-search-results .search-item .add-btn{background:var(--ok);color:#fff;border:none;border-radius:4px;padding:2px 8px;font-size:11px;cursor:pointer;}
  .user-chip-mini{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:2px 8px 2px 6px;font-size:12px;margin:2px 4px 2px 0;}
  .user-chip-mini .remove-btn{background:none;border:none;color:var(--danger);cursor:pointer;font-size:14px;line-height:1;padding:0 2px;}

  @media (min-width:480px){
    .topbar-inner{padding:10px 16px;}
    .brand-text .tag{display:block;}
    .user-meta{display:block;}
    .settings-shell{grid-template-columns:1fr;}
    .page{padding:20px 20px 80px;}
  }
  @media (min-width:768px){
    .settings-shell{grid-template-columns:200px 1fr;}
    .settings-nav{flex-direction:column;position:sticky;top:78px;overflow-x:visible;padding:6px;}
    .settings-nav button{font-size:13px;padding:8px 10px;}
    .form-grid{grid-template-columns:1fr 1fr;}
    .page{padding:28px 32px 80px;}
    .dashboard-widgets{grid-template-columns:repeat(3,1fr);}
    .modules-grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));}
    .stats-grid{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));}
    .edt-table{font-size:13px;}
    .edt-table td{min-width:80px;height:42px;}
    .agenda-day{min-height:100px;}
  }
  @media (min-width:1024px){
    .modules-grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));}
  }

  @media print{
    .no-print, .topbar, .pagefoot, .editbar, .crumb, .row-actions, .form-actions, .search-row { display:none !important; }
    .page{ box-shadow:none !important; padding:20px !important; }
    body{ background:#fff !important; }
    .card{border:1px solid #ddd !important;break-inside:avoid;}
    .module-card{break-inside:avoid;background:#f5f5f5 !important;border:1px solid #ccc !important;}
  }
</style>

function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uid(prefix){ return (prefix||'id') + '_' + Math.random().toString(36).slice(2,9); }
function todayStr(){
  const d = new Date();
  return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'long', year:'numeric' });
}
function todayIso(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function nowStr(){
  const d = new Date();
  return d.toLocaleString('fr-FR', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function initials(name){
  return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
}
function parseContent(raw){
  if(!raw || !raw.trim()) return '<p class="muted">Aucun contenu pour le moment.</p>';
  const lines = raw.replace(/\r/g,'').split('\n');
  let html = '', buf = [], i = 0;
  const flush = () => { if(buf.length){ html += `<p>${buf.join('<br>')}</p>`; buf = []; } };
  while(i < lines.length){
    const t = lines[i].trim();
    if(t === ''){ flush(); i++; continue; }
    if(t.startsWith('## ')){ flush(); html += `<h3>${escapeHtml(t.slice(3))}</h3>`; i++; continue; }
    if(t.startsWith('> ')){
      flush(); let arr=[];
      while(i<lines.length && lines[i].trim().startsWith('> ')){ arr.push(escapeHtml(lines[i].trim().slice(2))); i++; }
      html += `<div class="callout">${arr.join('<br>')}</div>`; continue;
    }
    if(t.startsWith('- ')){
      flush(); let items=[];
      while(i<lines.length && lines[i].trim().startsWith('- ')){ items.push(`<li>${escapeHtml(lines[i].trim().slice(2))}</li>`); i++; }
      html += `<ul>${items.join('')}</ul>`; continue;
    }
    if(t.startsWith('|')){
      flush(); let rows=[];
      while(i<lines.length && lines[i].trim().startsWith('|')){ rows.push(lines[i].trim()); i++; }
      if(rows[1] && /^\|[\s:-]+\|/.test(rows[1])) rows.splice(1,1);
      const cells = rows.map(r => r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));
      const [head, ...body] = cells;
      html += `<table class="content-table"><thead><tr>${head.map(c=>`<th>${escapeHtml(c)}</th>`).join('')}</tr></thead><tbody>${body.map(r=>`<tr>${r.map(c=>`<td>${escapeHtml(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
      continue;
    }
    buf.push(escapeHtml(lines[i])); i++;
  }
  flush();
  return html;
}

  if(d._v < 10){ if(!d.reservationSettings) d.reservationSettings = { startHour:8, endHour:18, workingDays:[1,2,3,4,5], maxDuration:2, maxReservationsPerWeek:3, enabled:true }; if(!d.notificationSettings) d.notificationSettings = { reservationPending:true, reservationApproved:true, reservationRejected:true, absencePending:true, formationFull:true, budgetLow:true }; if(!d.messagingSettings) d.messagingSettings = { enabled:true, signature:'Cordialement, l’administration.', blacklist:[] }; d._v = 10; changed = true; }
  if(d._v < 11){ if(!d.securitySettings) d.securitySettings = { minPasswordLength:6, sessionTimeout:30, forcePasswordChange:false, maxLoginAttempts:5, lockoutDuration:15 }; if(!d.advancedAppearance) d.advancedAppearance = { customCSS:'', fontFamily:'Inter', themeMode:'light' }; if(!d.smtpSettings) d.smtpSettings = { host:'', port:587, secure:false, auth:false, username:'', password:'', fromEmail:'', fromName:'Portail ARENA' }; if(!d.complianceSettings) d.complianceSettings = { cookieBanner:true, privacyText:'Ce site utilise des cookies pour améliorer votre expérience. En continuant, vous acceptez notre politique de confidentialité.', legalMentions:'Portail ARENA - Établissement d\'enseignement. Tous droits réservés.', dataRetentionDays:365 }; if(!d.roles) d.roles = [ { id:uid('role'), name:'Administrateur', permissions:['*'] }, { id:uid('role'), name:'Gestionnaire ressources', permissions:['manage_resources','approve_reservations'] }, { id:uid('role'), name:'Personnel', permissions:['view_dashboard','book_resources','view_personnel'] } ]; d._v = 11; changed = true; }

async function loadData(){
  try{
    const snap = await getDoc(PORTAL_DOC);
    if(!snap.exists()){ const d = defaultData(); await setDoc(PORTAL_DOC, d); return d; }
    const { d, changed } = migrateData(snap.data());
    if(changed) await setDoc(PORTAL_DOC, d);
    return d;
  }catch(e){ console.error('Erreur de chargement Firestore :', e); return defaultData(); }
}

  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.id = id;
  toast.innerHTML = `<span>${message}</span><button class="close-toast" data-toast="${id}">✕</button>`;
  container.appendChild(toast);
  toast.querySelector('.close-toast').addEventListener('click', () => {
    toast.remove();
  });
  setTimeout(() => {
    if(toast.parentNode) toast.remove();
  }, duration);
}

setInterval(() => {
  if(!session) return;
  if(isAdmin()){
    const pending = (data.reservations||[]).filter(r => r.status === 'pending');
    const lastPending = window._lastPendingCount || 0;
    if(pending.length > lastPending){
      showToast(`📅 ${pending.length - lastPending} nouvelle(s) réservation(s) en attente`, 'warning');
    }
    window._lastPendingCount = pending.length;
  }
  const unread = (data.messages||[]).filter(m => m.to.includes(session.id) && !m.readBy.includes(session.id));
  const lastUnread = window._lastUnreadCount || 0;
  if(unread.length > lastUnread){
    showToast(`📩 ${unread.length - lastUnread} nouveau(x) message(s) non lu(s)`, 'info');
  }
  window._lastUnreadCount = unread.length;
}, 30000);

/* ---------------------------- RENDU PRINCIPAL ---------------------------- */
function render(){
  document.documentElement.setAttribute('data-theme', state.theme);
  if(data.customization && data.customization.primaryColor){
    document.documentElement.style.setProperty('--main-color', data.customization.primaryColor);
  }
  const font = data.advancedAppearance?.fontFamily || 'Inter';
  document.documentElement.style.setProperty('--font', `'${font}', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif`);

  const app = document.getElementById('app');
  let html = '';

  const isMaintenance = data.maintenance && data.maintenance.enabled;
  if(isMaintenance && (!session || !isAdmin())){
    if(session && session.role === 'admin'){ /* ok */ }
    else {
      html = viewMaintenance();
      app.innerHTML = html;
      return;
    }
  }

  if(!session){
    html = viewLogin();
  } else if(state.route === 'settings' && isAdmin()){
    html = viewShell(viewSettings());
  } else if(state.route === 'account'){
    html = viewShell(viewAccount());
  } else if(state.route.startsWith('module:')){
    html = viewShell(viewModule(state.route.slice(7)));
  } else {
    html = viewShell(viewDashboard());
  }
  if(state.modal){ html += renderModal(); }
  app.innerHTML = html;
  const modalInput = document.querySelector('.modal [autofocus]');
  if(modalInput) modalInput.focus();
  if(session){
    window._lastUnreadCount = (data.messages||[]).filter(m => m.to.includes(session.id) && !m.readBy.includes(session.id)).length;
    if(isAdmin()){
      window._lastPendingCount = (data.reservations||[]).filter(r => r.status === 'pending').length;
    }
  }
}

function getNotifications(){
  const items = [];
  if(!session) return items;
  const notifSettings = data.notificationSettings || {};
  if(data.messages){
    const unread = data.messages.filter(m => m.to.includes(session.id) && !m.readBy.includes(session.id));
    unread.forEach(m => {
      const sender = data.users.find(u => u.id === m.from);
      items.push({ id: m.id, text: `📩 ${sender ? sender.displayName : 'Inconnu'} : ${m.subject}`, moduleId: 'messagerie', full: m });
    });
  }
  if(data.notifications && data.notifications.length){
    const now = new Date();
    data.notifications.forEach(n => {
      if(n.expiry && new Date(n.expiry) < now) return;
      items.push({ id: n.id, text: n.title + (n.message ? ' : '+n.message : ''), moduleId: 'dashboard', full: n });
    });
  }
  if(isAdmin()){
    if(notifSettings.absencePending !== false){
      data.users.filter(u=>u.role==='user').forEach(u=>{
        const dos = ensureDossier(u.id);
        dos.absences.filter(a=>a.statut==='en attente').forEach(a=>{
          items.push({ text: `${u.displayName} — demande d'absence en attente (${a.motif||'motif non précisé'})`, moduleId:'personnel' });
        });
      });
    }
    if(notifSettings.formationFull !== false){
      const today = todayIso();
      (data.formations||[]).filter(f=>f.date>=today && f.inscrits.length>=f.places).forEach(f=>{
        items.push({ text: `Formation « ${f.title} » complète (${f.inscrits.length}/${f.places})`, moduleId:'formations' });
      });
    }
    if(notifSettings.budgetLow !== false){
      if(data.budget && data.budget.total - data.budget.depenses < data.budget.total * 0.1){
        items.push({ text: `⚠️ Budget : il ne reste que ${(data.budget.total - data.budget.depenses).toLocaleString('fr-FR')} €`, moduleId:'dashboard' });
      }
    }
    if(notifSettings.reservationPending !== false){
      const pendingRes = (data.reservations||[]).filter(r => r.status === 'pending');
      if(pendingRes.length){
        items.push({ text: `📅 ${pendingRes.length} réservation(s) en attente de validation`, moduleId:'ressources' });
      }
    }
  } else {
    const dos = ensureDossier(session.id);
    if(notifSettings.absencePending !== false){
      dos.absences.filter(a=>a.statut==='en attente').forEach(a=>{
        items.push({ text: `Votre demande d'absence du ${a.date} est en attente de validation`, moduleId:'personnel' });
      });
    }
    const myRes = (data.reservations||[]).filter(r => r.userId === session.id && r.status === 'pending');
    if(notifSettings.reservationPending !== false && myRes.length){
      items.push({ text: `📅 ${myRes.length} de vos réservations sont en attente de validation`, moduleId:'ressources' });
    }
    if(notifSettings.reservationApproved !== false){
      const approved = (data.reservations||[]).filter(r => r.userId === session.id && r.status === 'approved');
      approved.forEach(r => {
        const res = data.ressources.find(x => x.id === r.ressourceId);
        items.push({ text: `✅ Réservation approuvée : ${res ? res.name : 'ressource'} le ${r.date} ${r.startTime}`, moduleId:'ressources' });
      });
    }
    if(notifSettings.reservationRejected !== false){
      const rejected = (data.reservations||[]).filter(r => r.userId === session.id && r.status === 'rejected');
      rejected.forEach(r => {
        const res = data.ressources.find(x => x.id === r.ressourceId);
        items.push({ text: `❌ Réservation refusée : ${res ? res.name : 'ressource'} le ${r.date} ${r.startTime}`, moduleId:'ressources' });
      });
    }
  }
  return items;
}

function renderTabPanel(content){
  if(content && content.trim().startsWith('%%SALAIRE%%')){
    const rest = content.trim().slice('%%SALAIRE%%'.length).trim();
    return renderSalaryCalculator(rest);
  }
  return parseContent(content);
}

function renderSalaryCalculator(extraNote){
  const r = computeSalary(450);
  return `<div class="callout">Simulateur basé sur la valeur réelle du point d'indice : <b>${POINT_INDICE.toFixed(5)} €</b> brut par mois.</div>${extraNote?`<div style="padding:0 0 10px;">${parseContent(extraNote)}</div>`:''}<div class="form-grid"><div class="field"><label for="sal-im">Indice majoré (IM)</label><input type="number" id="sal-im" min="100" max="1100" step="1" value="450" oninput="updateSalaryCalc()"><div class="field-hint">Indiqué sur le bulletin de paie</div></div></div><div class="calc-result"><div class="stat-card" style="border-top-color:var(--purple);"><div class="stat-value" id="sal-brut">${fmtEuro(r.brut)}</div><div class="stat-label">Brut mensuel</div></div><div class="stat-card" style="border-top-color:var(--ok);"><div class="stat-value" id="sal-net">≈ ${fmtEuro(r.net)}</div><div class="stat-label">Net estimé</div></div><div class="stat-card" style="border-top-color:var(--red);"><div class="stat-value" id="sal-annuel">${fmtEuro(r.annuel)}</div><div class="stat-label">Brut annuel</div></div></div><p class="muted" style="font-size:11px;">Net estimé = brut × 98,25% − pension − CSG − CRDS. Hors primes.</p>`;
}

const POINT_INDICE = 4.92278;
function computeSalary(im){ const brut=im*POINT_INDICE; const assiette=brut*0.9825; const net=assiette-assiette*0.111-assiette*0.092-assiette*0.005; return {brut,net,annuel:brut*12}; }
function fmtEuro(n){ return Math.round(n).toLocaleString('fr-FR')+' €'; }
window.updateSalaryCalc = function(){
  const el=document.getElementById('sal-im'); if(!el) return;
  const im=parseFloat(el.value)||0;
  const r=computeSalary(im);
  document.getElementById('sal-brut').textContent=fmtEuro(r.brut);
  document.getElementById('sal-net').textContent='≈ '+fmtEuro(r.net);
  document.getElementById('sal-annuel').textContent=fmtEuro(r.annuel);
};

      ${(isAdmin() && state.editMode) ? `
        <div class="post-actions">
          <button class="btn btn-ghost btn-icon btn-sm" data-action="edit-post" data-mid="${m.id}" data-pid="${p.id}" title="Modifier">${icon('pencil')}</button>
          <button class="btn btn-danger btn-icon btn-sm" data-action="delete-post" data-mid="${m.id}" data-pid="${p.id}" title="Supprimer">${icon('trash')}</button>
        </div>` : ''}
    </div>`).join('');
  return `<div class="tab-panel" style="border-radius:0 0 8px 8px;">${addBtn}<div class="feed">${posts}</div></div>`;
}

/* ===== RENDER PERSONNEL MODULE ===== */
function renderPersonnelModule(m){
  if(!isAdmin()){
    const u = session; const dos = ensureDossier(u.id);
    return renderDossierPanel(u, dos, false);
  }
  if(state.selectedProfId){
    const u = data.users.find(x => x.id === state.selectedProfId);
    if(!u){ state.selectedProfId = null; return `<div class="empty-note">Ce professeur n'existe plus.</div>`; }
    const dos = ensureDossier(u.id);
    return `<div class="crumb"><button data-action="back-to-roster">← Liste des professeurs</button></div>${renderDossierPanel(u, dos, true)}`;
  }
  let profs = data.users.filter(u => u.role === 'user');
  const sortBy = state.profSort || 'name';
  profs = [...profs].sort((a,b) => {
    if(sortBy === 'pending'){ const pa = ensureDossier(a.id).absences.filter(x=>x.statut==='en attente').length; const pb = ensureDossier(b.id).absences.filter(x=>x.statut==='en attente').length; if(pb !== pa) return pb - pa; }
    return a.displayName.localeCompare(b.displayName, 'fr');
  });
  const rows = profs.map(u => {
    const dos = ensureDossier(u.id);
    const enAttente = dos.absences.filter(a => a.statut === 'en attente').length;
    const enCours = dos.affectations.find(a => !a.fin);
    const searchBlob = (u.displayName + ' ' + u.username + ' ' + (enCours?enCours.etablissement:'') + ' ' + (dos.matricule||'')).toLowerCase();
    return `
    <div class="row-item" data-search="${escapeHtml(searchBlob)}">
      <span class="user-avatar" style="width:24px;height:24px;font-size:10px;">${escapeHtml(initials(u.displayName))}</span>
      <div class="ri-main">
        <div class="ri-title">${escapeHtml(u.displayName)}</div>
        <div class="ri-sub">${escapeHtml(u.username)} · Matricule : ${escapeHtml(dos.matricule||'—')}${enCours?` · ${escapeHtml(enCours.etablissement)}`:''}${enAttente ? ` · <span style="color:var(--danger);font-weight:700;">${enAttente} en attente</span>` : ''}</div>
      </div>
      <div class="row-actions"><button class="btn btn-sm" data-action="select-prof" data-id="${u.id}">Voir</button></div>
    </div>`;
  }).join('') || `<div class="empty-note">Aucun professeur enregistré.</div>`;
  return `<div class="card"><h3>Professeurs</h3><p class="card-sub">Recherchez ou sélectionnez un professeur.</p>
    <div class="search-row" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;">
      <div style="display:flex;gap:8px;flex-wrap:wrap;flex:1;">
        <input type="text" placeholder="Rechercher…" oninput="filterProfRows(this.value)" style="flex:1;min-width:120px;">
        <select data-action="sort-profs" onchange="setProfSort(this.value)" style="max-width:180px;">
          <option value="name" ${sortBy==='name'?'selected':''}>Trier par nom</option>
          <option value="pending" ${sortBy==='pending'?'selected':''}>Trier par absences</option>
        </select>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        <button class="btn btn-primary btn-sm" data-action="add-user">${icon('plus')} Ajouter</button>
        <button class="btn btn-ghost btn-sm" data-action="export-personnel-csv">${icon('download')}</button>
      </div>
    </div>
    <div class="row-list" id="prof-roster">${rows}</div></div>`;
}

function renderDossierPanel(u, dos, editable){
  const affRows = dos.affectations.map(a => `
    <div class="row-item">
      <div class="ri-main"><div class="ri-title">${escapeHtml(a.etablissement)}</div><div class="ri-sub">${escapeHtml(a.debut)} — ${a.fin?escapeHtml(a.fin):'en cours'}</div></div>
      ${editable ? `<div class="row-actions">
        <button class="btn btn-ghost btn-icon btn-sm" data-action="edit-affectation" data-uid="${u.id}" data-aid="${a.id}" title="Modifier">${icon('pencil')}</button>
        <button class="btn btn-danger btn-icon btn-sm" data-action="delete-affectation" data-uid="${u.id}" data-aid="${a.id}" title="Supprimer">${icon('trash')}</button>
      </div>` : ''}
    </div>`).join('') || `<div class="empty-note">Aucune affectation.</div>`;
  const absRows = [...dos.absences].reverse().map(a => {
    const badgeClass = a.statut==='validée' ? 'badge-ok' : a.statut==='refusée' ? 'badge-danger' : 'badge-pending';
    const actions = editable ? `<div class="row-actions">${a.statut==='en attente' ? `<button class="btn btn-ghost btn-icon btn-sm" data-action="validate-absence" data-uid="${u.id}" data-aid="${a.id}" title="Valider">${icon('check')}</button><button class="btn btn-danger btn-icon btn-sm" data-action="refuse-absence" data-uid="${u.id}" data-aid="${a.id}" title="Refuser">${icon('x')}</button>` : ''}<button class="btn btn-danger btn-icon btn-sm" data-action="delete-absence" data-uid="${u.id}" data-aid="${a.id}" title="Supprimer">${icon('trash')}</button></div>` : '';
    return `<div class="row-item"><div class="ri-main"><div class="ri-title">${escapeHtml(a.date)} — ${escapeHtml(a.motif)} <span class="badge ${badgeClass}">${escapeHtml(a.statut)}</span></div><div class="ri-sub">${escapeHtml(a.duree)}</div></div>${actions}</div>`;
  }).join('') || `<div class="empty-note">Aucune absence.</div>`;
  return `
    <div class="card">
      <div class="dossier-print-bar">
        <div><h3 style="margin-bottom:2px;">${escapeHtml(u.displayName)}</h3><p class="card-sub" style="margin:0;">Matricule : <b>${escapeHtml(dos.matricule||'—')}</b> · Identifiant : ${escapeHtml(u.username)}</p></div>
        <div class="no-print" style="display:flex;gap:6px;flex-wrap:wrap;">
          ${editable ? `<button class="btn btn-ghost btn-sm" data-action="edit-user" data-id="${u.id}" title="Modifier">${icon('pencil')} Identité</button>` : ''}
          <button class="btn btn-ghost btn-sm" data-action="print-dossier" title="Imprimer">${icon('download')} Imprimer</button>
          ${editable ? `<button class="btn btn-danger btn-sm" data-action="delete-user" data-id="${u.id}" title="Supprimer">${icon('trash')} Supprimer</button>` : ''}
        </div>
      </div>
      <p class="card-sub">${editable ? "Situation administrative — modifiable par l'administration." : 'Votre situation administrative.'}</p>
      ${editable ? `<form data-form="dossier-situation" data-uid="${u.id}"><div class="field"><textarea name="situation" rows="3">${escapeHtml(dos.situation)}</textarea></div><div class="form-actions"><button class="btn btn-primary btn-sm" type="submit">${icon('check')} Enregistrer</button></div></form>` : parseContent(dos.situation || 'Aucune information renseignée.')}
    </div>
    <div class="card"><h3>Mes formations</h3><p class="card-sub">Formations suivies ou à venir.</p><div class="row-list">${renderProfFormationsRows(u.id)}</div></div>
    <div class="card"><h3>Affectations</h3><p class="card-sub">Historique des établissements.</p><div class="row-list">${affRows}</div>${editable ? `<div style="margin-top:10px;"><button class="btn btn-sm" data-action="add-affectation" data-uid="${u.id}">${icon('plus')} Ajouter</button></div>` : ''}</div>
    <div class="card"><h3>Salaire</h3><p class="card-sub">${editable ? "Indice géré par l'administration." : 'Simulateur basé sur votre indice actuel.'}</p>${renderSalaryBlock(u.id, (dos.salaire && dos.salaire.indiceMajore) || 400, editable)}</div>
    <div class="card"><h3>Absences</h3><p class="card-sub">${editable ? 'Demandes et absences enregistrées.' : 'Vos demandes et absences.'}</p><div class="row-list">${absRows}</div><div style="margin-top:10px;"><button class="btn btn-sm" data-action="add-absence" data-uid="${u.id}">${icon('plus')} ${editable ? 'Ajouter une absence' : "Nouvelle demande"}</button></div></div>
    <div class="card"><h3>Solde de congés</h3><p class="card-sub">${editable ? "Solde annuel modifiable ; les jours pris se calculent automatiquement." : 'Calculé automatiquement.'}</p>${renderCongesBlock(u.id, dos, editable)}</div>
  `;
}

function renderCongesBlock(userId, dos, editable){
  const pris = dos.absences.filter(a => a.statut === 'validée').reduce((n,a) => n + parseDureeJours(a.duree), 0);
  const solde = dos.soldeConges;
  const restant = solde - pris;
  const editForm = editable ? `<form data-form="dossier-conges" data-uid="${userId}" style="margin-bottom:10px;"><div class="form-grid"><div class="field"><label>Solde annuel (jours)</label><input type="number" name="soldeConges" min="0" step="0.5" value="${solde}"></div></div><div class="form-actions"><button class="btn btn-primary btn-sm" type="submit">${icon('check')} Enregistrer</button></div></form>` : '';
  return `${editForm}<div class="calc-result"><div class="stat-card" style="border-top-color:var(--purple);"><div class="stat-value">${solde}</div><div class="stat-label">Solde annuel</div></div><div class="stat-card" style="border-top-color:var(--red);"><div class="stat-value">${pris}</div><div class="stat-label">Jours pris</div></div><div class="stat-card" style="border-top-color:${restant<0?'var(--red)':'var(--ok)'};"><div class="stat-value">${restant}</div><div class="stat-label">Jours restants</div></div></div>`;
}

function renderSalaryBlock(userId, im, editable){
  const r = computeSalary(im);
  const inputHtml = editable ? `<input type="number" id="sal-im" name="indiceMajore" min="100" max="1100" step="1" value="${im}" oninput="updateSalaryCalc()">` : `<input type="number" id="sal-im" value="${im}" disabled>`;
  return `<div class="callout">Indice majoré × ${POINT_INDICE.toFixed(5)} €</div>${editable ? `<form data-form="dossier-salaire" data-uid="${userId}">` : ''}<div class="form-grid"><div class="field"><label for="sal-im">Indice majoré (IM)</label>${inputHtml}${!editable ? `<div class="field-hint">Géré par l'administration</div>` : ''}</div></div><div class="calc-result"><div class="stat-card" style="border-top-color:var(--purple);"><div class="stat-value" id="sal-brut">${fmtEuro(r.brut)}</div><div class="stat-label">Brut mensuel</div></div><div class="stat-card" style="border-top-color:var(--ok);"><div class="stat-value" id="sal-net">≈ ${fmtEuro(r.net)}</div><div class="stat-label">Net estimé</div></div><div class="stat-card" style="border-top-color:var(--red);"><div class="stat-value" id="sal-annuel">${fmtEuro(r.annuel)}</div><div class="stat-label">Brut annuel</div></div></div>${editable ? `<div class="form-actions"><button class="btn btn-primary btn-sm" type="submit">${icon('check')} Enregistrer</button></div></form>` : ''}`;
}

function renderProfFormationsRows(userId){
  const mine = (data.formations||[]).filter(f => f.inscrits.includes(userId));
  if(!mine.length) return `<div class="empty-note">Aucune formation suivie.</div>`;
  return mine.map(f => `<div class="row-item"><div class="ri-main"><div class="ri-title">${escapeHtml(f.title)} ${formationStatusBadge(f)}</div><div class="ri-sub">${escapeHtml(f.date)} · ${escapeHtml(f.lieu)}</div></div></div>`).join('');
}
function formationStatusBadge(f){
  const isPast = f.date < todayIso();
  const isClosed = f.dateLimite && f.dateLimite < todayIso();
  return `<span class="badge ${isPast?'badge-danger':isClosed?'badge-pending':'badge-ok'}">${isPast?'Passée':isClosed?'Inscriptions closes':'À venir'}</span>`;
}

/* ===== RENDER FORMATIONS MODULE ===== */
function renderFormationsModule(m){
  const list = data.formations || [];
  if(isAdmin()){
    const rows = list.map(f => {
      const expanded = state.expandedFormationId === f.id;
      const inscritsNames = f.inscrits.map(uid_ => { const u = data.users.find(x => x.id === uid_); return u ? u.displayName : '(compte supprimé)'; });
      return `<div class="row-item" style="flex-wrap:wrap;"><div class="ri-main"><div class="ri-title">${escapeHtml(f.title)} ${formationStatusBadge(f)}</div><div class="ri-sub">${escapeHtml(f.date)} · ${escapeHtml(f.lieu)} · ${f.inscrits.length}/${f.places} inscrit(s)${f.dateLimite ? ` · Jusqu'au ${escapeHtml(f.dateLimite)}` : ''}</div></div><div class="row-actions"><button class="btn btn-ghost btn-sm" data-action="toggle-formation-inscrits" data-id="${f.id}">${expanded ? 'Masquer' : 'Voir'} inscrits</button><button class="btn btn-ghost btn-icon btn-sm" data-action="edit-formation" data-id="${f.id}" title="Modifier">${icon('pencil')}</button><button class="btn btn-danger btn-icon btn-sm" data-action="delete-formation" data-id="${f.id}" title="Supprimer">${icon('trash')}</button></div>${expanded ? `<div style="flex-basis:100%;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);">${inscritsNames.length ? `<ul style="margin:0 0 0 16px;">${inscritsNames.map(n => `<li>${escapeHtml(n)}</li>`).join('')}</ul>` : `<p class="muted" style="font-size:12px;">Aucune inscription.</p>`}</div>` : ''}</div>`;
    }).join('') || `<div class="empty-note">Aucune formation créée.</div>`;
    return `<div class="card"><h3>Formations proposées</h3><p class="card-sub">Créez des formations ; les inscriptions remontent automatiquement.</p><div class="row-list">${rows}</div><div style="margin-top:12px;"><button class="btn btn-sm" data-action="add-formation">${icon('plus')} Ajouter une formation</button></div></div>`;
  }
  const rows = list.map(f => {
    const inscrit = f.inscrits.includes(session.id);
    const past = f.date < todayIso();
    const isClosed = f.dateLimite && f.dateLimite < todayIso();
    const complet = !inscrit && (f.inscrits.length >= f.places || past || isClosed);
    const btnLabel = inscrit ? 'Se désinscrire' : (past ? 'Terminée' : (isClosed ? 'Inscriptions closes' : (complet ? 'Complet' : "S'inscrire")));
    return `<div class="row-item"><div class="ri-main"><div class="ri-title">${escapeHtml(f.title)} ${formationStatusBadge(f)}</div><div class="ri-sub">${escapeHtml(f.date)} · ${escapeHtml(f.lieu)} · ${f.places - f.inscrits.length} place(s) restante(s)${f.dateLimite ? ` · Avant le ${escapeHtml(f.dateLimite)}` : ''}</div><p style="font-size:12px;color:#33415c;margin-top:4px;">${escapeHtml(f.description)}</p></div><div class="row-actions"><button class="btn ${inscrit ? 'btn-danger' : 'btn-primary'} btn-sm" data-action="toggle-inscription" data-id="${f.id}" ${complet ? 'disabled' : ''}>${btnLabel}</button></div></div>`;
  }).join('') || `<div class="empty-note">Aucune formation proposée.</div>`;
  return `<div class="card"><h3>Formations disponibles</h3><p class="card-sub">Inscrivez-vous aux formations proposées.</p><div class="row-list">${rows}</div></div>`;
}

/* ===== RENDER MESSAGERIE MODULE ===== */
function renderMessagerieModule(m){
  const msgSettings = data.messagingSettings || { enabled: true };
  if(!msgSettings.enabled) return `<div class="tab-panel" style="border-radius:0 0 8px 8px;"><div class="callout" style="background:#fbe9e9;color:var(--danger);border-color:var(--danger);">La messagerie interne est actuellement désactivée par l'administrateur.</div></div>`;
  if(state.msgCompose) return renderMessageCompose();
  if(state.msgSelected) return renderMessageDetail();
  return renderMessageList();
}

function renderMessageList(){
  const user = session;
  const folder = state.msgFolder;
  let messages = [];
  if(folder === 'inbox') messages = (data.messages||[]).filter(m => m.to.includes(user.id)).sort((a,b) => new Date(b.date) - new Date(a.date));
  else if(folder === 'sent') messages = (data.messages||[]).filter(m => m.from === user.id).sort((a,b) => new Date(b.date) - new Date(a.date));
  else if(folder === 'drafts') messages = (data.messages||[]).filter(m => m.from === user.id && m.draft).sort((a,b) => new Date(b.date) - new Date(a.date));
  const unreadCount = messages.filter(m => !m.readBy.includes(user.id)).length;
  const list = messages.length ? messages.map(m => {
    const isUnread = !m.readBy.includes(user.id);
    const sender = data.users.find(u => u.id === m.from);
    const senderName = sender ? sender.displayName : 'Inconnu';
    const preview = m.body ? m.body.replace(/<[^>]+>/g,'').substring(0,80) : '';
    return `<div class="msg-item ${isUnread ? 'unread' : ''}" data-action="select-message" data-id="${m.id}"><div class="msg-avatar">${initials(senderName)}</div><div class="msg-info"><div class="msg-sender">${escapeHtml(senderName)} ${isUnread ? '<span class="badge badge-unread">Nouveau</span>' : ''}</div><div class="msg-subject">${escapeHtml(m.subject)}</div><div class="msg-preview">${escapeHtml(preview)}</div></div><div class="msg-date">${escapeHtml(m.dateStr || '')}</div></div>`;
  }).join('') : `<div class="empty-note">Aucun message dans ce dossier.</div>`;
  const composeBtn = `<button class="btn btn-primary btn-sm" data-action="compose-message">${icon('plus')} Nouveau message</button>`;
  return `<div class="tab-panel" style="border-radius:0 0 8px 8px;"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px;"><div class="msg-folder-list"><button class="msg-folder-btn ${folder==='inbox'?'active':''}" data-action="msg-folder" data-folder="inbox">Boîte de réception ${unreadCount ? `(${unreadCount})` : ''}</button><button class="msg-folder-btn ${folder==='sent'?'active':''}" data-action="msg-folder" data-folder="sent">Envoyés</button><button class="msg-folder-btn ${folder==='drafts'?'active':''}" data-action="msg-folder" data-folder="drafts">Brouillons</button></div>${composeBtn}</div>${list}</div>`;
}

function renderMessageDetail(){
  const msg = (data.messages||[]).find(m => m.id === state.msgSelected);
  if(!msg){ state.msgSelected = null; return renderMessageList(); }
  if(!msg.readBy.includes(session.id)){ msg.readBy.push(session.id); saveData(); }
  const sender = data.users.find(u => u.id === msg.from);
  const senderName = sender ? sender.displayName : 'Inconnu';
  const toNames = msg.to.map(id => { const u = data.users.find(x => x.id === id); return u ? u.displayName : 'Inconnu'; }).join(', ');
  const canDelete = (msg.from === session.id || isAdmin());
  return `<div class="tab-panel" style="border-radius:0 0 8px 8px;"><div style="margin-bottom:10px;"><button class="btn btn-ghost btn-sm" data-action="back-to-messages">← Retour</button>${canDelete ? `<button class="btn btn-danger btn-sm" data-action="delete-message" data-id="${msg.id}">${icon('trash')} Supprimer</button>` : ''}<button class="btn btn-ghost btn-sm" data-action="compose-message" data-reply="${msg.id}">${icon('arrowRight')} Répondre</button></div><div class="msg-detail"><div class="msg-header"><div><strong>De :</strong> ${escapeHtml(senderName)}</div><div><strong>À :</strong> ${escapeHtml(toNames)}</div><div><strong>Objet :</strong> ${escapeHtml(msg.subject)}</div><div style="font-size:12px;color:var(--ink-faint);">${escapeHtml(msg.dateStr || '')}</div></div><div class="msg-body">${msg.body || ''}</div></div></div>`;
}

function renderMessageCompose(){
  const replyTo = state.msgReplyTo ? data.messages.find(m => m.id === state.msgReplyTo) : null;
  const defaultRecipients = replyTo ? replyTo.from : [];
  const defaultSubject = replyTo ? `Re: ${replyTo.subject}` : '';
  const msgSettings = data.messagingSettings || { signature: '' };
  if(!state._recipientsInitialized || state.msgCompose){
    state.selectedRecipients = [...defaultRecipients];
    state._recipientsInitialized = true;
  }
  let recipientHtml = '';
  if(isAdmin()){
    recipientHtml = `
      <div class="field">
        <label>Dossier destinataire (optionnel)</label>
        <select name="folder" id="msg-folder-select" onchange="updateRecipientsFromFolder(this.value)">
          <option value="">-- Sélectionner un dossier --</option>
          ${renderFolderOptions(data.recipientFolders||[])}
        </select>
        <div class="field-hint">Sélectionnez un dossier pour pré-remplir les destinataires.</div>
      </div>
      <div class="field">
        <label>Destinataires nominatifs (recherche)</label>
        <div class="user-search-container">
          <input type="text" id="recipient-search" placeholder="Rechercher un utilisateur..." autocomplete="off">
          <div id="user-search-results" class="user-search-results" style="display:none;"></div>
        </div>
        <div id="selected-recipients" style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;">
          ${state.selectedRecipients.map(id => {
            const u = data.users.find(x => x.id === id);
            return u ? `<span class="user-chip-mini">${escapeHtml(u.displayName)} <button class="remove-btn" data-action="remove-recipient" data-id="${id}">✕</button></span>` : '';
          }).join('')}
        </div>
        <input type="hidden" name="recipients" id="recipients-hidden" value="${state.selectedRecipients.join(',')}">
        <div class="field-hint">Ajoutez des utilisateurs via la recherche ou sélectionnez un dossier.</div>
      </div>
    `;
  } else {
    const userOpts = data.users.filter(u => u.id !== session.id).map(u => `<option value="${u.id}">${escapeHtml(u.displayName)}</option>`).join('');
    recipientHtml = `<div class="field"><label>Destinataires</label><select name="recipients" multiple size="5" style="height:auto;">${userOpts}</select><div class="field-hint">Maintenez Ctrl (Cmd) pour sélectionner plusieurs.</div></div>`;

window.searchUsers = function(query){

  if(results.length === 0){ container.innerHTML = '<div class="search-item">Aucun résultat</div>'; container.style.display = 'block'; return; }

function getFolderUsers(folderId){
  const findUsers = (folders, id) => {
    for(let f of folders){
      if(f.id === id){
        if(f.users) return f.users.join(', ');
        if(f.children){ let all = []; f.children.forEach(c => { if(c.users) all = all.concat(c.users); else if(c.children) all = all.concat(findUsers(c.children, c.id)); }); return all.join(', '); }
        return '';
      }
      if(f.children){ const res = findUsers(f.children, id); if(res) return res; }
    }
    return '';
  };
  return findUsers(data.recipientFolders, folderId);
}
window.getFolderUsers = getFolderUsers;

function getWeekDays(start){ const days=[]; for(let i=0;i<7;i++){ const d=new Date(start); d.setDate(d.getDate()+i); days.push(d); } return days; }
function formatDateFr(d){ return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}); }
function getWeekNumber(d){ const date=new Date(d); date.setHours(0,0,0,0); date.setDate(date.getDate()+3-(date.getDay()+6)%7); const week1=new Date(date.getFullYear(),0,4); return 1+Math.round(((date-week1)/86400000-3+(week1.getDay()+6)%7)/7); }
function getReservationHours(){ const settings=data.reservationSettings||{startHour:8,endHour:18}; const hours=[]; for(let h=settings.startHour; h<settings.endHour; h++) hours.push(h); return hours; }

function renderWeekTable(start, mode, ressourceId){
  const settings = data.reservationSettings || { startHour: 8, endHour: 18, workingDays: [1,2,3,4,5], maxDuration: 2, maxReservationsPerWeek: 3 };
  const weekDays = getWeekDays(start);
  const days = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  const hours = getReservationHours();
  let html = `<table class="edt-table"><thead><tr><th>Horaire</th>`;
  weekDays.forEach((d,i) => { const dayOfWeek = i+1; const isWorking = settings.workingDays.includes(dayOfWeek); html += `<th>${isWorking ? days[i] : `<span style="color:var(--ink-faint);">${days[i]}`}<br><span style="font-weight:400;font-size:11px;">${formatDateFr(d)}</span></th>`; });
  html += `</tr></thead><tbody>`;
  hours.forEach(h => {
    const startHour = h; const endHour = h+1;
    const slotLabel = `${String(startHour).padStart(2,'0')}h-${String(endHour).padStart(2,'0')}h`;
    html += `<tr><td style="font-weight:600;background:var(--bg);">${slotLabel}</td>`;
    weekDays.forEach((d, idx) => {
      const dayOfWeek = idx+1;
      const dateStr = d.toISOString().slice(0,10);
      const isWorking = settings.workingDays.includes(dayOfWeek);
      if(!isWorking){ html += `<td class="slot-blocked">—</td>`; return; }
      let reservations = (data.reservations||[]).filter(r => {
        if(mode === 'admin') return r.date === dateStr && r.startTime === slotLabel.split('-')[0]+'h' && (r.status === 'approved' || r.status === 'pending');
        else return r.date === dateStr && r.startTime === slotLabel.split('-')[0]+'h' && r.ressourceId === ressourceId && (r.status === 'approved');
      });
      const userRes = (data.reservations||[]).find(r => r.date === dateStr && r.startTime === slotLabel.split('-')[0]+'h' && r.ressourceId === ressourceId && r.userId === session.id);
      if(mode === 'admin'){
        if(reservations.length){ const status = reservations[0].status; const cls = status === 'approved' ? 'slot-booked' : (status === 'pending' ? 'slot-pending' : 'slot-booked'); html += `<td class="${cls}">${status === 'approved' ? 'Réservé' : 'En attente'}</td>`; }
        else html += `<td class="slot-free">—</td>`;
      } else {
        const blocked = (data.ressources.find(r => r.id === ressourceId)?.blocked) || false;
        if(blocked) html += `<td class="slot-blocked">Bloqué</td>`;
        else if(userRes) html += `<td class="slot-own">Votre réservation</td>`;
        else if(reservations.length) html += `<td class="slot-booked">Réservé</td>`;
        else {
          const weekStart = new Date(start); const weekEnd = new Date(start); weekEnd.setDate(weekEnd.getDate()+6);
          const userReservationsThisWeek = (data.reservations||[]).filter(r => { const rDate = new Date(r.date); return r.userId === session.id && r.status === 'approved' && rDate >= weekStart && rDate <= weekEnd; });
          if(settings.maxReservationsPerWeek && userReservationsThisWeek.length >= settings.maxReservationsPerWeek) html += `<td class="slot-blocked">Quota atteint</td>`;
          else html += `<td class="slot-free"><button class="slot-btn" data-action="book-slot" data-res="${ressourceId}" data-date="${dateStr}" data-start="${slotLabel.split('-')[0]+'h'}" data-end="${String(endHour).padStart(2,'0')+'h'}">Réserver</button></td>`;
        }
      }
    });
    html += `</tr>`;
  });
  html += `</tbody></table>`;
  return html;
}

          <span class="todo-text done">${escapeHtml(t.text)}</span>
          <div class="todo-actions">
            <button class="btn btn-danger btn-icon btn-sm" data-action="delete-todo" data-id="${t.id}" title="Supprimer">${icon('trash')}</button>
          </div>
        </div>
      `).join('')}
    </div>
  `;
  return html;
}

/* ===== ACCOUNT ===== */
function viewAccount(){
  const u = session;
  let recap = '';
  if(u.role === 'user'){
    const dos = ensureDossier(u.id);
    const pris = dos.absences.filter(a => a.statut === 'validée').reduce((n,a) => n + parseDureeJours(a.duree), 0);
    const enAttente = dos.absences.filter(a => a.statut === 'en attente').length;
    recap = `<div class="card"><h3>Ma situation</h3><p class="card-sub">Matricule : <b>${escapeHtml(dos.matricule||'—')}</b></p><div class="calc-result"><div class="stat-card" style="border-top-color:var(--purple);"><div class="stat-value">${dos.soldeConges - pris}</div><div class="stat-label">Congés restants</div></div><div class="stat-card" style="border-top-color:${enAttente?'var(--red)':'var(--ok)'};"><div class="stat-value">${enAttente}</div><div class="stat-label">Demandes en attente</div></div></div><div class="form-actions"><button class="btn btn-sm" data-action="open-module" data-id="personnel">${icon('arrowRight')} Voir mon dossier</button></div></div>`;
  }
  return `<div class="page"><div class="crumb"><button data-action="go-dashboard">← Tableau de bord</button></div><div class="page-head"><h1 style="font-size:18px;">Mon compte</h1></div>${recap}<div class="card"><h3>Identité</h3><p class="card-sub">Identifiant : <b>${escapeHtml(u.username)}</b> · Rôle : ${u.role==='admin'?'Administrateur':'Personnel'}</p></div><div class="card"><h3>Changer mon mot de passe</h3><p class="card-sub">Vous devez connaître votre mot de passe actuel.</p>${state.accountMsg ? `<div class="callout" style="${state.accountMsg.ok?'':'background:#fbe9e9;color:var(--danger);'}">${escapeHtml(state.accountMsg.text)}</div>` : ''}<form data-form="change-password"><div class="field"><label>Mot de passe actuel</label><input type="password" name="current" required></div><div class="field"><label>Nouveau mot de passe</label><input type="password" name="next" required minlength="4"></div><div class="field"><label>Confirmer</label><input type="password" name="confirm" required minlength="4"></div><div class="form-actions"><button class="btn btn-primary btn-sm" type="submit">${icon('check')} Mettre à jour</button></div></form></div></div>`;
}

/* ===== SETTINGS — TOUS LES ONGLETS FONCTIONNELS ===== */

  const nav = SETTINGS_SECTIONS.map(s => `<button class="${state.settingsTab===s.id?'active':''}" data-action="settings-tab" data-tab="${s.id}">${icon(s.icon)} ${s.label}</button>`).join('');

    case 'messagerie_settings': panel = settingsMessagerieSettings(); break;
    case 'journal': panel = settingsJournal(); break;
    case 'data': panel = settingsData(); break;
    case 'security': panel = settingsSecurity(); break;

function settingsAgape(){

  const rows = filtered.map(e => `
    <div class="row-item">
      <div class="ri-main">
        <div class="ri-title">${escapeHtml(e.title)} ${e.published ? `<span class="badge badge-ok">Publié</span>` : `<span class="badge badge-pending">Brouillon</span>`}</div>
        <div class="ri-sub">${escapeHtml(e.date)} · Classes : ${e.classes.join(', ')}</div>
      </div>
      <div class="row-actions">
        <button class="btn btn-ghost btn-icon btn-sm" data-action="toggle-exam-publish" data-id="${e.id}" title="${e.published ? 'Masquer' : 'Publier'}">${e.published ? icon('eye') : icon('eyeOff')}</button>

function settingsMessagerieSettings(){

        html += `<div class="row-item"><div class="ri-main"><div class="ri-title">📁 ${escapeHtml(f.name)}</div><div class="ri-sub">${f.children.length} sous-dossier(s)</div></div><div class="row-actions"><button class="btn btn-ghost btn-icon btn-sm" data-action="edit-folder" data-id="${f.id}" title="Modifier">${icon('pencil')}</button><button class="btn btn-danger btn-icon btn-sm" data-action="delete-folder" data-id="${f.id}" title="Supprimer">${icon('trash')}</button></div></div>${renderFolders(f.children, level+1)}`;

        html += `<div class="row-item"><div class="ri-main"><div class="ri-title">${indent}📁 ${escapeHtml(f.name)}</div><div class="ri-sub">${(f.users||[]).length} utilisateur(s)</div></div><div class="row-actions"><button class="btn btn-ghost btn-icon btn-sm" data-action="edit-folder" data-id="${f.id}" title="Modifier">${icon('pencil')}</button><button class="btn btn-danger btn-icon btn-sm" data-action="delete-folder" data-id="${f.id}" title="Supprimer">${icon('trash')}</button></div></div>`;

/* ===== MODALES ET GESTION DES ÉVÉNEMENTS (corrigé) ===== */
function openModal(type, data_){ state.modal = { type, data: data_ || {} }; render(); }
function renderModal(){
  const mo = state.modal;
  if(!mo) return '';
  if(mo.type === 'confirm'){
    return `<div class="overlay"><div class="modal" data-stop><div class="modal-head"><h3>${escapeHtml(mo.title)}</h3><button class="btn btn-ghost btn-icon" data-action="close-modal">${icon('x')}</button></div><div class="modal-body"><p class="confirm-text">${escapeHtml(mo.message)}</p></div><div class="modal-foot"><button class="btn" data-action="close-modal">Annuler</button><button class="btn btn-danger" data-action="confirm-yes">${icon('trash')} Confirmer</button></div></div></div>`;
  }
  // Gestion des modales pour les paramètres (stat, module, user, etc.)
  if(mo.type === 'edit-stat' || mo.type === 'edit-module' || mo.type === 'edit-user' || mo.type === 'edit-affectation' || mo.type === 'edit-absence' || mo.type === 'edit-formation' || mo.type === 'edit-exam' || mo.type === 'add-folder' || mo.type === 'edit-folder' || mo.type === 'edit-ressource' || mo.type === 'block-ressource' || mo.type === 'add-tab' || mo.type === 'rename-tab' || mo.type === 'edit-tab-content' || mo.type === 'edit-post' || mo.type === 'add-document' || mo.type === 'add-transaction' || mo.type === 'add-notification' || mo.type === 'add-role' || mo.type === 'edit-role' || mo.type === 'edit-college-event' || mo.type === 'edit-personal-event'){
    // On construit le formulaire en fonction du type
    let title = 'Modifier';
    let body = '';
    let footer = `<button class="btn" data-action="close-modal">Annuler</button><button class="btn btn-primary" type="submit" form="modal-form">${icon('check')} Enregistrer</button>`;
    // On va utiliser des templates génériques pour simplifier, mais on peut les personnaliser.
    // Pour gagner de la place, on appelle une fonction générique qui construit le HTML.
    return renderGenericModal(mo);
  }
  return '';
}

            <option value="formations" ${d.type==='formations'?'selected':''}>Formations</option>
